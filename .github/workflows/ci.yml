name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - name: lint every script
        run: |
          shellcheck -s bash -S warning -e SC2034 \
            min install.sh uninstall.sh lib/*.sh test/*.sh completions/min.bash

  syntax:
    name: parses on bash ${{ matrix.bash }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bash: ["3.2", "5"]
    container: bash:${{ matrix.bash }}
    steps:
      - uses: actions/checkout@v4
      - name: parse every script
        run: |
          for f in min install.sh uninstall.sh lib/*.sh test/*.sh; do
            bash -n "$f" || exit 1
          done

  test-linux:
    name: tests on linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash test/run.sh
      - name: the macOS parts, against a fake macOS
        run: bash test/macos.sh
      - name: the windows parts, against a fake Git Bash
        run: bash test/windows.sh

  test-macos:
    name: tests on macos, with the bash macos ships
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: which bash is this
        run: /bin/bash --version | head -1
      - name: the real thing — bash 3.2
        run: /bin/bash test/run.sh
      - name: the macOS parts, on bash 3.2
        run: /bin/bash test/macos.sh
      - name: the windows parts, on bash 3.2
        run: /bin/bash test/windows.sh

  test-windows:
    name: tests on windows, in the bash git ships
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: which bash is this
        run: bash --version | head -1
      - name: the suite that runs anywhere
        run: bash test/run.sh -q
      - name: and the windows one, on real windows
        run: bash test/windows.sh -q

  install-windows:
    name: install and uninstall on windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: install
        run: ./install.sh --prefix "$HOME/bin"
      - name: it runs from the path
        run: |
          export PATH="$HOME/bin:$PATH"
          min version
          min help --no-color | grep -q "min startup"
          min doctor --no-color -q | grep -q Windows
      - name: uninstall
        run: |
          ./uninstall.sh
          test ! -e "$HOME/bin/min"

  install:
    name: install and uninstall cleanly
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: install
        run: ./install.sh --prefix "$HOME/.local/bin"
      - name: it runs from the path
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          min version
          min help --no-color | grep -q "min tidy"
          min preview --json | head -3
      - name: uninstall
        run: |
          ./uninstall.sh
          test ! -e "$HOME/.local/bin/min"
