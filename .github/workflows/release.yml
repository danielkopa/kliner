name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: cut a release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: the tag must match what the code says its version is
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file=$(tr -d ' \n' < VERSION)
          if [ "$tag" != "$file" ]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION ($file)" >&2
            exit 1
          fi

      - name: and both suites must pass on the bash macOS ships
        run: |
          /bin/bash test/run.sh -q
          /bin/bash test/macos.sh -q
          /bin/bash test/windows.sh -q

      - name: build the app people download
        run: bash app/build.sh

      - name: and it must be a real app before it goes anywhere
        run: |
          test -x app/build/Nimo.app/Contents/MacOS/Nimo
          test -f app/build/Nimo.app/Contents/Resources/nimo/min
          test -f app/build/Nimo.app/Contents/Resources/AppIcon.icns
          codesign --verify --deep --strict app/build/Nimo.app
          lipo -archs app/build/Nimo.app/Contents/MacOS/Nimo

      - name: take the notes out of the changelog
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "notes<<NIMO_EOF"
            awk -v want="## $version" '
              $0 == want { on = 1; next }
              on && /^## / { exit }
              on { print }' CHANGELOG.md
            echo ""
            echo "---"
            echo ""
            echo "### The app"
            echo ""
            echo "Download **Nimo.app.zip** below, unzip it, and drag Nimo into Applications."
            echo "The first time, right-click it and choose Open — it is not signed with a"
            echo "\$99-a-year Apple certificate, and macOS says so once."
            echo ""
            echo "### Or in a terminal"
            echo ""
            echo '```bash'
            echo "git clone --branch $GITHUB_REF_NAME git@github.com:danielkopa/nimo.git ~/nimo && ~/nimo/install.sh"
            echo '```'
            echo "NIMO_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: publish it
        uses: softprops/action-gh-release@v2
        with:
          name: nimo ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.notes }}
          files: app/build/Nimo.app.zip
          draft: false
          prerelease: false
