body, button, input, textarea, select, kbd { font-family: var(--font); }
body { -webkit-font-smoothing: antialiased; font-feature-settings: "kern" 1; }

/* ── the window: the page lies flat beside the side of it, the way
   Claude's does; one hairline between them, no card round the page ── */
.main { margin: 0; border-radius: 0; background-color: var(--bg); background-image: none; box-shadow: inset 1px 0 0 var(--line); }
@media (prefers-color-scheme: dark) { .main { box-shadow: inset 1px 0 0 var(--line); } }
.app.insp-on .main { margin-right: 0; }

/* the side: plain words, one soft pill where you are */
.app .sb .sb-places .spot, .app .sb .sb-foot .spot { color: var(--body); border-radius: 9px; }
.app .sb .sb-places .spot .label, .app .sb .sb-foot .spot .label { font-weight: 400; letter-spacing: 0; font-size: 14px; }
.app .sb .sb-places .spot .ic, .app .sb .sb-foot .spot .ic { color: var(--muted); stroke-width: 1.7; }
.app .sb .sb-places .spot:hover, .app .sb .sb-foot .spot:hover { background: var(--side-hover); color: var(--ink); }
.app .sb .sb-places .spot.on, .app .sb .sb-places .spot.on:hover { color: var(--ink); }
.app .sb .sb-places .spot.on .label { font-weight: 500; }
.app .sb .sb-places .spot.on .ic { color: var(--ink); }
.sb-places > .mark { border-radius: 9px; background: var(--side-sel); }
html.glass .sb-places > .mark, html.glass .app .sb .sb-foot .spot.on { background: color-mix(in srgb, var(--ink) 8%, transparent); }
.app .sb .sb-foot .spot.on { background: var(--side-sel); }
.app .sb .sb-places .spot .count { color: var(--faint); font-weight: 400; }
.sb .sb-find { border-radius: 10px; background: var(--side-field); border-color: var(--line); color: var(--muted); }
html.glass .sb .sb-find { background: color-mix(in srgb, var(--c-card) 70%, transparent); }
.sb .sb-find:hover { border-color: var(--line-2); }
.sb .sb-find .sb-keys kbd, html.glass .sb .sb-find .sb-keys kbd { background: var(--sel); color: var(--muted); font-weight: 500; }
.sb .you { border-top-color: var(--line); }
.sb .you .who2 b { font-weight: 500; }
.sb-mark { background: var(--ink); }

/* the bar: where you are, and a place's pages as soft tabs */
.bar .where, .bar .where * { font-weight: 400; }
.bar .where .name { color: var(--ink); font-weight: 500; }
.bar .where .tabs { background: var(--surf); box-shadow: none; border-radius: 10px; }
.bar .where .tabs .glide { border-radius: 8px; background: var(--c-card); box-shadow: 0 0 0 1px var(--c-line), 0 1px 2px rgba(31, 30, 29, .08); }
.bar .where .tab { font-weight: 500; }

/* ── the words you read first: Geist's semibold, set tight ── */
.ef-head h1 { font-weight: 600; font-size: 28px; line-height: 36px; letter-spacing: -.022em; }
.ef-head { min-height: 48px; padding-top: 12px; }
.ef-sec-h h2 { font-weight: 600; font-size: 19px; line-height: 28px; letter-spacing: -.015em; }
.apage > .head h1, .page > div.dpage.col .dh h1, .dh h1 { font-weight: 600; font-size: 26px; line-height: 34px; letter-spacing: -.022em; }
.set-h h1 { font-weight: 600; font-size: 26px; line-height: 34px; letter-spacing: -.022em; }
.set-h p { font-size: 14px; }
.set-sub { font-weight: 600; font-size: 17px; line-height: 24px; letter-spacing: -.01em; margin-top: 40px; }
.sh-head h2 { font-weight: 600; font-size: 17px; letter-spacing: -.012em; }
.st-head h1 { font-weight: 600; letter-spacing: -.03em; line-height: 1.1; font-size: 36px; }
.s-hello .st-head h1.hello-t { font-weight: 600; font-size: 54px; letter-spacing: -.045em; line-height: 1.04; }
@media (max-width: 760px) { .st-head h1 { font-size: 28px; } }

/* the big figures: the semibold, the unit beside it smaller and grey */
.ef-num b { font-weight: 600; font-size: 26px; line-height: 32px; letter-spacing: -.015em; }
.ef-num small { font: 400 13px/1 var(--font); color: var(--muted); }
.ef-num { margin-bottom: 4px; gap: 6px; }
.ef-lg b, .ef-v { font-weight: 600; font-size: 22px; line-height: 30px; letter-spacing: -.012em; }
.ef-v.sm { font-size: 20px; }
.ef-meter-t span { font-size: 18px; font-weight: 500; }
.ef-meter-t b { font-weight: 600; }
.ef-st b { font-size: 18px; line-height: 26px; font-weight: 600; letter-spacing: -.01em; }
.apage div.n > span { font-weight: 600; letter-spacing: -.02em; }
.apage div.v > span { font-weight: 600; letter-spacing: -.015em; }
.set-cover-w b { font-size: 18px; font-weight: 600; letter-spacing: -.012em; }

/* ── fewer boxes: a card is one surface with its name inside it ── */
.ef-tray { background: var(--c-card); border: 1px solid var(--c-line); border-radius: 16px; }
.ef-tray-h { height: 44px; padding: 0 10px 0 18px; }
.ef-landed .ef-tray-h, .ef-disk .ef-tray-h, .ef-hours .ef-tray-h { height: 48px; }
.ef-tray-t { font-size: 13.5px; line-height: 18px; letter-spacing: 0; font-weight: 500; color: var(--body); }
.ef-tray-t .ic { width: 14px; height: 14px; color: var(--muted); stroke-width: 1.7; }
.ef-sheet, .ef-landed .ef-sheet, .ef-disk .ef-sheet, .ef-hours .ef-sheet { margin: 0; border: 0; border-radius: 0 0 15px 15px;
    background: transparent; background-image: none; box-shadow: none; }
.ef-sheet::before { display: none; }
.ef-sheet.go:hover { transform: none; }
.ef-tray:has(> .ef-sheet.go:hover) { background: color-mix(in srgb, var(--c-card) 94%, var(--ink)); }
.ef-tray:has(> .ef-sheet.go) { transition: background .15s ease; }
.ef-ib { color: var(--muted); }
.ef-tb { height: 24px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--c-card); color: var(--body); font: 500 12px/1 var(--font); }
.ef-tb:hover { background: var(--surf); color: var(--ink); border-color: var(--line-2); }

/* the four figures: one card, four cells, a hairline between them */
.ef-kpis { gap: 0; border-radius: 16px; background: var(--c-card); border: 1px solid var(--c-line); overflow: hidden; }
.ef-kpis > .ef-tray { border: 0; border-radius: 0; background: transparent; }
.ef-kpis > .ef-tray + .ef-tray { box-shadow: inset 1px 0 0 var(--c-line); }
.ef-kpis > .ef-tray:has(> .ef-sheet.go:hover) { background: var(--hover); }
.ef-kpis .ef-tray-h { height: 40px; padding: 4px 10px 0 18px; }
.ef-kpis .ef-sheet { padding: 2px 18px 18px; }
@container (max-width: 780px) {
    .ef-kpis > .ef-tray:nth-child(3) { box-shadow: none; }
    .ef-kpis > .ef-tray:nth-child(n+3) { border-top: 1px solid var(--c-line); }
}
.page > div.ef-home { gap: 26px; }

/* the charts: soft solid bars with round tops, in the paper's greys */
.ef-bar { gap: 1px; }
.ef-bar i { background: var(--c); box-shadow: none; border-radius: 0; }
.ef-bar i:last-child { border-radius: 3px 3px 0 0; }
.ef-bar i.nil { background: var(--line); border-radius: 0; }
.ef-bars.hours .ef-bar i { --c: var(--e-s3); background: var(--c); border-radius: 3px 3px 0 0; }
.ef-bars.hours .ef-bar.hot i { --c: var(--e-s1); }
.ef-fill { border-top-width: 2px; background: color-mix(in srgb, var(--e-meter) 18%, transparent); }
.ef-meter-b { background: color-mix(in srgb, var(--e-meter) 9%, transparent); }
.ef-axis span { color: var(--faint); }

/* every other page: its blocks are cards, the same as Home's */
.apage .panel:not(.tile):not(.live):not(.kpis):not(.sheet-card) { background: var(--c-card); border: 1px solid var(--c-line); border-radius: 16px; }
.apage .panel:not(.tile):not(.live):not(.kpis):not(.sheet-card)::after { display: none; }
.apage .panel:not(.tile):not(.live):not(.kpis):not(.sheet-card) > .cap { height: 44px; min-height: 44px; margin: 0 -8px 8px -2px;
    font-size: 13.5px; font-weight: 500; letter-spacing: 0; color: var(--body); }
.apage .panel:not(.tile):not(.live):not(.kpis):not(.sheet-card) > .cap > .ic { width: 14px; height: 14px; color: var(--muted); }
.apage .panel.tile, .apage .panel.live { background: var(--c-card); border: 1px solid var(--c-line); border-radius: 16px; }

/* ── what you press ── */
.ef-btn { border-radius: 9px; border-color: var(--line-2); background: var(--c-card); font-weight: 500; font-size: 13.5px; }
.ef-btn:hover { background: var(--surf); border-color: var(--line-2); }
.btn.fill { border-radius: 9px; font-weight: 500; }
.btn.line, .btn.small, .dpage.col .tl-do.btn.small { border-radius: 9px; border-color: var(--line-2); background: var(--c-card); }
.btn.line:hover, .btn.small:hover { background: var(--surf); border-color: var(--line-2); }
.ef-seg, .setp .seg { border: 0; background: var(--surf); border-radius: 10px; }
.ef-seg button.on, .setp .seg button.on { background: var(--c-card); box-shadow: 0 0 0 1px var(--c-line), 0 1px 2px rgba(31, 30, 29, .08); }
.setp .field, .youform .field, .s-you .field { background: var(--c-card); border-color: var(--line-2); }
.setp .field:focus { border-color: var(--edge); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ink) 8%, transparent); }
.ugroup { background: var(--c-card); border-color: var(--line-2); }
.ug-pre { background: var(--surf); border-right-color: var(--line); }

/* ── Settings: the list down the left in the side's manner ── */
.set-tab { font-weight: 400; letter-spacing: 0; color: var(--body); border-radius: 9px; }
.set-tab .ic { color: var(--muted); }
.set-tab.on { background: var(--sel); color: var(--ink); font-weight: 500; }
.set-tab.on .ic { color: var(--ink); }
.set-me-w b { font-weight: 500; }
.srow { border-top-color: var(--line); }
.set-cover { border-radius: 16px; }
.kc kbd { background: var(--surf); border-color: var(--line); box-shadow: none; }

/* ── what floats over the page: ⌘K, the sheets, a toast ── */
.fcard { background: var(--raise); border-color: var(--line-2); box-shadow: var(--pop-shadow); border-radius: 18px; }
.fsec { text-transform: none; letter-spacing: 0; font-size: 12px; font-weight: 500; color: var(--faint); }
.frow { border-radius: 10px; }
.frow .fn { font-size: 14px; }
.frow .ft { background: var(--surf); border-color: var(--line); }
.fpulse { background: var(--surf); border-color: var(--line); }
.sheet-card { background: var(--raise); border-color: var(--line-2); box-shadow: var(--pop-shadow); border-radius: 20px; }
.ksheet { background: color-mix(in srgb, var(--ground) 50%, transparent); }
.finder { background: color-mix(in srgb, var(--ground) 45%, transparent); }
.toast { background: var(--raise); border-color: var(--line-2); box-shadow: var(--lift); border-radius: 12px; }
#chip.chip.ef { border-radius: 10px; }

/* ── the first minute, in the same paper ── */
.intro { background: var(--bg); }
.hd { background: var(--c-card); box-shadow: inset 0 0 0 1px var(--c-line); }
.acc { background: var(--c-card); border-color: var(--c-line); border-radius: 16px; }
.btn.large { border-radius: 10px; }

/* the disk as one plain bar: how full, in words over it */
.ef-meter { height: auto; margin-top: auto; padding: 0 18px 20px; -webkit-mask-image: none; mask-image: none; }
.ef-mark { display: none; }
.ef-meter-t { height: auto; }
.ef-meter-t span, .ef-meter.left .ef-meter-t span { position: static; display: block; margin-bottom: 10px; }
.ef-meter-b { height: 10px; border-radius: 6px; background: var(--surf-2); -webkit-mask-image: none; mask-image: none; overflow: hidden; }
.ef-fill { height: 100%; border-top: 0; border-radius: 6px; background: var(--e-s1); }
.ef-disk .ef-sheet { min-height: 0; }

/* the pane on Send: a hairline between it and the page */
.td-name, .insp .td-name { font-weight: 600; font-size: 22px; letter-spacing: -.015em; line-height: 1.25; }
.app.insp-on .main { box-shadow: inset 1px 0 0 var(--line), inset -1px 0 0 var(--line); }
.tr-top h2 { font-weight: 600; font-size: 17px; letter-spacing: -.012em; }
.tour-card h3 { font-weight: 600; font-size: 16px; letter-spacing: -.012em; }

/* ── v19: things that move, after kravio and seven libraries ───────────────
   Dan sent kravio's dashboard — "you see the animations, everything, do it
   for me too" — and seven libraries of moving parts to use, now. None of
   them is loaded: each piece is Kliner's own, drawn the way they draw it,
   in the window's warm greys. The figures roll (rollFigure); the four on
   Home each have a small picture beside them, a ring for a share and a line
   for what landed each day; the disk is a gauge of forty ticks; the chart
   of what landed has a scale, its busiest day named and a dashed line that
   goes to the day you point at, its third grey hatched; a switch has one
   light that slides; ⌘K has one too; a sheet and a toast leave the way they
   came; a file on its way is an island in the middle of the bar; the first
   greeting arrives a letter at a time. One curve for arriving (`--arrive`),
   one for gliding (`--glide`), one spring (`--spring`), and every one of
   them stops for reduced motion. */

:root {
    --mo-track: #ece9e0; --mo-well: #f3f1ea;
    --isl-bg: #1f1e1d; --isl-hover: #2d2c2a; --isl-ink: #f4f3ee; --isl-track: rgba(244, 243, 238, .22);
    --isl-good: #7cc79b; --isl-bad: #e8876f;
    --isl-shadow: 0 10px 26px -10px rgba(31, 30, 29, .55);
}
@media (prefers-color-scheme: dark) {
    :root {
        --mo-track: #42413d; --mo-well: #393835;
        --isl-bg: #0f0f0e; --isl-hover: #1b1b19; --isl-ink: #f4f3ee; --isl-track: rgba(244, 243, 238, .2);
        --isl-shadow: 0 10px 26px -8px rgba(0, 0, 0, .7), inset 0 0 0 1px rgba(244, 243, 238, .08);
    }
}

/* ── a figure rolling: a strip of digits behind a window one digit tall ── */
[data-fig] { font-variant-numeric: tabular-nums; }
.rd { position: relative; display: inline-block; clip-path: inset(0 -2px); }
.rd-v { visibility: hidden; }
.rd-s { position: absolute; top: 0; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; will-change: transform; }
.rd-s > span { display: block; }

/* ── the four figures: the number, and its picture on the right ── */
.ef-kv { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; min-height: 36px; margin-bottom: 4px; }
.ef-kv > .ef-num { margin-bottom: 0; min-width: 0; }
.ef-viz { flex: none; display: block; line-height: 0; }
.ef-ring { display: block; width: 36px; height: 36px; }
.ef-ring circle { fill: none; stroke-width: 4.2; }
.ef-ring .k { stroke: var(--e-s1); }
.ef-ring .f { stroke: var(--e-s2); }
.ef-ring .u { stroke: var(--e-s3); }
.arrive .ef-ring circle, .ef-ring.grow circle { animation: moArc .9s var(--arrive) calc(var(--d, 0ms) + 200ms + var(--n, 0) * 150ms) backwards; }
@keyframes moArc { from { stroke-dasharray: 0 94.25; } }

.ef-sparkbox { width: 88px; height: 32px; }
.ef-spark { display: block; color: var(--e-s1); overflow: visible; }
.ef-spark .ln { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
.ef-spark .pt { fill: var(--c-card); stroke: currentColor; stroke-width: 1.6; transform-box: fill-box; transform-origin: center; }
.ef-spark .pg { fill: currentColor; opacity: 0; transform-box: fill-box; transform-origin: center; }
.arrive .ef-spark, .ef-spark.grow { animation: moReveal 1.1s var(--arrive) calc(var(--d, 0ms) + 220ms) backwards; }
.arrive .ef-spark .pt, .ef-spark.grow .pt { animation: moDot .5s var(--spring) calc(var(--d, 0ms) + 1050ms) backwards; }
.arrive .ef-spark .pg, .ef-spark.grow .pg { animation: moPing 1.5s ease-out calc(var(--d, 0ms) + 1200ms); }
@keyframes moReveal { from { clip-path: inset(-4px 100% -4px 0); } to { clip-path: inset(-4px -4px -4px 0); } }
@keyframes moDot { from { transform: scale(0); } }
@keyframes moPing { 0% { opacity: .5; transform: scale(1); } 100% { opacity: 0; transform: scale(3.6); } }

/* "Measuring the caches…", and every wait, lit along as it goes */
.wait h3, .ef-sub.shim {
    background: linear-gradient(90deg, var(--muted) 0%, var(--muted) 38%, var(--ink) 50%, var(--muted) 62%, var(--muted) 100%);
    background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: moShimmer 2.2s linear infinite; }
@keyframes moShimmer { from { background-position: 100% 0; } to { background-position: 0% 0; } }

/* ── your disk: forty ticks round half a circle ── */
.ef-disk .ef-sheet { padding: 0; }
.ef-gauge { position: relative; width: min(100% - 32px, 236px); margin: 16px auto 0; }
.ef-gauge-g { display: block; width: 100%; height: auto; overflow: visible; }
.ef-gauge-g line { stroke: var(--mo-track); stroke-width: 3.8; stroke-linecap: round; }
.ef-gauge-g line.on { stroke: var(--e-s1); }
.arrive .ef-gauge-g line.on { animation: moTick .34s ease calc(var(--d, 0ms) + 260ms + var(--t, 0) * 21ms) backwards; }
@keyframes moTick { from { stroke: var(--mo-track); } }
.ef-gv { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; }
.ef-gv b { font-size: 30px; line-height: 34px; font-weight: 600; letter-spacing: -.022em; color: var(--ink); }
.ef-gv > span { font-size: 12px; line-height: 16px; color: var(--muted); }
.ef-disk .ef-pair { padding: 12px 18px 18px; }

/* ── what landed: a scale, the busiest day, a line to the day you point at ── */
.ef-bars { position: relative; }
.ef-bars > .ef-bar { position: relative; z-index: 1; }
.ef-landed .ef-plot { padding: 38px 52px 0 20px; }
.ef-landed .ef-axis { margin: 0 52px 0 20px; }
.ef-ys { position: absolute; z-index: 0; top: 0; bottom: 0; left: 0; right: -40px; pointer-events: none; }
.ef-ys i { position: absolute; left: 0; right: 40px; height: 0; border-top: 1px dashed var(--line); }
.ef-ys i.z { border-top-style: solid; }
.ef-ys span { position: absolute; right: 0; width: 32px; text-align: right; transform: translateY(50%);
    font-size: 11px; line-height: 14px; color: var(--faint); font-variant-numeric: tabular-nums; }
.ef-guide { position: absolute; z-index: 2; left: 0; right: 0; height: 0; border-top: 1px dashed var(--e-s1); opacity: .75; pointer-events: none;
    transition: bottom .32s var(--glide), opacity .2s ease; }
.ef-guide.off { opacity: 0; }
.ef-peak { position: absolute; z-index: 3; display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 7px;
    transform: translate(-50%, -9px); background: var(--ink); color: var(--c-card); font-size: 11.5px; line-height: 1; white-space: nowrap;
    pointer-events: none; box-shadow: var(--lift); transition: opacity .18s ease; }
.ef-peak span { color: color-mix(in srgb, var(--c-card) 62%, transparent); }
.ef-peak b { font-weight: 600; font-variant-numeric: tabular-nums; }
.ef-peak::after { content: ""; position: absolute; left: 50%; bottom: -3px; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 1px;
    background: inherit; transform: rotate(45deg); }
.ef-peak.l { transform: translate(-14px, -9px); }
.ef-peak.l::after { left: 14px; }
.ef-peak.r { transform: translate(calc(-100% + 14px), -9px); }
.ef-peak.r::after { left: auto; right: 10.5px; }
.ef-bars.pointing .ef-peak { opacity: 0; }
.arrive .ef-peak, .ef-bars.grow .ef-peak { animation: moFlag .55s var(--spring) calc(var(--d, 0ms) + 860ms) backwards; }
.arrive .ef-guide, .ef-bars.grow .ef-guide, .arrive .ef-ys { animation: moFade .5s ease calc(var(--d, 0ms) + 760ms) backwards; }
.ef-bars.grow .ef-ys { animation: moFade .3s ease backwards; }
@keyframes moFlag { from { opacity: 0; scale: .6; } }
@keyframes moFade { from { opacity: 0; } }
/* the third grey hatched, so three series read apart without a colour */
.ef-bar i.s3 { background: repeating-linear-gradient(-45deg, var(--e-s2) 0 1px, var(--e-s3) 1px 4px); }
.ef-dot.s3 { background: repeating-linear-gradient(-45deg, var(--e-s2) 0 1px, var(--e-s3) 1px 3px); }

/* the hours: each bar in its own grey track, and four of them named */
.ef-bars.hours .ef-bar { background: var(--mo-well); border-radius: 3px; overflow: hidden; }
.ef-bars.hours .ef-bar i.nil { visibility: hidden; }
.ef-bars.hours { margin-bottom: 4px; }
.ef-axis.hours { height: 22px; margin: 0 16px 6px; }
.ef-axis.hours span { top: 3px; transform: none; font-size: 11px; }

/* the label over a bar slides to the next bar rather than blinking */
#chip.chip.slides { transition: left .2s var(--glide), top .2s var(--glide), opacity .12s ease, transform .12s ease; }

/* ── one light under the picked button of a switch, sliding ── */
div.ef-seg, div.seg { position: relative; isolation: isolate; }
.sg { position: absolute; z-index: 0; left: 0; top: 0; border-radius: 8px; pointer-events: none; background: var(--sel-2);
    transition: transform .42s var(--glide), width .42s var(--glide), opacity .2s ease; }
.ef-seg > .sg, .setp .seg > .sg { background: var(--c-card); box-shadow: 0 0 0 1px var(--c-line), 0 1px 2px rgba(31, 30, 29, .08); }
.sg.jump { transition: none; }
.glides > button { position: relative; z-index: 1; }
.glides > button.on { background: transparent !important; box-shadow: none !important; }

/* ── ⌘K: one light under the row you are on, and the rows arriving ── */
.flist.glides { position: relative; }
.fglide { position: absolute; z-index: 0; left: 0; top: 0; border-radius: 10px; background: var(--sel); pointer-events: none; opacity: 0;
    transition: transform .22s var(--glide), height .22s var(--glide), opacity .15s ease; }
.fglide.jump { transition: opacity .15s ease; }
.flist.glides .frow { position: relative; z-index: 1; }
.flist.glides .frow.on { background: transparent; }
.flist.fresh .frow { animation: moRowIn .4s var(--arrive) calc(50ms + var(--r, 0) * 26ms) backwards; }
.flist.fresh .fsec { animation: moFade .3s ease 50ms backwards; }
@keyframes moRowIn { from { opacity: 0; transform: translateY(7px); } }

/* ── a sheet and a toast arrive out of a little blur, and leave the way
   they came ── */
.sheet-card { animation: moSheetIn .44s var(--arrive) both; }
@keyframes moSheetIn { from { opacity: 0; transform: translateY(16px) scale(.965); filter: blur(6px); } }
.ksheet-out { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 24px; pointer-events: none;
    background: color-mix(in srgb, var(--ground) 50%, transparent); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    animation: moOut .22s ease both; }
.ksheet-out > .sheet-card { animation: moSheetOut .2s ease both; }
@keyframes moOut { to { opacity: 0; } }
@keyframes moSheetOut { to { opacity: 0; transform: translateY(8px) scale(.97); filter: blur(3px); } }
.toast { animation: moToastIn .55s var(--spring) both; }
.toast.out { pointer-events: none; animation: moToastOut .2s ease both; }
@keyframes moToastIn { from { opacity: 0; transform: translate(-50%, 18px) scale(.94); } }
@keyframes moToastOut { to { opacity: 0; transform: translate(-50%, 8px) scale(.97); } }

/* ── the island: a file on its way, in the middle of the bar ── */
.main > .bar { position: relative; }
.isl { position: absolute; z-index: 5; left: 50%; top: 10px; height: 32px; width: 36px; padding: 0; transform: translateX(-50%);
    display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 16px;
    background: var(--isl-bg); color: var(--isl-ink); box-shadow: var(--isl-shadow);
    transition: width .55s cubic-bezier(.3, 1.25, .45, 1), left .45s var(--glide), background .2s ease, transform .25s var(--spring); }
.isl:hover { background: var(--isl-hover); }
.isl:active { transform: translateX(-50%) scale(.96); }
.isl-in { display: inline-flex; align-items: center; gap: 8px; flex: none; width: max-content; padding: 0 12px 0 8px;
    font: 500 12.5px/1 var(--font); white-space: nowrap; }
.isl-ring { position: relative; flex: none; width: 20px; height: 20px; }
.isl-ring svg { display: block; width: 20px; height: 20px; }
.isl-ring circle { fill: none; stroke-width: 2.4; }
.isl-ring .tr { stroke: var(--isl-track); }
.isl-ring .arc { stroke: var(--isl-ink); stroke-linecap: round; transition: stroke-dasharray .35s linear, stroke .3s ease; }
.isl-ring .ic { position: absolute; left: 4px; top: 4px; width: 12px; height: 12px; stroke-width: 3; opacity: 0; transform: scale(.3);
    transition: opacity .2s ease, transform .4s var(--spring); }
.isl[data-state="done"] .arc { stroke: var(--isl-good); }
.isl[data-state="done"] .isl-ok { opacity: 1; transform: none; color: var(--isl-good); }
.isl[data-state="failed"] .arc { stroke: var(--isl-bad); }
.isl[data-state="failed"] .isl-no { opacity: 1; transform: none; color: var(--isl-bad); }
.isl[data-state="asking"] .isl-ring svg, .isl[data-state="waiting"] .isl-ring svg { animation: turn 1s linear infinite; }
.isl[data-state="asking"] .arc, .isl[data-state="waiting"] .arc { stroke-dasharray: 14 50.27 !important; }
.isl-t { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.isl-t.swap { animation: moIslText .45s var(--arrive); }
.isl-p { font-weight: 600; font-variant-numeric: tabular-nums; }
.isl-p:empty { display: none; }
.isl.small .isl-t { display: none; }
.isl.opening { animation: moIslIn .55s var(--spring) backwards; }
.isl.closing { pointer-events: none; animation: moIslOut .26s ease both; }
@keyframes moIslIn { from { opacity: 0; transform: translateX(-50%) scale(.55); } }
@keyframes moIslOut { to { opacity: 0; transform: translateX(-50%) scale(.7); } }
@keyframes moIslText { from { opacity: 0; transform: translateY(4px); filter: blur(4px); } }

/* a bar that is filling has a light running along it */
.td-bar.go i, .tx-track.go i { position: relative; overflow: hidden; }
.td-bar.go i::after, .tx-track.go i::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--c-card) 60%, transparent), transparent);
    animation: moSheen 1.6s linear infinite; animation-delay: inherit; }
@keyframes moSheen { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

/* ── the first greeting, a letter at a time ── */
.glt-w { display: inline-block; white-space: nowrap; }
.glt-c { display: inline-block; animation: moLetter .8s var(--arrive) calc(60ms + var(--c, 0) * 26ms - var(--gt, 0ms)) backwards; }
.arrive .ef-head h1.glt, .ef-head h1.glt { animation: none; }
@keyframes moLetter { from { opacity: 0; transform: translateY(.32em); filter: blur(8px); } }

/* what you press gives a little under your finger */
.ef-ib, .bar .sq, .set-tab, .fscope { transition: background .15s ease, color .15s ease, transform .25s var(--spring); }
.ef-ib:active, .bar .sq:active, .set-tab:active, .fscope:active { transform: scale(.94); }

@media (prefers-reduced-motion: reduce) {
    .rd-s, .ef-spark, .ef-spark *, .ef-ring circle, .ef-gauge-g line, .ef-peak, .ef-guide, .ef-ys, .sg, .fglide,
    .flist.fresh .frow, .flist.fresh .fsec, .sheet-card, .ksheet-out, .ksheet-out > .sheet-card, .toast, .toast.out,
    .isl, .isl *, .glt-c, .wait h3, .ef-sub.shim, .td-bar.go i::after, .tx-track.go i::after, #chip.chip.slides {
        animation: none !important; transition: none !important; }
}

/* ── v20: the glass back on both sides ─────────────────────────────────────
   Dan, after v19: "the pictures 1, 2, 3 — I want the sides glass again,
   100%". Those were the dashboard he picked for v13 to v15: the rail, the
   window's edge round the page and the pane on the right are one piece of
   the window's glass, and the page is a sheet floating on it. v18 had laid
   a veil of paper over that glass, 86% of it, which made the glass paper.
   So the veil is thin again — enough to keep the words on it readable and
   the wallpaper's colour from shouting (he asked for clear glass once, not
   coloured), not enough to hide that it is glass — and the page floats
   again: inset from the window's edge, round-cornered, a hairline and a
   soft shadow under it. A window that is not glass (an app that does not
   say so) gets the same frame in the side's own paper. */

:root {
    --veil: rgba(246, 244, 238, .34);
    --sheen: linear-gradient(160deg, rgba(255, 255, 255, .42), rgba(255, 255, 255, 0) 42%);
    --page-lift: 0 0 0 1px rgba(31, 30, 29, .09), 0 1px 2px rgba(31, 30, 29, .05), 0 12px 32px -14px rgba(31, 30, 29, .22);
}
@media (prefers-color-scheme: dark) {
    :root {
        --veil: rgba(28, 27, 26, .38);
        --sheen: linear-gradient(160deg, rgba(255, 255, 255, .06), rgba(255, 255, 255, 0) 42%);
        --page-lift: 0 0 0 1px rgba(240, 238, 230, .08), 0 14px 36px -14px rgba(0, 0, 0, .7);
    }
}
.main { margin: 8px 8px 8px 0; border-radius: 14px; overflow: hidden; box-shadow: var(--page-lift); }
.app.insp-on .main { margin-right: 0; box-shadow: var(--page-lift); }
@media (prefers-color-scheme: dark) { .main { box-shadow: var(--page-lift); } }

/* ── v20: Home's send box, quick actions, Done lately and This Mac ──
   The send box is the pane's own (#snd), moved onto Home; these are its
   manners here, on a card rather than on the glass. */
.ef-send .ef-sheet, .ef-quick .ef-sheet, .ef-done .ef-sheet, .ef-mac .ef-sheet { display: flex; flex-direction: column; gap: 14px; padding: 2px 18px 16px; }
.ef-snd .panel.snd { margin: 0; padding: 10px 10px 10px 16px; gap: 2px; border: 0; border-radius: 14px; background: var(--surf);
    box-shadow: inset 0 0 0 1px var(--line); transition: box-shadow .2s ease; }
.ef-snd .panel.snd:focus-within { box-shadow: inset 0 0 0 1px var(--line-2), 0 0 0 3px color-mix(in srgb, var(--ink) 6%, transparent); }
.arrive .ef-snd .panel.snd { animation: none; }
body.dropping .ef-snd .panel.snd { box-shadow: inset 0 0 0 1.5px var(--data); }
.ef-snd .sc-top { min-height: 36px; }
.ef-snd .sc-to .at { font-size: 18px; color: var(--faint); }
.ef-snd .snd .snd-field { height: 36px; font-size: 18px; color: var(--ink); }
.ef-snd .snd .snd-field::placeholder { color: var(--faint); }
.ef-snd .snd .snd-who { font-size: 13px; }
.ef-snd .sc-foot { margin-top: 10px; gap: 10px; }
.ef-snd .sc-chips { gap: 6px; }
.ef-snd .sc-chip { height: 32px; padding: 0 12px 0 10px; font-size: 13.5px; background: var(--c-card); color: var(--body);
    box-shadow: inset 0 0 0 1px var(--line); }
.ef-snd .sc-chip:hover { background: var(--hover); }
.ef-snd .sc-chip.sp { padding: 0 12px 0 4px; }
.ef-snd .sc-chip.sp .pf { width: 24px; height: 24px; font-size: 11px; }
.ef-snd .sc-chip.sp.on { background: var(--ink); color: var(--on-ink); box-shadow: none; }
.ef-snd .sc-go { width: 34px; height: 34px; }
.ef-snd-h { font-size: 12px; line-height: 16px; color: var(--muted); }
.ef-snd-l { display: flex; flex-direction: column; gap: 4px; }
.ef-snd-l .tl, .ef-quick .tl, .ef-done .tl { margin: 0 -10px -6px; }
.ef-quick .tl, .ef-done .tl { margin-top: -4px; }
.ef-today .tl-row, .ef-later .tl-row { min-height: 50px; padding: 7px 10px; border-radius: 10px; }
.ef-today .tl-ic, .ef-later .tl-ic { background: var(--surf); color: var(--body); }
.ef-snd-l .tl-row.sp .tl-ic.pf { border-radius: 50%; font-size: 12px; font-weight: 600; }
.ef-today .tl-key { background: var(--surf); box-shadow: inset 0 0 0 1px var(--line); color: var(--muted); }

/* This Mac: a name and a value a line, the battery drawn */
.ef-facts { display: flex; flex-direction: column; margin-top: -4px; }
.ef-fact { display: flex; align-items: center; gap: 12px; min-height: 42px; border-top: 1px solid var(--line); font-size: 13.5px; }
.ef-fact:first-child { border-top: 0; }
.ef-fact > span:first-child { flex: 1; min-width: 0; color: var(--muted); }
.ef-fact b { font-weight: 500; color: var(--ink); white-space: nowrap; }
.ef-batt { position: relative; flex: none; width: 30px; height: 14px; padding: 2px; border-radius: 4px; box-shadow: inset 0 0 0 1.5px var(--e-s2); }
.ef-batt::after { content: ""; position: absolute; top: 4px; right: -3.5px; width: 2px; height: 6px; border-radius: 0 1px 1px 0; background: var(--e-s2); }
.ef-batt i { display: block; width: var(--b); height: 100%; border-radius: 2px; background: var(--e-s1); }
.arrive .ef-batt i { animation: efFill .9s var(--arrive) calc(var(--d, 0ms) + 300ms) backwards; }
@media (prefers-reduced-motion: reduce) { .arrive .ef-batt i { animation: none; } }
.ef-send.lists-people .sc-people { display: none; }
/* a file on its way, as a row on Home: the same row as Send's list */
.ef-snd-l .tl-row.tx-row { display: flex; grid-template-columns: none; border-top: 0; padding: 7px 10px; cursor: pointer; }
.ef-snd-l .tx-st { flex: none; width: 140px; display: flex; justify-content: flex-end; }
.ef-snd-l .tx-st .tx-prog { width: 140px; }
.ef-snd-l .tx-act { flex: none; display: flex; gap: 6px; }
.ef-snd-l .tx-track { height: 4px; background: var(--sel-2); }
.ef-snd-l .tx-track i { background: var(--good); }

/* ── v20: your @username, changed in place, and a code from kliner.app ──
   The field says what kliner.app said about a name: free, somebody's, kept
   a week for whoever gave it up, or held on the site for whoever has its
   code — and then the code goes in beside it. A name you gave up is kept for
   you, with the way back under your name. */
.userline .ucodeline { order: 4; flex: 1 1 100%; display: flex; gap: 8px; min-width: 0; }
.userline .ucodeline[hidden] { display: none; }
.userline .ucode { flex: 1 1 auto; min-width: 0; max-width: 260px; height: 36px; padding: 0 12px; border-radius: 10px; font: 500 14px/20px var(--font);
    letter-spacing: .06em; font-variant-numeric: tabular-nums; text-transform: uppercase; }
.userline .ugroup { min-width: 220px; }
.userline .ucode::placeholder { letter-spacing: 0; text-transform: none; }
.userline .unote.kept { color: var(--muted); }
.userline .unote .link { font-size: inherit; color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
.uclaim .ucode.big { display: block; width: min(320px, 100%); height: 48px; margin: 14px auto 0; padding: 0 16px; border-radius: 12px;
    text-align: center; font: 600 19px/1 var(--font); letter-spacing: .12em; text-transform: uppercase; }
.uclaim .ucode.big::placeholder { font-weight: 450; letter-spacing: 0; text-transform: none; color: var(--faint); }
.uclaim .ucode.big[hidden] { display: none; }
.ufield.big[data-state="code"] .field, .ufield.big[data-state="held"] .field { border-color: var(--line-2); }
.ufield.big[data-state="wrongCode"] .field { border-color: color-mix(in srgb, var(--bad) 55%, var(--line-2)); }

/* ── v20: Settings › Profile, and the page as a part of its own ── */
.prof-two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; flex: 1 1 100%; }
.srow-r:has(> .prof-two) { justify-content: flex-start; }
@container (max-width: 760px) { .prof-two { grid-template-columns: minmax(0, 1fr); } }
.srow-r > .ef-btn .ic { width: 14px; height: 14px; margin-left: 2px; }
.set-foot.quiet { border-top: 0; padding-top: 28px; }
.setp .set-cover { height: 132px; }
.set-body > .set-cover + .srow { border-top: 0; }
/* a bare button is words, not a box, small or not */
.btn.bare.small { border-color: transparent; background: transparent; }
.btn.bare.small:hover { background: var(--hover); }
.set-foot .btn.danger { color: var(--muted); font-weight: 400; }
.set-foot .btn.danger:hover, .set-foot .btn.danger.sure { color: var(--bad); }

/* the work and the links, one row at a time */
.prof-work .wk-row[hidden], .prof-links .field[hidden], .grow-more[hidden] { display: none; }
.prof-work .wk-row:has(+ .wk-row[hidden]), .prof-work .wk-row:has(+ .grow-more) { border-bottom: 0; padding-bottom: 0; }
.grow-more { align-self: flex-start; justify-self: start; gap: 6px; margin-left: -8px; color: var(--muted); }
.grow-more:hover { color: var(--ink); }
.grow-more .ic { width: 14px; height: 14px; }

/* ── v21: your account, one form and your card beside it ──
   The starter's name-and-email step and its @username step are one, laid
   the way a sign-up is: three boxes with their names over them, the same
   size, and on the right your card, over your wallpaper, painted as you
   type. */
.st-card.s-account { grid-template-rows: auto minmax(0, 1fr) auto auto; }
.s-account .st-stage::before { display: none; }
.acct { width: min(760px, 100%); display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 48px; align-items: center; }
.acct.st-pop { animation: accIn .45s cubic-bezier(.2, .9, .3, 1) .05s backwards; }
.acct-form { display: grid; gap: 18px; min-width: 0; }
.acct-row { display: grid; gap: 7px; min-width: 0; }
.acct-k { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; font-size: 12.5px; font-weight: 550;
    color: var(--body); }
.acct-k i { font-style: normal; font-weight: 400; color: var(--faint); }

    'questionmark.circle': 'help', 'display': 'desk', 'internaldrive': 'disk',
    'cpu': 'cpu', 'tray.and.arrow.down': 'tray', 'chevron.right': 'right',
    'chevron.left': 'left', 'eye': 'eye', 'arrow.clockwise': 'refresh', 'play': 'play',
    'menubar.dock.rectangle': 'desk', 'doc.text': 'file', 'bell': 'bell',
    'camera.viewfinder': 'camera', 'doc.on.doc': 'file',
};

function icon(name, cls) {
    const key = SYMBOLS[name] || name;
    const paths = PATHS[key] || PATHS.dot;
    return s('svg', { class: 'ic' + (cls ? ' ' + cls : ''), viewBox: '0 0 24 24', 'aria-hidden': 'true' },
             paths.map(d => s('path', { d })));
}

function wordMark(cls) {
    const svg = s('svg', { class: 'word-mark' + (cls ? ' ' + cls : ''), viewBox: `0 0 ${WORD.w} ${WORD.h}`,
                           role: 'img', 'aria-label': 'Kliner' });
    svg.append(s('path', { class: 'wm-word', d: WORD.word, 'fill-rule': 'evenodd' }),
               s('g', { class: 'wm-eyes' }, s('path', { d: WORD.eyes, 'fill-rule': 'evenodd' })));
    return svg;
}

function eyesMark(cls) {
    // room round them for the way they move: 40 left and right, 60 below.
    // Two groups, not one: `eyes` carries the glance traced off the film,
    // `lids` the blink. A blink on the same group would fight the glance for
    // the transform, and one of the two would win.
    const svg = s('svg', { class: 'eyes-mark ' + (cls || ''), viewBox: '102 134 334 285', 'aria-hidden': 'true' });
    const eyes = s('g', { class: 'eyes' });
    const lids = s('g', { class: 'lids' });
    lids.append(s('g', { transform: 'translate(0,512) scale(0.1,-0.1)' }, s('path', { class: 'eye', d: EYES })));
    eyes.append(lids);
    svg.append(eyes);
    return svg;
}

function mascot(cls) {
    const svg = s('svg', { class: cls || '', viewBox: '0 0 100 100', 'aria-hidden': 'true' });
    const whole = s('g', { class: 'whole' });
    whole.append(s('path', { class: 'body', d: MASCOT.body }));
    const eyes = s('g', { class: 'eyes' });
    eyes.append(s('path', { class: 'eye', d: MASCOT.left }), s('path', { class: 'eye', d: MASCOT.right }));
    whole.append(eyes);
    svg.append(whole);
    return svg;
}

/* ── numbers, the way nimo writes them ────────────────────────────────── */

/** "2.1 GB" → bytes. A bare number reads as bytes, the way nimo's own does. */
function bytes(text) {
    const m = /^\s*(-?[\d.]+)\s*([KMGT]?B)?\s*$/i.exec(String(text || ''));
    if (!m) return null;
    const value = parseFloat(m[1]);
    if (!isFinite(value)) return null;
    const unit = (m[2] || 'B').toUpperCase();
    const scale = { B: 1, KB: 1e3, MB: 1e6, GB: 1e9, TB: 1e12 }[unit] || 1;
    return value * scale;
}

/** Whether a figure carries a unit. `142` is a hundred and forty-two things. */
function hasUnit(text) {
    return /^\s*[\d.,]+\s*([KMGT]?B)\s*$/i.test(String(text || ''));
}

/** And back again, the way nimo would have said it. */
function size(value) {
    const units = [[1e12, 'TB'], [1e9, 'GB'], [1e6, 'MB'], [1e3, 'KB']];
    for (const [scale, name] of units) {
        if (value >= scale) {
            const n = value / scale;
            // one decimal under a hundred, the way nimo prints them
            return (n >= 100 ? Math.round(n).toString() : n.toFixed(1)) + ' ' + name;
        }
    }
    return Math.round(value) + ' B';
}

/** Split "29.5 GB" into the figure and its unit, so the unit can be small. */
function figure(text) {
    const m = /^\s*([\d.,]+)\s*(.*)$/.exec(String(text || ''));
    return m ? [m[1], m[2]] : [String(text || ''), ''];
}

/** The first whole number in a phrase: "34 items" → 34. */
function count(text) {
    const m = /(\d[\d,]*)/.exec(String(text || ''));
    return m ? parseInt(m[1].replace(/,/g, ''), 10) : 0;
}

function whole(n) {
    return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
}

function percent(part, of) {
    if (!(of > 0)) return '0%';
    const p = part / of * 100;
    if (p > 0 && p < 0.1) return '<0.1%';
    if (p < 10) return p.toFixed(1).replace(/\.0$/, '') + '%';
    return Math.round(p) + '%';
}

function plural(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }

/* ── reading nimo back ────────────────────────────────────────────────── */

/* nimo draws a panel for a terminal: box corners, a heading, columns held
   apart by two or more spaces. This reads it back into what it meant —
   headings, rows, a total, sentences — the same way the Swift window always
   did, so the two can never disagree about what nimo said. */
const BOX = new Set('─╭╮╰╯│');
const ANSI = /\x1b\[[0-9;]*m/g;

function parse(raw) {
    const out = [];
    for (const line of String(raw || '').split('\n')) {
        const strong = line.includes('\x1b[1m');
        const bare = line.replace(ANSI, '');
        const t = bare.trim();
        if (!t) continue;
        if (t.startsWith('◍')) continue;              // the wordmark; the window has a title
        if (t.startsWith('╰')) continue;              // the bottom of a panel is a shape

        if (t.startsWith('╭')) {
            const title = t.replace(/^[─╭╮╰╯│\s]+/, '').replace(/[─╭╮╰╯│\s]+$/, '');
            if (title) out.push({ k: 'heading', text: title });
            continue;
        }
        if ([...t].every(c => BOX.has(c))) { out.push({ k: 'rule' }); continue; }
        // nimo's dashes, said as a window would: "Sorted — 34 items" is "Sorted: 34 items"
        if (t.startsWith('✓')) { out.push({ k: 'good', text: undash(t.slice(1).trim()) }); continue; }
        if (t.startsWith('✗') || t.startsWith('!')) { out.push({ k: 'warn', text: undash(t.slice(1).trim()) }); continue; }

        const indent = bare.length - bare.replace(/^ +/, '').length;
        const parts = t.split(/ {2,}/).filter(Boolean);
        const last = parts[parts.length - 1] || '';
        const isBar = parts.length > 1 && /^[█·]+$/.test(last);

        // A numbered line — the undo log, the wallpapers — is an entry, not
        // a label and a value. The Swift reader filed these as notes and
        // dropped them, which is why "Put it all back" never listed anything.
        if (!isBar && parts.length >= 2 && /^\d{1,3}$/.test(parts[0])) {
            out.push({ k: 'item', no: parseInt(parts[0], 10), parts: parts.slice(1), strong });
            continue;
        }

        if (indent >= 4 && parts.length >= 2) {
            const label = parts.shift();
            let bar = null;
            if (isBar) {
                const cells = [...parts.pop()];
                bar = cells.filter(c => c === '█').length / cells.length;
            }
            out.push({ k: 'row', label, value: parts[0] || '', note: parts.slice(1).join('  '), bar, strong });
            continue;
        }
        out.push(indent <= 3 ? { k: 'note', text: undash(t) } : { k: 'text', text: undash(t) });
    }
    return out;
}

/* nimo's lines, as the window says them: Kliner, not the engine under it,
   and a colon where a terminal would have used a dash */
function undash(text) {
    return String(text).replace(/\s+[—–]\s+/g, ': ').replace(/\bnimo (never|does|only|will|cannot|can|has|wrote|found|moved|sorted|looks|reads)\b/g, 'Kliner $1');
}

/** The rows of a reading, by label, for pages that read figures off it. */
function facts(pieces) {
    const map = {};
    for (const p of pieces) if (p.k === 'row' && !(p.label in map)) map[p.label] = p;
    return map;
}

/** A reading, cut at its headings: one section per panel nimo drew. */
function sections(pieces) {
    const out = [];
    let cur = { title: '', pieces: [] };
    for (const p of pieces) {
        if (p.k === 'heading') {
            if (cur.title || cur.pieces.length) out.push(cur);
            cur = { title: p.text, pieces: [] };
        } else cur.pieces.push(p);
    }
    if (cur.title || cur.pieces.length) out.push(cur);
    return out;
}

/** Words with nimo's commands in them, the commands set as code. Only
 *  nimo's own verbs count, so "8 min" stays a duration. */
const COMMAND = /(\bmin (?:desktop|downloads|screenshots|clean|preview|top|doctor|undo|startup|wallpaper|next|prev|tidy|clear|empty|duplicates|apps|setup|update|dock|hide|zen|dark|light|blank|menu|help)(?: (?:--?[a-z][a-z-]*|desktop|downloads|all|<[a-z]+>))*)/;
function prose(text) {
    const frag = document.createDocumentFragment();
    const bits = String(text).split(COMMAND);
    for (const bit of bits) {
        if (/^min /.test(bit)) frag.append(h('code', null, bit));
        else if (bit) frag.append(document.createTextNode(bit));
    }
    return frag;
}

/* ── Kliner's window ─────────────────────────────────────────────────────

   This page is the window. It draws; it never decides what runs. Every
   request it makes names a page by number, and the Swift side looks the
   command up in its own list, asks you with a real macOS dialog before
   anything changes, and only then runs nimo. There is no way from here to
   hand nimo an argument or open a URL. The page itself never reaches the
   network: kliner.app (your @username, files sent to it, your profile) is
   spoken to by the Swift side, which signs every request with this Mac's
   own key.                                                              */

/* ── talking to the app ───────────────────────────────────────────────── */

const native = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.kliner;
let serial = 0;
const owed = new Map();

/* How long an answer may take before the window stops waiting for it. A
   question put to you — a dialog, a sheet, a file to pick — waits for you,
   however long that is. A reading that never came back used to leave the
   window waiting for ever: every button after it did nothing, and Home
   stopped reading itself, which is how the window went wrong after a while. */
const ASK_WAIT = { look: 600000, walk: 600000, copies: 600000, list: 60000, thumbs: 60000, walls: 60000,
                   wallPictures: 120000, wallBig: 60000, dockApps: 60000, dockMore: 120000, activity: 15000,
                   settings: 15000, boot: 30000, setWall: 60000, rename: 60000, userCheck: 20000, userClaim: 20000,
                   nearby: 15000, cloudCheck: 130000, cloudClaim: 70000, cloudRename: 70000,
                   profileGet: 130000, profilePut: 70000, accountDelete: 70000, machine: 30000 };

/* What Kliner is busy with, in words, for the dot in the ring. */
const WORK_OPS = { look: 'Reading your Mac', go: 'Working', extra: 'Working', tidy: 'Tidying', walk: 'Measuring',
                   copies: 'Comparing files', setWall: 'Changing the wallpaper', zen: 'Changing the desktop',
                   dockKeep: 'Changing the Dock', dockFast: 'Changing the Dock', stop: 'Stopping it',
                   unpin: 'Changing the Dock', closeApps: 'Asking apps to quit', rename: 'Renaming',
                   send: 'Sending' };
const STATE = { working: 0, label: '' };

/** Ask the app for something and wait for its answer. */
function ask(op, args) {
    const work = WORK_OPS[op] && !(args && args.quiet);
    if (work) { STATE.working++; STATE.label = WORK_OPS[op]; paintState(); }
    return new Promise(resolve => {
        if (!native) { resolve({ ok: false, text: '', missing: true }); return; }
        const id = ++serial;
        let timer = 0;
        const done = data => {
            clearTimeout(timer);
            if (!owed.has(id)) return;
            owed.delete(id);
            resolve(data);
        };
        owed.set(id, done);
        if (ASK_WAIT[op]) {
            timer = setTimeout(() => done({ ok: false, missing: true, late: true,
                                            text: '! Kliner took too long to answer. Try again.' }), ASK_WAIT[op]);
        }
        native.postMessage(Object.assign({}, args || {}, { id, op }));
    }).finally(() => {
        if (!work) return;
        STATE.working = Math.max(0, STATE.working - 1);
        paintState();
    });
}

/** Tell the app something that needs no answer. */
function tell(op, args) {
    if (native) native.postMessage(Object.assign({}, args || {}, { id: 0, op }));
}

/* ── what the window knows ────────────────────────────────────────────── */

const K = {
    meta: null,
    page: -1,
    behind: [],
    ahead: [],
    kept: {},           // page → what it last said
    wallOn: 0,          // the one put on from this window
    walls: null,        // the wallpapers, read once
    wallPics: null,     // and small pictures of them, drawn by the Mac
    busy: false,
    walked: [],         // how far into a folder you have clicked
    walkedFrom: -1,
    preview: false,
    wide: false,
    jobs: [],           // what Kliner has done since it opened
    unread: false,
    lastRead: 0,
    sighted: true,
    welcome: null,
    home: null,         // the figures Home read, for the rail and ⌘K
    base: null,         // the reading the window opened on, that changes are measured from
};

const $ = sel => document.querySelector(sel);
const pages = () => (K.meta ? K.meta.pages : []);
const SETTINGS = () => pages().length;
const HELP = () => pages().length + 1;
const ACTIVITY = () => pages().length + 2;
const SHARE = () => pages().length + 3;
const isAction = i => i >= 0 && i < pages().length;
const kind = i => (isAction(i) ? pages()[i].kind : i === SETTINGS() ? 'settings' : i === ACTIVITY() ? 'activity'
    : i === SHARE() ? 'share' : 'help');

function titleOf(i) {
    if (isAction(i)) return pages()[i].title;
    return i === SETTINGS() ? 'Settings' : i === ACTIVITY() ? 'Activity' : i === SHARE() ? 'Send' : 'Help';
}
function placeOf(i) {
    return (K.meta.places || []).find(p => p.holds.includes(i)) || null;
}

/* ── the frame ────────────────────────────────────────────────────────── */

function drawFrame() {
    const app = $('#app');

    // fifteen — each with what is waiting in it and one light that slides
    // to where you are. The pages of a place are the tabs along the top
    // (drawWhere). Help, Settings and you at the foot; you open Settings at

    const side = h('aside', { class: 'sb', id: 'side' },
        h('div', { class: 'sb-top' },
            h('button', { class: 'sb-logo', 'data-hole': '', 'aria-label': 'Home', onclick: () => show(0) },
                h('span', { class: 'sb-mark' }, eyesMark('glance blinks')), wordMark()),
            h('button', { class: 'sq sb-fold', id: 'fold', 'data-hole': '', 'data-tip': 'Fold the sidebar', 'data-keys': '⌘B',
                          'aria-label': 'Fold the sidebar', onclick: fold }, icon('sidebar'))),
        h('button', { class: 'sb-app', 'data-tip': 'Kliner', 'aria-label': 'Home', onclick: () => show(0) }),
        h('button', { class: 'sb-find', 'data-tip': 'Search', 'data-keys': '⌘K', 'aria-label': 'Search', onclick: openFind },
            icon('search'), h('span', { class: 'label' }, 'Search…'),
            h('span', { class: 'label sb-keys' }, h('kbd', null, '⌘'), h('kbd', null, 'K'))),
        list,
        h('div', { class: 'sb-foot' },
            h('button', { class: 'spot sb-help', 'data-page': HELP(), 'data-tip': 'Help', 'data-keys': '?', onclick: () => openSettings('help') },
                icon('help'), h('span', { class: 'label' }, 'Help')),
            h('button', { class: 'spot', 'data-page': SETTINGS(), 'data-tip': 'Settings', 'data-keys': '⌘,', onclick: () => openSettings() },
                icon('gear'), h('span', { class: 'label' }, 'Settings')),
            youRow()));

    // the bar along the top: where you are, and on the right what Kliner is
    // doing; search too while the sidebar, which has its own, is folded
    const bar = h('header', { class: 'bar' },
        h('button', { class: 'sq unfold', id: 'unfold', 'data-hole': '', 'data-tip': 'Open the sidebar', 'data-keys': '⌘B',
                      'aria-label': 'Open the sidebar', onclick: fold }, icon('sidebar')),
        h('div', { class: 'where', id: 'where' }),
        // a file on its way, in the middle of the bar, wherever you are
        islandEl(),
        h('div', { class: 'right' },
            // Preview says so only while it is on; turning it on is in
            // Settings and in ⌘K, not a word across the top of every page.
            h('button', { class: 'mode', id: 'mode', 'data-hole': '', onclick: flipPreview, hidden: !K.preview,
                          'data-tip': 'Preview is on: nothing changes. Click to turn it off.' },
              icon('eye'), h('span', null, 'Preview')),
            // Home's reading: how old it is, and the way to read it again. The
            // page itself is only its title and what it says, the way his is.
            h('button', { class: 'sq bar-refresh', id: 'refresh', 'data-hole': '', hidden: true, 'data-tip': 'Read your Mac again',
                          'aria-label': 'Read your Mac again', onclick: () => { delete K.kept[0]; look(0); } }, icon('refresh')),
            h('button', { class: 'bar-find', 'data-hole': '', onclick: openFind, 'aria-label': 'Search' },
              icon('search'), h('span', null, 'Search'), h('kbd', null, '⌘K')),
            // what Kliner is doing, as a dot in a ring; what it has done, when clicked
            h('button', { class: 'state idle', id: 'state', 'data-hole': '', 'data-tip': 'Kliner is idle',
                          'aria-label': 'Kliner is idle', onclick: toggleActivity },
              h('i', { class: 'ring' }), h('i', { class: 'dot' })),
            h('button', { class: 'sq insp-show', id: 'inspShow', 'data-hole': '', 'data-tip': 'Show the pane', 'aria-label': 'Show the pane',
                          hidden: INSP.open, onclick: () => toggleInsp(true) }, icon('sidebar'))));

    const scroll = h('div', { class: 'scroll', id: 'scroll' }, h('div', { class: 'page', id: 'page' }));

    scroll.addEventListener('scroll', () => { if (K.page === 0) paintIsland(); }, { passive: true });
