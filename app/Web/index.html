.dpage.col .tx-track { height: 4px; background: var(--sel-2); }
.dpage.col .tx-track i { background: var(--good); }
.skeleton.dpage.col .sk-li { padding: 8px 12px; gap: 14px; }
.skeleton.dpage.col .sk-li > .sk:first-child { border-radius: 50%; }

/* ── v15: the pane on the right, and the wallpaper's colour ─────────────
   His dashboard has the pull request open beside it on the glass: a pane
   with no card under it, the wallpaper showing through, white on it for
   what you read and a lighter white for what names it, a hairline under
   its name and under its facts, headings that fold, and the box you write
   in at its foot. Kliner's is the same, with the box that sends a file.
   The page beside it takes the wallpaper's colour as two faint glows. */

:root {
    --insp-w: 372px;
    --g-ink: #121110; --g-body: #2b2a28; --g-muted: rgba(20, 18, 14, .56); --g-faint: rgba(20, 18, 14, .38);
    --g-line: rgba(20, 18, 14, .1); --g-fill: rgba(255, 255, 255, .5); --g-fill-hi: rgba(255, 255, 255, .72);
    --g-over: rgba(246, 245, 243, .9);
    --glow-1: #d18a52; --glow-2: #3b4f66;
    --page-glow: none;
}
@media (prefers-color-scheme: dark) {
    :root {
        --g-ink: #ffffff; --g-body: rgba(255, 255, 255, .88); --g-muted: rgba(255, 255, 255, .56); --g-faint: rgba(255, 255, 255, .36);
        --g-line: rgba(255, 255, 255, .1); --g-fill: rgba(255, 255, 255, .075); --g-fill-hi: rgba(255, 255, 255, .13);
        --g-over: rgba(26, 25, 23, .9);
        --page-glow: radial-gradient(110% 72% at 0% 0%, color-mix(in srgb, var(--glow-1) 12%, transparent) 0%, transparent 62%),
                     radial-gradient(85% 75% at 100% 100%, color-mix(in srgb, var(--glow-2) 9%, transparent) 0%, transparent 64%);
    }
}
/* the colour is laid over the page's own, so a Mac that cannot mix colours
   still gets the page, just without the glow */
.main { background-color: var(--bg); background-image: var(--page-glow); }

/* the pane stands in the window's third column, on the glass */
.insp { display: none; }
.app.insp-on:not(.wide) { grid-template-columns: 76px minmax(0, 1fr) var(--insp-w); }
.app.wide.insp-on { grid-template-columns: 248px minmax(0, 1fr) var(--insp-w); }
.app.insp-on .insp { display: flex; flex-direction: column; min-width: 0; min-height: 0; color: var(--g-ink); }
.insp-show[hidden] { display: none !important; }
@media (max-width: 1179px) {
    .app.insp-on:not(.wide) { grid-template-columns: 76px minmax(0, 1fr); }
    .app.wide.insp-on { grid-template-columns: 248px minmax(0, 1fr); }
    .app.insp-on .insp { position: fixed; z-index: 45; top: 8px; right: 8px; bottom: 8px; width: min(var(--insp-w), calc(100vw - 100px));
        border-radius: 16px; background: var(--g-over); -webkit-backdrop-filter: blur(30px) saturate(1.4); backdrop-filter: blur(30px) saturate(1.4);
        box-shadow: 0 0 0 1px var(--g-line), 0 24px 60px rgba(0, 0, 0, .45); animation: inspIn .24s var(--arrive) both; }
}
@keyframes inspIn { from { opacity: 0; transform: translateX(18px); } }
.insp-h { height: 52px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 16px 0 10px; border-bottom: 1px solid var(--g-line); }
.insp-h .sq { width: 30px; height: 30px; border-radius: 8px; color: var(--g-muted); }
.insp-h .sq:hover { background: var(--g-fill); color: var(--g-ink); }
.insp-t { font-size: 15px; color: var(--g-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.insp-b { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 22px 22px 18px 18px; display: flex; flex-direction: column; scrollbar-width: none; }
.insp-b::-webkit-scrollbar { display: none; }
.insp-f { flex: none; display: flex; flex-direction: column; gap: 8px; padding: 10px 14px 14px 10px; }

/* what is on it */
.insp .td-st { color: var(--g-muted); }
.insp .td-st.good { color: var(--good); }
.insp .td-st.bad { color: var(--bad); }
.td-dot { width: 9px; height: 9px; margin: 0 4px; border-radius: 2px; flex: none; background: var(--dot-1); }
.td-dot.c2 { background: var(--dot-2); }
.td-dot.c3 { background: var(--dot-3); }
.td-dot.near { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 20%, transparent); }
.insp .td-name { margin-top: 9px; font-size: 22px; font-weight: 500; letter-spacing: -.015em; color: var(--g-ink); -webkit-line-clamp: 3; }
.insp .td-bar { background: var(--g-fill-hi); }
.insp .lv { margin-top: 18px; padding-bottom: 16px; border-bottom: 1px solid var(--g-line); }
.insp .lv > div { min-height: 34px; }
.insp .lv dt { color: var(--g-muted); }
.insp .lv dd { color: var(--g-ink); }
.insp .lv .switch { flex: none; }
.insp .lv-who .pf { background: var(--g-fill-hi); color: var(--g-ink); }
.insp .ad-where .dot { margin: 0; }
.insp .td-why { color: var(--g-muted); }
.idisk { display: grid; gap: 12px; margin-top: 18px; }
.idisk .tm-bar { background: var(--g-fill); }
.idisk .tm-bar i.f { background: var(--g-fill-hi); }
.idisk .tm-key > div { font-size: 14px; color: var(--g-muted); }
.idisk .tm-key i.f { background: var(--g-fill-hi); }
.idisk .tm-key b { color: var(--g-ink); font-weight: 400; }
.ifold { margin-top: 14px; }
.ifold > summary { list-style: none; display: flex; align-items: center; gap: 9px; height: 32px; font-size: 15px; color: var(--g-muted);
    cursor: pointer; border-radius: 8px; outline: none; }
.ifold > summary::-webkit-details-marker { display: none; }
.ifold > summary::before { content: ""; width: 0; height: 0; margin-left: 2px; border-left: 6px solid currentColor;
    border-top: 4px solid transparent; border-bottom: 4px solid transparent; transition: transform .16s ease; }
.ifold[open] > summary::before { transform: rotate(90deg); }
.ifold > summary:hover { color: var(--g-ink); }
.ifold > summary:focus-visible { box-shadow: 0 0 0 2px var(--g-line); }
.ifold-b { display: grid; gap: 0; padding: 4px 0 2px; }
.itext { font-size: 15px; line-height: 1.5; color: var(--g-body); text-wrap: pretty; }
.ifold-b .itext { margin-top: 6px; }
.irow { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; align-items: center; gap: 11px; min-height: 34px; font-size: 15px; color: var(--g-body); }
.irow .ic { width: 16px; height: 16px; color: var(--g-muted); stroke-width: 1.5; }
.irow span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.irow b { font-weight: 400; color: var(--g-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.iacts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 22px; }
.insp .btn.line { border-color: var(--g-line); color: var(--g-ink); }
.insp .btn.line:hover { background: var(--g-fill); }
.insp .iq { width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--g-line); color: var(--g-muted); }
.insp .iq:hover { background: var(--g-fill); color: var(--g-ink); }
.iwall { height: 150px; margin-top: 16px; border-radius: 14px; background: center / cover no-repeat; box-shadow: 0 0 0 1px var(--g-line); }
.insp .itext + .iacts, .insp .iwall + .itext { margin-top: 16px; }
.insp .iwall + .itext { margin-top: 14px; }

/* the box at its foot */
.insp .panel.snd { padding: 12px 12px 12px 16px; border-radius: 18px; background: var(--g-fill); box-shadow: inset 0 0 0 1px var(--g-line); gap: 2px; }
.insp .sc-top { min-height: 34px; }
.insp .sc-to .at { font-size: 17px; color: var(--g-faint); }
.insp .snd .snd-field { height: 34px; font-size: 17px; color: var(--g-ink); }
.insp .snd .snd-field::placeholder { color: var(--g-faint); }
.insp .snd .snd-who { font-size: 13px; color: var(--g-muted); }
.insp .snd .snd-who b { color: var(--g-ink); }
.insp .sc-foot { margin-top: 14px; gap: 10px; }
.insp .sc-chips { gap: 6px; }
.insp .sc-chip { height: 32px; padding: 0 12px 0 10px; font-size: 13.5px; background: var(--g-fill); color: var(--g-body); }
.insp .sc-chip:hover { background: var(--g-fill-hi); }
.insp .sc-chip.sp { padding: 0 12px 0 4px; }
.insp .sc-chip.sp .pf { width: 24px; height: 24px; font-size: 11px; background: var(--g-fill-hi); color: var(--g-ink); }
.insp .sc-chip.sp.near .pf::after { box-shadow: none; }
.insp .sc-chip.sp.on { background: var(--g-ink); color: var(--on-ink); }
.insp .sc-chip.sp.on .pf { background: color-mix(in srgb, var(--on-ink) 14%, transparent); color: var(--on-ink); }
.insp .sc-chip.file { max-width: 100%; }
.insp .chip-in b { max-width: 150px; color: var(--g-ink); }
.insp .sc-go { width: 34px; height: 34px; }
.insp .sc-go:disabled { background: var(--g-fill-hi); color: var(--g-faint); }
.insp .snd-how { padding: 0 8px; font-size: 12px; color: var(--g-faint); }
body.dropping .insp .panel.snd { box-shadow: inset 0 0 0 1.5px var(--data); }

/* a row the pane is showing */
.dpage.col .tl-row.is-picked, .fs-row.is-picked { background: var(--hover); }
.dpage.col .tl-row.go, .dpage.col .tl-row.tx-row { cursor: pointer; }

/* the people on the Send page */
.dpage.col .tl-ic.pf { font-size: 14px; font-weight: 500; color: var(--ink); position: relative; }
.dpage.col .tl-row.sp.near .tl-ic.pf::after { content: ""; position: absolute; right: 0; bottom: 0; width: 9px; height: 9px; border-radius: 50%;
    background: var(--good); box-shadow: 0 0 0 2px var(--bg); }
.dpage.col .tl-row.sp.on { background: var(--hover); }
.sendp .dh { align-items: center; }
.sendp .dh-acts .btn.fill { height: 34px; padding: 0 15px; border-radius: 10px; font-size: 14px; font-weight: 500; }
.app.insp-on .insp { padding: 8px 0 0; }
.insp .ad-where { align-items: center; gap: 8px; font-size: 15px; color: var(--g-ink); }

/* ── every other page, the same way as Home ──────────────────────────────
   No card round every block: the page's title alone, big, its words in
   grey under it, and the blocks on the page under a small grey name. The
   tables are rows with a coloured mark for the three biggest and their
   share in the same colour; the weave bars and their swatches are gone,
   because his has neither. Tiles stay tiles; Activity's two live pictures
   stay in theirs. */
.page > div.apage { width: 100%; max-width: 940px; margin-inline: auto; }
.page > div.apage > .panel, .page > div.apage > .split, .page > div.apage > .grid, .page > div.apage > .cols,
.page > div.apage > section, .page > div.apage > .view { margin-top: 44px; }
.page > div.apage > .head + .panel, .page > div.apage > .head + .split, .page > div.apage > .head + .grid { margin-top: 30px; }
.apage > .head { padding: 0; gap: 16px; align-items: center; }
.apage > .head .pg-ic { display: none; }
.apage > .head h1 { font-size: 36px; font-weight: 500; letter-spacing: -.022em; line-height: 1.12; }
.apage > .head p { margin-top: 6px; font-size: 15px; color: var(--muted); }
.apage > .head .acts .sq { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--btn-line); color: var(--muted); }
.apage > .head .acts .sq:hover { background: var(--hover); color: var(--ink); }
.apage > .head .acts .btn.fill { height: 34px; padding: 0 15px; border-radius: 10px; font-size: 14px; font-weight: 500; box-shadow: none; }
.apage > .head .acts .btn.line { height: 34px; border-radius: 10px; }
.apage .panel:not(.tile):not(.live):not(.kpis):not(.sheet-card) { background: none; border: 0; box-shadow: none; padding: 0; border-radius: 0; }
.apage .panel > .cap { min-height: 24px; gap: 8px; font-size: 15px; font-weight: 400; color: var(--muted); }
.apage .panel > .cap > .ic { display: none; }
.apage .panel > .cap .r { font-size: 14px; color: var(--faint); }
.apage .panel.tile { border-radius: 18px; background: var(--surf); border: 0; box-shadow: none; }
.apage .panel.live { border-radius: 18px; background: var(--surf); border: 0; box-shadow: none; }
.apage .split { gap: 32px; }
.apage .big .n { font-size: 34px; font-weight: 500; letter-spacing: -.02em; }
.apage .big .sub, .apage .big .move .w { font-size: 14px; color: var(--muted); }
.apage .big .move .d { font-size: 15px; font-weight: 400; color: var(--ink); }
.apage .bars { display: none; }
.apage .table { margin-top: 18px; }
.apage .table .th { padding-bottom: 6px; border-bottom: 0; font-size: 13px; letter-spacing: 0; text-transform: none; color: var(--faint); }
.apage .table .tr { min-height: 48px; font-size: 15px; }
.apage .table .tr + .tr { box-shadow: none; }
.apage .table .tr .nm { color: var(--ink); }
.apage .table .tr .pc { font-size: 14px; }
.apage .table .tr .sz { color: var(--ink); }
.apage .table .tr > .sw { display: none; }
.apage .table .tr::before { content: ""; width: 8px; height: 8px; border-radius: 2px; justify-self: center; background: var(--ghost); }
.apage .table .tr:nth-child(2)::before, .apage .table .tr:nth-child(2) .share i { background: var(--dot-1); }
.apage .table .tr:nth-child(3)::before, .apage .table .tr:nth-child(3) .share i { background: var(--dot-2); }
.apage .table .tr:nth-child(4)::before, .apage .table .tr:nth-child(4) .share i { background: var(--dot-3); }
.apage .table .tr .share { height: 4px; background: var(--sel-2); }
.apage .table .tr .share i { background: var(--ghost); }
.apage .table .total { border-top: 0; padding-top: 14px; font-size: 15px; }
.apage .table .total span { color: var(--muted); }
.apage .fact { min-height: 46px; font-size: 15px; }
.apage .fact + .fact { box-shadow: none; }
.apage .fact .k { color: var(--muted); }
.apage .fact .v { color: var(--ink); }
.apage .vtabs { gap: 24px; border-bottom: 0; }
.apage .vtab { font-size: 15px; }
.apage .ph-chips .pchip { height: 32px; border-radius: 999px; border: 0; background: var(--surf); font-size: 14px; }
/* with the pane beside the page, its facts are in the pane */
@media (min-width: 1180px) { .app.insp-on .apage .ph-chips { display: none; } }
/* the rows on those pages, the way Home's are: a round picture, 15 for the
   name, grey under it, no line between them */
.apage .stops { margin-top: 12px; }
.apage .stop { min-height: 60px; gap: 14px; grid-template-columns: 34px minmax(0, 1fr) auto; padding: 8px 12px; margin: 0 -12px; border-radius: 12px; }
.apage .stop + .stop { box-shadow: none; }
.apage .stop .ico { width: 34px; height: 34px; border-radius: 50%; background: var(--surf); color: var(--muted); }
.apage .stop .ico .ic { width: 17px; height: 17px; stroke-width: 1.5; }
.apage .stop .ico.appico:has(img) { border-radius: 0; background: none; }
.apage .stop .ico.appico img { width: 34px; height: 34px; }
.apage .stop .nm { font-size: 15px; font-weight: 400; color: var(--ink); }
.apage .stop .kd { margin-top: 2px; font-size: 15px; color: var(--muted); }
.apage .stop .pill { font-size: 13px; }
.apage .log { margin-top: 12px; }
.apage .log .e { min-height: 52px; font-size: 15px; box-shadow: none; border: 0; }
.apage .log .e + .e { box-shadow: none; border-top: 0; }
.apage .log .e .no { width: 28px; height: 28px; border-radius: 50%; background: var(--surf); color: var(--muted); font-size: 12px; }
.apage .log .e .what { color: var(--ink); }
.apage .log .e .when, .apage .log .e .many { font-size: 14px; color: var(--muted); }
.apage .said .s { font-size: 15px; }
.apage .more { font-size: 14px; color: var(--muted); }
.apage .log .e { grid-template-columns: 28px minmax(0, 1fr) auto auto; }
.insp-b.fresh > * { animation: ipIn .34s var(--arrive) calc(var(--k, 0) * 28ms) backwards; }
@keyframes ipIn { from { opacity: 0; transform: translateY(6px); } }
@media (prefers-reduced-motion: reduce) { .insp-b.fresh > *, .app.insp-on .insp { animation: none !important; } }

/* ── v16: less of everything ─────────────────────────────────────────────
   One thing per line, and no line that only explains another. The pages
   say their name and show what is there; what a page is for, the column
   beside it, the headings over a table and the totals under it, and the
   notes under that are gone, the way his has none of them. The box you
   send from is its placeholder until there is something to say. */
.page > div.dpage.col { gap: 54px; }
.apage > .head p { display: none; }
.apage .table .th, .apage .table .total, .apage .big .move, .apage .more, .apage .said .s.quiet { display: none; }
.apage .big .sub { margin-top: 4px; }
.page > div.apage > .panel, .page > div.apage > .grid, .page > div.apage > .cols,
.page > div.apage > section, .page > div.apage > .view { margin-top: 52px; }
.app:not(.wide) .sb-foot .sb-help { display: none; }
.sc-to:has(.snd-field:placeholder-shown) .at { display: none; }
.snd .snd-who:empty { display: none; }
.insp .sc-foot { margin-top: 12px; }
.apage .notes { display: none; }

/* ── v17: Efferd's dashboard, for Kliner ─────────────────────────────────
   Dan sent efferd.com/blocks/dashboard and said: everything is there. So
   the window is built the way it is, measured off the page itself, not off
   a picture of it: Tailwind's neutral greys, Geist, a 14-point corner, the
   sidebar's six names and its search, and the cards — a tray with its name
   along the top and a sheet laid in it a little wider than the tray, with
   a highlight along its top edge and, in the dark, a faint light at its
   top left. That sheet in its tray is the glass he pointed at. The charts
   are grey, drawn as fills that fade with a bright line along their tops.
   The sidebar is still the window's glass; the page is the sheet on it. */

:root {
    --font: "Geist", -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    --e-bg: #ffffff; --e-side: #fafafa; --e-card: #ffffff;
    --e-tray: rgba(245, 245, 245, .8);
    --e-line: #e5e5e5; --e-input: #e5e5e5; --e-field: transparent;
    --e-sel: #f5f5f5; --e-hover: rgba(10, 10, 10, .04); --e-mark: #f0f0f0;
    --e-ink: #0a0a0a; --e-body: #262626; --e-muted: #737373; --e-faint: #a3a3a3;
    --e-good: #059669; --e-good-dot: #10b981; --e-bad: #dc2626; --e-bad-dot: #ef4444;
    --e-s1: #737373; --e-s2: #a3a3a3; --e-s3: #d4d4d4; --e-meter: #737373;
    --e-glow: none; --e-hi: rgba(10, 10, 10, .06); --e-shadow: 0 1px 0 rgba(0, 0, 0, .05);
    --e-tip: rgba(255, 255, 255, .97); --e-tip-shadow: 0 10px 30px rgba(0, 0, 0, .12);
    --e-primary: #171717; --e-primary-ink: #fafafa;

    /* and the window's own names for the same things, so every page takes it */
    --app: #fafafa; --rail: #fafafa; --ground: #fafafa;
    --bg: #ffffff; --panel: #ffffff; --well: #ffffff; --raise: #fafafa;
    --surf: #f5f5f5; --surf-2: #efefef; --sunk: #fafafa;
    --hover: #f5f5f5; --sel: #f0f0f0; --sel-2: #e5e5e5;
    --line: #e5e5e5; --line-2: #d4d4d4;
    --ink: #0a0a0a; --body: #262626; --muted: #737373; --faint: #a3a3a3; --ghost: #d4d4d4;
    --good: #059669; --bad: #dc2626;
    --data: #404040; --data-2: #a3a3a3; --data-soft: #f5f5f5;
    --pill-good: #ecfdf5; --pill-bad: #fef2f2;
    --dot-1: #404040; --dot-2: #737373; --dot-3: #a3a3a3; --dot-off: rgba(10, 10, 10, .07);
    --btn-line: #e5e5e5; --icon-tile: #a3a3a3;
    --on: #171717; --on-ink: #fafafa; --accent: #171717; --accent-ink: #fafafa; --mark: #171717; --mark-ink: #fafafa;
    --page-paint: #ffffff; --page-glow: none;
    --glass: rgba(250, 250, 250, .5);
}
@media (prefers-color-scheme: dark) {
    :root {
        --e-bg: #0a0a0a; --e-side: #171717; --e-card: #171717;
        --e-tray: rgba(38, 38, 38, .5);
        --e-line: rgba(255, 255, 255, .1); --e-input: rgba(255, 255, 255, .15); --e-field: rgba(255, 255, 255, .045);
        --e-sel: #262626; --e-hover: rgba(255, 255, 255, .05); --e-mark: rgba(255, 255, 255, .08);
        --e-ink: #fafafa; --e-body: #e5e5e5; --e-muted: #a1a1a1; --e-faint: #737373;
        --e-good: #34d399; --e-good-dot: #10b981; --e-bad: #f87171; --e-bad-dot: #ef4444;
        --e-s1: #d4d4d4; --e-s2: #8f8f8f; --e-s3: #575757; --e-meter: #737373;
        --e-glow: radial-gradient(35% 100% at 10% 0%, rgba(250, 250, 250, .06), transparent);
        --e-hi: rgba(250, 250, 250, .08); --e-shadow: 0 1px 0 rgba(0, 0, 0, .05);
        --e-tip: rgba(16, 16, 16, .94); --e-tip-shadow: 0 12px 34px rgba(0, 0, 0, .5);
        --e-primary: #e5e5e5; --e-primary-ink: #171717;

        --app: #171717; --rail: #171717; --ground: #171717;
        --bg: #0a0a0a; --panel: #0a0a0a; --well: #0a0a0a; --raise: #171717;
        --surf: #171717; --surf-2: #1f1f1f; --sunk: #0a0a0a;
        --hover: #151515; --sel: #262626; --sel-2: #2e2e2e;
        --line: rgba(255, 255, 255, .1); --line-2: rgba(255, 255, 255, .15);
        --ink: #fafafa; --body: #e5e5e5; --muted: #a1a1a1; --faint: #737373; --ghost: #525252;
        --good: #34d399; --bad: #f87171;
        --data: #e5e5e5; --data-2: #737373; --data-soft: #262626;
        --pill-good: rgba(16, 185, 129, .12); --pill-bad: rgba(239, 68, 68, .12);
        --dot-1: #e5e5e5; --dot-2: #a1a1a1; --dot-3: #737373; --dot-off: rgba(255, 255, 255, .07);
        --btn-line: rgba(255, 255, 255, .15); --icon-tile: #737373;
        --on: #e5e5e5; --on-ink: #171717; --accent: #e5e5e5; --accent-ink: #171717; --mark: #fafafa; --mark-ink: #0a0a0a;
        --page-paint: #0a0a0a; --page-glow: none;
        --glass: rgba(23, 23, 23, .38);
        --g-over: rgba(16, 16, 16, .92);
    }
}

/* ── the window: the sidebar on the glass, the page a sheet on it ── */
.app.wide { grid-template-columns: 256px minmax(0, 1fr); }
.app:not(.wide) { grid-template-columns: 76px minmax(0, 1fr); }
.app.wide.insp-on { grid-template-columns: 256px minmax(0, 1fr) var(--insp-w); }
.app.insp-on:not(.wide) { grid-template-columns: 76px minmax(0, 1fr) var(--insp-w); }
@media (max-width: 1179px) {
    .app.wide.insp-on { grid-template-columns: 256px minmax(0, 1fr); }
    .app.insp-on:not(.wide) { grid-template-columns: 76px minmax(0, 1fr); }
}
.main { margin: 8px 8px 8px 0; border-radius: 14px; background-color: var(--e-bg); background-image: none;
    box-shadow: 0 0 0 .5px var(--e-line), 0 1px 3px rgba(0, 0, 0, .1), 0 1px 2px -1px rgba(0, 0, 0, .1); }
@media (prefers-color-scheme: dark) { .main { box-shadow: 0 0 0 1px var(--e-line), 0 1px 3px rgba(0, 0, 0, .3); } }
.app.insp-on .main { margin-right: 0; }

/* the sidebar: Kliner by the lights, the search, six names, and you */
.sb, .app:not(.wide) .sb { padding: 0 8px 8px; border-right: 0; }
html:not(.glass) .sb { background: var(--e-side); }
.sb-top { height: 38px; padding: 0 0 0 70px; align-items: flex-start; }
.sb-logo { height: 26px; gap: 8px; padding: 0 8px 0 4px; border-radius: 8px; }
.sb-logo:hover { background: var(--e-hover); }
.sb-mark { width: 20px; height: 20px; border-radius: 6px; background: var(--e-ink); }
.sb-mark .eyes-mark .eye { fill: var(--e-bg); }
.sb-logo .word-mark { height: 11px; color: var(--e-ink); }
.sb-fold { width: 28px; height: 28px; margin-top: -1px; border-radius: 8px; color: var(--e-muted); }
.sb-fold:hover { background: var(--e-hover); color: var(--e-ink); }

.sb .sb-find { height: 32px; margin: 10px 0 0; padding: 0 6px 0 10px; gap: 8px; border-radius: 10px;
    background: var(--e-field); box-shadow: none; border: 1px solid var(--e-input); color: var(--e-muted); font-size: 14px; }
.sb .sb-find:hover { border-color: var(--e-faint); color: var(--e-body); box-shadow: none; }
.sb .sb-find .ic { width: 16px; height: 16px; color: var(--e-muted); }
.sb .sb-find span.label:not(.sb-keys) { flex: 1; text-align: left; }
.sb-keys { display: inline-flex; gap: 3px; }
.sb .sb-find .sb-keys kbd { min-width: 20px; height: 20px; padding: 0 5px; border-radius: 5px; display: inline-grid; place-items: center;
    font: 500 11px/1 var(--font); color: var(--e-muted); background: var(--e-sel); box-shadow: none; }

.app .sb .sb-places { position: relative; display: flex; flex-direction: column; align-items: stretch; gap: 2px; flex: 1 1 auto; min-height: 0;
    width: 100%; margin: 14px 0 0; padding: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
.sb-places > .mark { position: absolute; left: 0; right: 0; top: 0; height: 40px; border-radius: 8px; z-index: 0; pointer-events: none;
    background: var(--e-sel); opacity: 0; transition: transform .38s var(--glide), height .38s var(--glide), opacity .2s ease; }
html.glass .sb-places > .mark { background: var(--e-mark); }
.sb-places > .mark.jump { transition: none !important; }
.app .sb .sb-places .spot, .app .sb .sb-foot .spot { position: relative; z-index: 1; width: 100%; min-width: 0; height: 40px; flex: none;
    padding: 0 8px; gap: 8px; border-radius: 8px; justify-content: flex-start; background: transparent; color: var(--e-muted); }
.app .sb .sb-places .spot .ic, .app .sb .sb-foot .spot .ic { width: 16px; height: 16px; stroke-width: 1.6; color: inherit; }
.app .sb .sb-places .spot .label, .app .sb .sb-foot .spot .label { display: block; font-size: 14px; line-height: 20px; font-weight: 500;
    letter-spacing: .025em; color: inherit; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.app .sb .sb-places .spot:hover, .app .sb .sb-foot .spot:hover { background: var(--e-hover); color: var(--e-ink); }
.app .sb .sb-places .spot.on, .app .sb .sb-places .spot.on:hover { background: transparent; color: var(--e-ink); }
.app .sb .sb-foot .spot.on { background: var(--e-sel); color: var(--e-ink); }
html.glass .app .sb .sb-foot .spot.on { background: var(--e-mark); }
.app .sb .sb-places .spot .count { position: static; margin-left: auto; min-width: 0; height: auto; padding: 0; border-radius: 0;
    background: none; box-shadow: none; color: var(--e-faint); font-size: 12px; font-weight: 500; line-height: 20px; font-variant-numeric: tabular-nums; }
.app .sb .sb-places .spot .count.soft { display: none; }
.app .sb .sb-places .spot.pg[data-page] + .spot.pl { margin-top: 0; }

.app .sb .sb-foot { flex: none; display: flex; flex-direction: column; gap: 1px; margin: 0; padding: 8px 0 0; border-top: 0; width: 100%; }
.app .sb .sb-foot .spot { height: 32px; }
.app .sb .sb-foot .spot .label { font-size: 13px; }
.app .sb .sb-foot .sb-help { display: flex; }
.sb-disk { display: none !important; }
.sb .you { order: 0; width: 100%; margin: 6px 0 0; padding: 6px 0 0; border-top: 1px solid var(--e-line); }
.sb .you .me { width: 100%; height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 8px; border-radius: 10px; text-align: left;
    background: transparent; box-shadow: none; transition: background .15s ease; }
.sb .you .me:hover { background: var(--e-hover); box-shadow: none; }
.sb .you .face2.small { width: 28px; height: 28px; border-radius: 50%; font-size: 11px; }
.sb .you .who2 { display: flex !important; flex-direction: column; flex: 1; min-width: 0; line-height: 1.3; }
.sb .you .who2 b { font-size: 13px; font-weight: 500; color: var(--e-ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb .you .who2 span { font-size: 12px; color: var(--e-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb .you .me-go { display: grid; place-items: center; color: var(--e-faint); }
.sb .you .me-go .ic { width: 14px; height: 14px; }
.sb-app, .app.wide .sb-app { display: none; }

/* folded: the same list as pictures, the light behind the one you are in */
.app:not(.wide) .sb { align-items: center; padding: 0 0 8px; }
.app:not(.wide) .sb-top { width: 100%; padding: 0; height: 38px; }
.app:not(.wide) .sb-logo, .app:not(.wide) .sb-fold { display: none; }
.app:not(.wide) .sb-app { display: block; flex: none; width: 28px; height: 28px; margin: 4px 0 14px; border-radius: 7px; }
.app:not(.wide) .sb .sb-find { width: 40px; height: 36px; margin: 0; padding: 0; justify-content: center; border-color: transparent; background: transparent; }
.app:not(.wide) .sb .sb-find:hover { background: var(--e-hover); }
.app:not(.wide) .sb .sb-find .label { display: none; }
.app:not(.wide) .sb .sb-places { align-items: center; margin-top: 8px; }
.app:not(.wide) .sb-places > .mark { left: 50%; right: auto; width: 40px; margin-left: -20px; }
.app:not(.wide) .sb .sb-places .spot, .app:not(.wide) .sb .sb-foot .spot { width: 40px; height: 40px; padding: 0; justify-content: center; }
.app:not(.wide) .sb .sb-places .spot .ic, .app:not(.wide) .sb .sb-foot .spot .ic { width: 18px; height: 18px; }
.app:not(.wide) .sb .sb-places .spot .label, .app:not(.wide) .sb .sb-foot .spot .label { display: none; }
.app:not(.wide) .sb .sb-places .spot .count { position: absolute; top: 9px; right: 9px; width: 6px; height: 6px; border-radius: 50%;
    background: var(--e-ink); color: transparent; font-size: 0; line-height: 0; }
.app:not(.wide) .sb .sb-foot { align-items: center; }
.app:not(.wide) .sb .you { display: flex; justify-content: center; }
.app:not(.wide) .sb .you .me { width: 40px; height: 40px; padding: 0; justify-content: center; }
.app:not(.wide) .sb .you .who2, .app:not(.wide) .sb .you .me-go { display: none !important; }

/* the bar along the top of the page: where you are, the tabs of a place */
.main > .bar { height: 52px; background: transparent; border-bottom: 0; padding: 0 12px 0 20px; }
.app:not(.wide) .main > .bar { padding-left: 12px; }
.bar .where, .bar .where * { font-size: 14px; color: var(--e-muted); font-weight: 500; }
.bar .where .name { color: var(--e-ink); }
.bar .where .group { color: var(--e-muted); }
.bar .where .tabs { margin-left: 10px; padding: 2px; gap: 0; border-radius: 10px; background: var(--e-tray); box-shadow: inset 0 0 0 1px var(--e-line); }
.bar .where .tabs .glide { top: 2px; bottom: 2px; border-radius: 8px; background: var(--e-bg);
    box-shadow: 0 0 0 1px var(--e-line), 0 1px 2px rgba(0, 0, 0, .12); }
.bar .where .tab { height: 28px; padding: 0 12px; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--e-muted); }
.bar .where .tab:hover { color: var(--e-ink); }
.bar .where .tab.on, .bar .where .tab.on * { color: var(--e-ink); }
.bar .where .tab .tc { margin-left: 6px; font-size: 12px; color: var(--e-faint); }
.bar .sq, .bar .bar-refresh, .bar .insp-show { width: 32px; height: 32px; border-radius: 8px; color: var(--e-muted); }
.bar .sq:hover { background: var(--e-hover); color: var(--e-ink); }

/* the page: Efferd's 24 points of room */
.page { padding: 4px 24px 48px; max-width: none; }
.page > div.dpage.ef-home { max-width: 1200px; }

/* the buttons: one outlined, one filled, both Efferd's */
.ef-btn { height: 32px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 12px; border-radius: 10px;
    border: 1px solid var(--e-input); background: var(--e-field); color: var(--e-ink); font: 500 14px/20px var(--font); white-space: nowrap;
    transition: background .15s ease, border-color .15s ease, transform .2s var(--spring); }
.ef-btn:has(> .ic:first-child) { padding-left: 9px; }
.ef-btn .ic { width: 16px; height: 16px; color: var(--e-muted); flex: none; }
.ef-btn:hover { background: var(--e-hover); border-color: var(--e-faint); }
.ef-btn:active { transform: scale(.97); }
.ef-btn[disabled] { opacity: .45; pointer-events: none; }
.btn.fill { background: var(--e-primary); color: var(--e-primary-ink); border-radius: 10px; font-weight: 500; box-shadow: none; }
.btn.fill:hover { box-shadow: none; background: color-mix(in srgb, var(--e-primary) 88%, var(--e-bg)); }
.btn.line, .btn.small, .dpage.col .tl-do.btn.small { border-radius: 10px; border: 1px solid var(--e-input); background: var(--e-field);
    color: var(--e-ink); font-weight: 500; }
.btn.line:hover, .btn.small:hover { background: var(--e-hover); border-color: var(--e-faint); }

/* ── Home ── */
.page > div.ef-home { display: flex; flex-direction: column; gap: 20px; width: 100%; margin-inline: auto; container-type: inline-size; }
.page > div.ef-home > * { margin-top: 0 !important; }
.arrive > .ef-kpis, .arrive > .ef-sec { animation: none; }
.ef-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 36px; padding-top: 4px; }
.ef-head h1 { font-size: 20px; line-height: 28px; font-weight: 600; letter-spacing: -.005em; color: var(--e-ink); text-wrap: balance; }
.arrive .ef-head h1 { animation: riseIn .6s var(--arrive) .04s backwards; }
.ef-acts { display: flex; align-items: center; gap: 8px; }

/* a tray, and the sheet in it */
.ef-tray { position: relative; display: flex; flex-direction: column; min-width: 0; border-radius: 14px; background: var(--e-tray);
    border: 1px solid var(--e-line); }
.arrive .ef-tray { animation: panelIn .75s var(--arrive) var(--d, 60ms) backwards; }
.ef-tray-h { height: 32px; flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 8px 0 16px; }
.ef-landed .ef-tray-h, .ef-disk .ef-tray-h, .ef-hours .ef-tray-h { height: 40px; }
.ef-tray-t { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 12px; line-height: 16px; letter-spacing: .025em;
    color: var(--e-muted); white-space: nowrap; }
.ef-tray-t > span { overflow: hidden; text-overflow: ellipsis; }
.ef-tray-t .ic { width: 12px; height: 12px; flex: none; stroke-width: 1.8; }
.ef-ib { width: 24px; height: 24px; flex: none; border-radius: 8px; display: grid; place-items: center; color: var(--e-muted);
    transition: background .15s ease, color .15s ease; }
.ef-ib .ic { width: 12px; height: 12px; stroke-width: 1.8; }
.ef-ib:hover { background: var(--e-hover); color: var(--e-ink); }
.ef-tb { height: 22px; flex: none; padding: 0 9px; border-radius: 7px; border: 1px solid var(--e-input); background: var(--e-field);
    font: 500 12px/1 var(--font); color: var(--e-ink); transition: background .15s ease, transform .2s var(--spring); }
.ef-tb:hover { background: var(--e-hover); }
.ef-tb:active { transform: scale(.95); }
.ef-sheet { position: relative; flex: 1 1 auto; min-width: 0; margin: 0 -1% -1px; padding: 16px; border-radius: 14px;
    background-color: var(--e-bg); background-image: var(--e-glow); border: 1px solid var(--e-line); box-shadow: var(--e-shadow); }
.ef-sheet::before { content: ""; position: absolute; inset: 0; border-radius: 13px; pointer-events: none; box-shadow: 0 -1px var(--e-hi); }
.ef-sheet.go { cursor: pointer; outline: none; transition: transform .3s var(--spring), border-color .2s ease; }
.ef-sheet.go:hover { transform: translateY(-1px); border-color: color-mix(in srgb, var(--e-line) 60%, var(--e-faint)); }
.ef-sheet.go:active { transform: none; transition-duration: .1s; }
.ef-sheet.go:focus-visible { border-color: var(--e-faint); }

/* four figures */
.ef-kpis { display: grid; grid-template-columns: repeat(var(--k, 4), minmax(0, 1fr)); gap: 12px; }
@container (max-width: 780px) { .ef-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.ef-num { display: flex; align-items: baseline; gap: 5px; min-width: 0; margin-bottom: 8px; }
.ef-num b { font-size: 20px; line-height: 28px; font-weight: 600; letter-spacing: .025em; font-variant-numeric: tabular-nums; color: var(--e-ink);
    white-space: nowrap; }
.ef-num small { font-size: 14px; font-weight: 500; color: var(--e-muted); white-space: nowrap; }
.ef-sub, .ef-move { min-height: 16px; font-size: 12px; line-height: 16px; color: var(--e-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ef-move { display: flex; align-items: center; gap: 4px; }
.ef-d { display: inline-flex; align-items: center; gap: 4px; font-weight: 500; font-variant-numeric: tabular-nums; }
.ef-d i { width: 12px; height: 12px; flex: none; border-radius: 50%; display: grid; place-items: center; color: var(--e-bg); }
.ef-d i .ic { width: 8px; height: 8px; stroke-width: 3; }
.ef-d.good { color: var(--e-good); }
.ef-d.good i { background: var(--e-good-dot); }
.ef-d.bad { color: var(--e-bad); }
.ef-d.bad i { background: var(--e-bad-dot); }
.ef-since { color: var(--e-muted); }

/* a section: its name, and on the right what goes with it */
.ef-sec { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.ef-sec-h { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 32px; }
.ef-sec-h h2 { font-size: 20px; line-height: 28px; font-weight: 600; color: var(--e-ink); }
.ef-seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: 10px; border: 1px solid var(--e-input); background: var(--e-field); }
.ef-seg button { height: 26px; padding: 0 10px; border-radius: 8px; font: 500 13px/1 var(--font); color: var(--e-muted);
    transition: background .15s ease, color .15s ease; }
.ef-seg button:hover { color: var(--e-ink); }
.ef-seg button.on { background: var(--e-sel); color: var(--e-ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .14); }
.ef-grid { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 20px; align-items: stretch; }
.ef-side { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 20px; min-width: 0; }
@container (max-width: 860px) { .ef-grid { grid-template-columns: minmax(0, 1fr); } }
.ef-none { padding: 4px 0; font-size: 13px; color: var(--e-muted); }

/* what landed: a bar a day */
.ef-landed .ef-sheet { padding: 0; display: flex; flex-direction: column; overflow: hidden; }
.ef-landed-b { display: flex; flex-direction: column; flex: 1; min-height: 400px; }
.ef-landed-b > .ef-none { padding: 20px; }
.ef-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 16px 20px 8px; }
.ef-legend { display: flex; flex-wrap: wrap; gap: 12px 32px; }
.ef-lg { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ef-lg-k { display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; color: var(--e-muted); }
.ef-lg b { font-size: 20px; line-height: 28px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--e-ink); }
.ef-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--e-s1); }
.ef-dot.s2 { background: var(--e-s2); }
.ef-dot.s3 { background: var(--e-s3); }
.ef-top > .ef-move { margin-top: 2px; }
.ef-plot { position: relative; flex: 1 1 auto; min-height: 240px; display: flex; padding: 12px 20px 0; }
.ef-bars { flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr));
    column-gap: clamp(2px, calc(240px / var(--n)), 12px); align-items: stretch; }
.ef-bar { min-width: 0; display: flex; flex-direction: column-reverse; justify-content: flex-start; transition: opacity .18s ease; }
.ef-bar i { --c: var(--e-s1); display: block; flex: none; min-height: 3px; transform-origin: 50% 100%;
    background: linear-gradient(180deg, color-mix(in srgb, var(--c) 44%, transparent), color-mix(in srgb, var(--c) 28%, transparent));
    box-shadow: inset 0 1px 0 var(--c); }
.ef-bar i.s2 { --c: var(--e-s2); }
.ef-bar i.s3 { --c: var(--e-s3); }
.ef-bar i.nil { min-height: 1px; height: 1px; background: var(--e-line); box-shadow: none; }
.ef-bar.dim { opacity: .38; }
.ef-bars.grow .ef-bar i, .arrive .ef-bars .ef-bar i { animation: efGrow .75s var(--arrive) calc(var(--d, 0ms) + 120ms + var(--i, 0) * 11ms) backwards; }
@keyframes efGrow { from { transform: scaleY(0); } }
.ef-axis { position: relative; flex: none; height: 32px; margin: 0 20px; }
.ef-axis span { position: absolute; top: 9px; transform: translateX(-50%); font-size: 12px; line-height: 16px; color: var(--e-faint); white-space: nowrap; }
.ef-quiet { position: absolute; inset: 0 20px; display: grid; place-items: center; font-size: 13px; color: var(--e-muted); pointer-events: none; }

/* your disk: two figures and a meter */
.ef-disk .ef-sheet { padding: 0; display: flex; flex-direction: column; overflow: hidden; min-height: 196px; }
.ef-disk .ef-sheet > .ef-none { padding: 16px; }
.ef-pair { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding: 16px; }
.ef-pair > div { min-width: 0; }
.ef-k { font-size: 12px; line-height: 16px; color: var(--e-muted); }
.ef-v { margin-top: 2px; font-size: 20px; line-height: 28px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--e-ink); white-space: nowrap; }
.ef-v.sm { font-size: 18px; }
.ef-pair-r { padding-left: 14px; border-left: 1px solid var(--e-line); }
.ef-meter { position: relative; margin-top: auto; height: 104px; display: flex; flex-direction: column;
    -webkit-mask-image: linear-gradient(180deg, #000 40%, transparent 100%); mask-image: linear-gradient(180deg, #000 40%, transparent 100%); }
.ef-mark { position: absolute; z-index: 1; top: 0; bottom: 0; left: var(--p); width: 2px; margin-left: -1px; border-radius: 2px 2px 0 0; background: var(--e-meter); }
.ef-meter-t { position: relative; height: 50%; }
.ef-meter-t span { position: absolute; top: 0; left: calc(var(--p) + 8px); font-size: 18px; line-height: 28px; font-weight: 500; color: var(--e-muted); white-space: nowrap; }
.ef-meter-t b { font-weight: 500; color: var(--e-ink); }
.ef-meter.left .ef-meter-t span { left: auto; right: calc(100% - var(--p) + 8px); }
.ef-meter-b { height: 50%; background: color-mix(in srgb, var(--e-meter) 15%, transparent);
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 12%, #000 88%, transparent 100%); mask-image: linear-gradient(90deg, transparent 0, #000 12%, #000 88%, transparent 100%); }
.ef-fill { display: block; height: 100%; width: var(--p); border-top: 2px solid var(--e-meter);
    background: linear-gradient(90deg, color-mix(in srgb, var(--e-meter) 30%, transparent), color-mix(in srgb, var(--e-meter) 40%, transparent)); }
.arrive .ef-fill { animation: efFill 1s var(--arrive) calc(var(--d, 0ms) + 160ms) backwards; }
.arrive .ef-mark { animation: efMark 1s var(--arrive) calc(var(--d, 0ms) + 160ms) backwards; }
.arrive .ef-meter-t span { animation: fade .5s ease calc(var(--d, 0ms) + 700ms) backwards; }
@keyframes efFill { from { width: 0; } }
@keyframes efMark { from { left: 0; } }

/* the hours your downloads arrive in */
.ef-hours .ef-sheet { padding: 0; display: flex; flex-direction: column; overflow: hidden; min-height: 196px; }
.ef-hours-b { display: flex; flex-direction: column; flex: 1; }
.ef-st { display: flex; flex-direction: column; gap: 2px; padding: 16px 16px 8px; min-width: 0; }
.ef-st b { font-size: 16px; line-height: 24px; font-weight: 600; color: var(--e-ink); }
.ef-st span { font-size: 14px; line-height: 20px; color: var(--e-muted); }
.ef-bars.hours { flex: none; height: 96px; margin: auto 16px 6px; column-gap: 3px; }
.ef-bars.hours .ef-bar i { --c: var(--e-faint); background: linear-gradient(180deg, color-mix(in srgb, var(--c) 52%, transparent), transparent); }
.ef-bars.hours .ef-bar.hot i { --c: var(--e-s1); }
.ef-bars.hours .ef-bar i.nil { background: var(--e-line); }

/* the label over a bar */
#chip.chip.ef { display: grid; gap: 6px; min-width: 150px; padding: 9px 11px; border-radius: 10px; background: var(--e-tip); color: var(--e-ink);
    border: 1px solid var(--e-line); box-shadow: var(--e-tip-shadow); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    font-size: 12px; line-height: 16px; }
#chip.chip.ef span { margin: 0; color: inherit; }
.ef-tip-d { color: var(--e-muted) !important; }
.ef-tip-r { display: flex; align-items: center; gap: 7px; }
.ef-tip-r b { margin-left: auto !important; padding-left: 14px; font-weight: 500; font-variant-numeric: tabular-nums; }

/* Home while it is read the first time */
.sk-tray .ef-sheet { display: grid; gap: 12px; align-content: start; }
.sk-bars { display: flex; align-items: flex-end; gap: 6px; height: 300px; padding: 40px 4px 0; }
.sk-bars .sk { flex: 1; width: auto !important; border-radius: 2px 2px 0 0; }

/* ── Settings: the menu on the left, the part on the right ── */
.page > div.apage.setp { max-width: 1120px; }
.set-wrap { display: grid; grid-template-columns: 232px minmax(0, 1fr); gap: 44px; align-items: start; padding-top: 8px; }
.set-nav { position: sticky; top: 8px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.set-me { display: flex; align-items: center; gap: 12px; min-width: 0; padding: 8px; margin: 0 0 10px; border-radius: 12px; text-align: left;
    transition: background .15s ease; }
.set-me:hover { background: var(--e-hover); }
.set-me .face2.small { width: 40px; height: 40px; border-radius: 11px; font-size: 15px; }
.set-me-w { display: flex; flex-direction: column; min-width: 0; line-height: 1.35; }
.set-me-w b { font-size: 14px; font-weight: 500; color: var(--e-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.set-me-w span { font-size: 13px; color: var(--e-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.set-tab { height: 36px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: 8px; font: 500 14px/20px var(--font);
    letter-spacing: .01em; color: var(--e-muted); text-align: left; transition: background .15s ease, color .15s ease; }
.set-tab .ic { width: 16px; height: 16px; stroke-width: 1.6; }
.set-tab:hover { background: var(--e-hover); color: var(--e-ink); }
.set-tab.on { background: var(--e-sel); color: var(--e-ink); }
.set-sep { display: block; height: 1px; margin: 8px 6px; background: var(--e-line); }
.set-body { min-width: 0; max-width: 780px; }
.arrive .set-body > * { animation: riseIn .55s var(--arrive) backwards; }
.arrive .set-body > *:nth-child(2) { animation-delay: .03s; } .arrive .set-body > *:nth-child(3) { animation-delay: .06s; }
.arrive .set-body > *:nth-child(4) { animation-delay: .09s; } .arrive .set-body > *:nth-child(n+5) { animation-delay: .12s; }
.set-h { padding: 4px 0 20px; }
.set-h h1 { font-size: 20px; line-height: 28px; font-weight: 600; color: var(--e-ink); }
.set-h p { margin-top: 4px; font-size: 14px; color: var(--e-muted); }
.set-sub { margin: 40px 0 0; padding-bottom: 14px; font-size: 16px; line-height: 24px; font-weight: 600; color: var(--e-ink); }
.srow { display: grid; grid-template-columns: minmax(0, 240px) minmax(0, 1fr); gap: 12px 32px; align-items: start; padding: 18px 0;
    border-top: 1px solid var(--e-line); }
.srow-l { min-width: 0; padding-top: 7px; }
.srow-t { font-size: 14px; line-height: 20px; font-weight: 500; color: var(--e-ink); }
.srow-d { margin-top: 3px; font-size: 13px; line-height: 18px; color: var(--e-muted); text-wrap: pretty; }
.srow-r { min-width: 0; min-height: 36px; display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 8px; }
.srow-r:has(> .field, > .userline, > .prof-work, > .prof-links, > .set-pic, > .ticks) { justify-content: flex-start; }
.srow-r > .field, .srow-r > .userline, .srow-r > .prof-work, .srow-r > .prof-links { flex: 1 1 100%; max-width: none; }
.srow-r > .ic { width: 18px; height: 18px; color: var(--e-good); stroke-width: 2.2; }
.srow.note { grid-template-columns: minmax(0, 1fr); }
.srow.note .srow-d { max-width: 62ch; }
.setp .field { height: 36px; width: 100%; padding: 0 12px; border-radius: 10px; border: 1px solid var(--e-input); background: var(--e-field);
    font: 400 14px/20px var(--font); color: var(--e-ink); box-shadow: none; transition: border-color .15s ease, box-shadow .15s ease; }
.setp .field:focus { border-color: var(--e-faint); box-shadow: 0 0 0 3px color-mix(in srgb, var(--e-faint) 22%, transparent); outline: none; }
.setp .field.area { height: auto; min-height: 84px; padding: 8px 12px; resize: vertical; }
.setp .field.bad { border-color: var(--e-bad); }
.setp .field::placeholder { color: var(--e-faint); }
.setp .switch { width: 36px; height: 20px; flex: none; background: var(--e-sel); box-shadow: inset 0 0 0 1px var(--e-line); }
.setp .switch::after { top: 2px; left: 2px; width: 16px; height: 16px; background: var(--e-bg); box-shadow: 0 1px 2px rgba(0, 0, 0, .25); }
.setp .switch.on { background: var(--e-primary); box-shadow: none; }
.setp .switch.on::after { transform: translateX(16px); background: var(--e-primary-ink); }
.setp .seg { padding: 2px; gap: 2px; border-radius: 10px; border: 1px solid var(--e-input); background: var(--e-field); }
.setp .seg button { height: 28px; padding: 0 11px; border-radius: 8px; font: 500 13px/1 var(--font); color: var(--e-muted); }
.setp .seg button.on { background: var(--e-sel); color: var(--e-ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .14); }
.setp .inkey { background: var(--e-sel); border: 1px solid var(--e-line); color: var(--e-muted); }

/* the top of your profile: your wallpaper across it, you in front */
.set-cover { position: relative; height: 156px; margin-bottom: 22px; border-radius: 14px; overflow: hidden; isolation: isolate;
    background: linear-gradient(135deg, #3f3f46 0%, #18181b 70%); border: 1px solid var(--e-line); }
.set-cover-pic, .set-cover-pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.set-cover-pic img { animation: fade .5s ease both; }
.set-cover::after { content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(0, 0, 0, 0) 30%, rgba(0, 0, 0, .55) 100%); }
.set-cover-me { position: absolute; z-index: 1; left: 20px; bottom: 18px; right: 220px; display: flex; align-items: center; gap: 14px; min-width: 0; }
.set-cover-me .face2.big { width: 64px; height: 64px; border-radius: 16px; font-size: 22px; box-shadow: 0 0 0 3px rgba(255, 255, 255, .92), 0 8px 20px rgba(0, 0, 0, .35); }
.set-cover-w { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; }
.set-cover-w b { font-size: 17px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.set-cover-w span { font-size: 13px; color: rgba(255, 255, 255, .78); }
.set-cover-r { position: absolute; z-index: 1; right: 16px; bottom: 18px; display: flex; align-items: center; gap: 8px; }
.set-cover-s { height: 24px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 500;
    color: rgba(255, 255, 255, .85); background: rgba(0, 0, 0, .38); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.set-cover-s::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: rgba(255, 255, 255, .55); }
.set-cover-s.on::before { background: #34d399; box-shadow: 0 0 0 3px rgba(52, 211, 153, .25); }
.ef-btn.glass { color: #fff; border-color: rgba(255, 255, 255, .22); background: rgba(0, 0, 0, .32); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.ef-btn.glass .ic { color: rgba(255, 255, 255, .8); }
.ef-btn.glass:hover { background: rgba(0, 0, 0, .45); border-color: rgba(255, 255, 255, .35); }
.set-pic { display: flex; align-items: center; gap: 16px; }
.set-pic .face2.big { width: 64px; height: 64px; border-radius: 14px; font-size: 22px; }
.set-pic-b { display: flex; flex-wrap: wrap; gap: 8px; }
.set-foot { display: flex; align-items: center; gap: 12px; padding: 20px 0 8px; border-top: 1px solid var(--e-line); }
.set-foot .gap { flex: 1; }
.setp .tick-chip { height: 30px; border-radius: 9px; }

/* your @username: the address, the name in it, and a tick */
.userline { flex-wrap: wrap; gap: 8px; max-width: none; }
.ugroup { position: relative; flex: 1 1 260px; min-width: 0; height: 36px; display: inline-flex; align-items: stretch; border-radius: 10px;
    border: 1px solid var(--e-input); background: var(--e-field); overflow: hidden; }
.ug-pre { flex: none; display: flex; align-items: center; padding: 0 10px 0 12px; font-size: 14px; color: var(--e-muted);
    background: var(--e-tray); border-right: 1px solid var(--e-input); white-space: nowrap; }
.ug-v { flex: 1; min-width: 0; display: flex; align-items: center; padding: 0 12px; font-size: 14px; color: var(--e-ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ug-ok { flex: none; display: flex; align-items: center; padding: 0 12px 0 4px; font-size: 12px; color: var(--e-faint); white-space: nowrap; }
.ug-ok.cloud .ic { width: 16px; height: 16px; padding: 3px; border-radius: 50%; color: #fff; background: var(--e-good-dot); stroke-width: 3.2; }
.userline .ufield.ugroup { max-width: none; display: inline-flex; }
.userline .ufield.ugroup .field { flex: 1; min-width: 0; height: auto; width: auto; padding: 0 12px; border: 0; border-radius: 0; background: transparent; box-shadow: none; }
.userline .ufield.ugroup .field:focus { box-shadow: none; }
.userline .ufield.ugroup:focus-within { border-color: var(--e-faint); box-shadow: 0 0 0 3px color-mix(in srgb, var(--e-faint) 22%, transparent); }
.userline .ufield.ugroup .ustat { position: static; transform: none; flex: none; align-self: center; margin-right: 10px; }
.userline .unote { flex-basis: 100%; order: 5; white-space: normal; }
.userline .unote:empty { display: none; }

/* Help: the keys as Efferd draws its kbd */
.set-keys { margin-top: 22px; border-top: 1px solid var(--e-line); }
.set-keys .kr { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 46px; border-bottom: 1px solid var(--e-line);
    font-size: 14px; color: var(--e-body); }
.kc { display: inline-flex; align-items: center; gap: 4px; flex: none; }
.kc kbd { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 6px; display: inline-grid; place-items: center;
    font: 500 12px/1 var(--font); color: var(--e-muted); background: var(--e-tray); border: 1px solid var(--e-line); box-shadow: 0 1px 0 var(--e-line); }
.kc i { font-style: normal; font-size: 12px; color: var(--e-faint); }
.setp .set-body > .srow + .set-keys { margin-top: 0; }

/* About */
.set-about { display: flex; align-items: center; gap: 16px; padding: 4px 0 24px; }
.sb-mark.big { width: 56px; height: 56px; border-radius: 15px; display: grid; place-items: center; background: var(--e-ink); }
.sb-mark.big .eyes-mark { width: 30px; height: 24px; --glance: 9px; }
.sb-mark.big .eyes-mark .eye { fill: var(--e-bg); }
.set-about .word-mark { display: block; height: 16px; width: auto; color: var(--e-ink); }
.set-about p { margin-top: 8px; font-size: 13px; color: var(--e-muted); }

@container (max-width: 760px) {
    .set-wrap { grid-template-columns: minmax(0, 1fr); gap: 20px; }
    .set-nav { position: static; flex-direction: row; flex-wrap: wrap; }
    .set-me, .set-sep { display: none; }
    .srow { grid-template-columns: minmax(0, 1fr); }
}

/* ── the pane on Send, on the same greys ── */
.insp .td-dot, .td-dot.c2, .td-dot.c3 { background: var(--e-s2); }

/* ── every other page: the title the size of Efferd's, on the same greys ── */
.apage > .head h1 { font-size: 20px; line-height: 28px; font-weight: 600; letter-spacing: -.005em; }
.page > div.apage > .head + .panel, .page > div.apage > .head + .split, .page > div.apage > .head + .grid { margin-top: 24px; }
.page > div.apage > .panel, .page > div.apage > .grid, .page > div.apage > .cols,
.page > div.apage > section, .page > div.apage > .view { margin-top: 40px; }
.apage .panel.tile, .apage .panel.live { border-radius: 14px; background: var(--e-tray); border: 1px solid var(--e-line); }
.page > div.dpage.col .dh h1 { font-size: 20px; line-height: 28px; font-weight: 600; letter-spacing: -.005em; }

/* ── the first minute, on the same greys, with a Dock that answers ── */
.intro { background: var(--e-bg); }
.intro .dots i, .intro .dots i.on { background: var(--e-sel); }
.intro .dots i.past { background: var(--e-faint); }
.intro .dots i.on::after { background: var(--e-ink); }
.st-head h1 { font-weight: 600; letter-spacing: -.03em; }
.s-hello .st-head h1.hello-t { font-weight: 600; }
.hd { background: var(--e-tray); box-shadow: inset 0 0 0 1px var(--e-line); color: var(--e-body); }
.hd .ic { color: var(--e-muted); }
.acc { border-radius: 14px; border: 1px solid var(--e-line); background: var(--e-tray); }
.acc.yes { border-color: color-mix(in srgb, var(--e-good-dot) 45%, var(--e-line)); }
.btn.large { height: 40px; border-radius: 10px; }
.youform .field, .s-you .field { height: 40px; border-radius: 10px; border: 1px solid var(--e-input); background: var(--e-field); }

/* the small screen's Dock: real tiles, each with its own width again */
.mac-dock { gap: .35em; padding: .5em .55em; min-width: 0; border-radius: 1.5em; }
.mac-dock .dt { position: relative; flex: none; width: calc(var(--ds, 4.2em) * var(--mag, 1)); height: var(--ds, 4.2em);
    display: block; transition: width .16s cubic-bezier(.2, .8, .3, 1); cursor: default; }
.mac-dock .dt > img, .mac-dock .dt > .noicon { position: absolute; left: 50%; bottom: 0; width: var(--ds, 4.2em); height: var(--ds, 4.2em);
    margin-left: calc(var(--ds, 4.2em) / -2); object-fit: contain; transform: scale(var(--mag, 1)); transform-origin: 50% 100%;
    transition: transform .16s cubic-bezier(.2, .8, .3, 1); }
.mac-dock .dt > .noicon { font-size: calc(var(--ds, 4.2em) * .42); }
.mac-dock .dt.hop > img, .mac-dock .dt.hop > .noicon { animation: hop .75s cubic-bezier(.3, .7, .4, 1); }
@keyframes hop { 0%, 100% { translate: 0 0; } 25% { translate: 0 -55%; } 50% { translate: 0 0; } 70% { translate: 0 -22%; } 85% { translate: 0 0; } }

/* the big Dock: the same manners */
.bigdock.mag .dk, .bigdock.mag .dk:hover, .bigdock.mag .dk:hover + .dk, .bigdock.mag .dk:has(+ .dk:hover) { transform: none; }
.bigdock .dk { width: calc(58px * var(--mag, 1)); height: 58px; aspect-ratio: auto; flex: none; transition: width .14s cubic-bezier(.2, .8, .3, 1); }
.bigdock .dk > img, .bigdock .dk > .noicon, .bigdock .dk.plus > .plusart { position: absolute; left: 50%; bottom: 0; top: auto; right: auto;
    width: 58px; height: 58px; margin-left: -29px; inset: auto auto 0 50%; transform: scale(var(--mag, 1)); transform-origin: 50% 100%;
    transition: transform .14s cubic-bezier(.2, .8, .3, 1), opacity .2s ease, filter .2s ease; }
.bigdock .dk.plus > .plusart { width: 50px; height: 50px; margin-left: -25px; bottom: 4px; }
.bigdock .dk.out > img, .bigdock .dk.out > .noicon { transform: scale(calc(var(--mag, 1) * .84)); }
.bigdock .dk .lbl { bottom: calc(58px * var(--mag, 1) + 10px); }
.bigdock .dk .mk { top: auto; bottom: calc(58px * var(--mag, 1) - 14px); left: calc(50% - 29px * var(--mag, 1) - 4px); }
.bigdock .dk.hop > img, .bigdock .dk.hop > .noicon { animation: hop .75s cubic-bezier(.3, .7, .4, 1); }
@media (prefers-reduced-motion: reduce) {
    .ef-bars .ef-bar i, .arrive .ef-tray, .arrive .ef-fill, .arrive .ef-mark, .arrive .ef-meter-t span, .arrive .ef-head h1,
    .arrive .set-body > *, .mac-dock .dt > img, .bigdock .dk > img { animation: none !important; }
    .ef-sheet.go:hover { transform: none; }
}

/* the small screen stands in its own light: the colour of the wallpaper on
   it, read off the picture (glowFrom), and moving to the next one as you
   pick it. Registered, so the colour itself can be eased. */
@property --glow-1 { syntax: '<color>'; inherits: true; initial-value: #5a6b80; }
@property --glow-2 { syntax: '<color>'; inherits: true; initial-value: #2d3a4a; }
:root { transition: --glow-1 .9s ease, --glow-2 .9s ease; }
.intro .st-stage { position: relative; }
.intro .st-stage::before { content: ""; position: absolute; z-index: 0; left: 8%; right: 8%; top: 14%; bottom: -4%; pointer-events: none;
    border-radius: 50%; filter: blur(56px); opacity: .55;
    background: radial-gradient(closest-side, color-mix(in srgb, var(--glow-1) 70%, transparent), color-mix(in srgb, var(--glow-2) 35%, transparent) 60%, transparent); }
@media (prefers-color-scheme: light) { .intro .st-stage::before { opacity: .38; } }
.intro .st-stage > * { position: relative; z-index: 1; }
.s-access .st-stage::before, .s-you .st-stage::before, .s-user .st-stage::before { display: none; }
.s-access .st-stage { place-items: center; padding-top: 0; }
.acc { transition: border-color .3s ease, transform .3s var(--spring), background .2s ease; }
.acc:hover { transform: translateY(-2px); }

/* a figure's own button, quieter than the figure */
.ef-tb { border-color: var(--e-line); background: transparent; color: var(--e-body); }
.ef-tb:hover { color: var(--e-ink); border-color: var(--e-input); }
/* on the glass, the keys and the light are glass too */
html.glass .sb .sb-find .sb-keys kbd { background: var(--e-mark); }
html.glass .sb .sb-find { background: var(--e-hover); }
/* the first row of a part has no line over it */
.set-h + .srow, .set-cover + .srow, .set-sub + .srow { border-top: 0; }

/* ── every other page: its blocks in trays, the same as Home's ── */
.apage .panel:not(.tile):not(.live):not(.kpis):not(.sheet-card) { position: relative; isolation: isolate; padding: 0 18px 18px;
    border-radius: 14px; background: var(--e-tray); border: 1px solid var(--e-line); box-shadow: none; }
.apage .panel:not(.tile):not(.live):not(.kpis):not(.sheet-card)::after { content: ""; position: absolute; z-index: -1; left: -1%; right: -1%;
    top: 32px; bottom: -1px; border-radius: 14px; pointer-events: none; background-color: var(--e-bg); background-image: var(--e-glow);
    border: 1px solid var(--e-line); box-shadow: var(--e-shadow), 0 -1px var(--e-hi); }
.apage .panel:not(.tile):not(.live):not(.kpis):not(.sheet-card):not(:has(> .cap)) { padding-top: 18px; }
.apage .panel:not(.tile):not(.live):not(.kpis):not(.sheet-card):not(:has(> .cap))::after { top: -1px; }
.apage .panel:not(.tile):not(.live):not(.kpis):not(.sheet-card) > .cap { height: 32px; min-height: 32px; margin: 0 -8px 16px -2px; gap: 6px;
    font-size: 12px; line-height: 16px; letter-spacing: .025em; color: var(--e-muted); }
.apage .panel:not(.tile):not(.live):not(.kpis):not(.sheet-card) > .cap > .ic { display: block; width: 12px; height: 12px; stroke-width: 1.8; color: var(--e-muted); }
.apage .panel:not(.tile):not(.live):not(.kpis):not(.sheet-card) > .cap .r { font-size: 12px; color: var(--e-faint); }
.apage .split { gap: 20px; }

/* ── clear glass: the window's glass without the wallpaper's colour ──────
   Dan: "why colourful glass — I want the clear one". The sidebar material
   tints itself with whatever is behind the window, and a bright wallpaper
   made the sidebar brown and green. So the glass gets a veil of the
   sidebar's own grey, laid over the whole frame (the sidebar and the
   window's edge round the page are one piece): what is behind still moves
   in it as light and shade, but not as colour. A faint sheen across its
   top is what makes it read as glass rather than paint. */
:root { --veil: rgba(250, 250, 250, .8); --sheen: linear-gradient(160deg, rgba(255, 255, 255, .55), rgba(255, 255, 255, 0) 38%); }
@media (prefers-color-scheme: dark) {
    :root { --veil: rgba(22, 22, 22, .8); --sheen: linear-gradient(160deg, rgba(255, 255, 255, .05), rgba(255, 255, 255, 0) 38%); }
}
html.glass #app.app { background: var(--sheen), var(--veil); }
html.glass .sb, html.glass .app:not(.wide) .sb { background: transparent; }

/* ── v18: the Claude app's way ─────────────────────────────────────────────
   Dan, after the film: the window "clean, in the fonts you have, clean the
   way you have it" — the Claude app he was talking to. So: warm paper by
   day and warm charcoal by night instead of neutral grey, and fewer boxes:
   a card is one surface with its name inside it, not a tray with a sheet
   laid in it. The type is Geist, one face for everything. A book face for
   the titles, the Claude way, was tried first; he called those fonts awful
   and picked Geist alone out of four, so the titles and the big figures are
   its semibold, set tight. Every colour is still a token, light first, dark
   after it. */


:root {
    color-scheme: light;
    --font: "Geist", -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;

    /* the surfaces: the window's paper, the page, and a card on the page */
    --app: #f3f1ea; --rail: #f3f1ea; --ground: #f3f1ea;
    --bg: #faf9f5; --panel: #faf9f5; --well: #faf9f5; --page-paint: #faf9f5; --sunk: #f5f3ee;
    --raise: #ffffff; --surf: #f3f1ea; --surf-2: #ece9e0;
    --c-card: #ffffff; --c-line: rgba(31, 30, 29, .1);
    --card: linear-gradient(transparent, transparent); --card-line: transparent;
    --hover: rgba(31, 30, 29, .045); --sel: #ece9e0; --sel-2: #e4e1d7;
    --line: rgba(31, 30, 29, .1); --line-2: rgba(31, 30, 29, .17); --line-hi: transparent;

    /* the words */
    --ink: #1f1e1d; --body: #3d3c38; --muted: #75736c; --faint: #a3a097; --ghost: #cfcbc1;
    --good: #3b8a5a; --bad: #c2523c;
    --pill-good: #e5f1e8; --pill-bad: #f8e6e1;

    /* figures and the marks beside them, all warm greys */
    --data: #57554f; --data-2: #a3a097; --data-soft: #ece9e0;
    --dot: rgba(31, 30, 29, .08); --dot-1: #57554f; --dot-2: #8c8980; --dot-3: #b9b5ab; --dot-off: rgba(31, 30, 29, .07);
    --w0: #eae7df; --w1: #c9c5bb; --w2: #9c998f; --w3: #75736c;

    /* what you press */
    --btn-line: rgba(31, 30, 29, .17); --icon-tile: #a3a097;
    --on: #1f1e1d; --on-ink: #faf9f5; --on-hi: #000000;
    --accent: #1f1e1d; --accent-ink: #faf9f5; --accent-2: rgba(31, 30, 29, .06);
    --mark: #1f1e1d; --mark-ink: #faf9f5;
    --edge: rgba(31, 30, 29, .28);
    --kbd: #ece9e0; --col: #ffffff; --row-on: #f3f1ea;
    --chip: rgba(31, 30, 29, .04); --chip-hi: rgba(31, 30, 29, .07);
    --tile: #ffffff; --tile-hi: #faf9f5; --tile-shade: 0 0 0 transparent;
    --fill-face: #ece9e0; --fill-hi: rgba(31, 30, 29, .1);

    /* the side of the window */
    --side-field: #ffffff; --side-hover: rgba(31, 30, 29, .045); --side-sel: #e7e4da; --side-ring: transparent;
    --rail-hover: rgba(31, 30, 29, .05);

    /* light and shade */
    --glass: rgba(243, 241, 234, .55); --glow: rgba(31, 30, 29, .03); --page-glow: none;
    --shade: rgba(31, 30, 29, .32); --sheet-shade: none;
    --shadow: 0 18px 50px rgba(31, 30, 29, .14), 0 2px 6px rgba(31, 30, 29, .05);
    --lift: 0 1px 2px rgba(31, 30, 29, .08), 0 6px 16px rgba(31, 30, 29, .07);
    --pop-shadow: 0 24px 70px rgba(31, 30, 29, .16), 0 2px 8px rgba(31, 30, 29, .06);
    --bar-hi: rgba(255, 255, 255, .6); --bar-lo: transparent;

    /* Efferd's names, on the same paper */
    --e-bg: #faf9f5; --e-side: #f3f1ea; --e-card: #ffffff; --e-tray: #ffffff;
    --e-line: rgba(31, 30, 29, .1); --e-input: rgba(31, 30, 29, .17); --e-field: #ffffff;
    --e-sel: #ece9e0; --e-hover: rgba(31, 30, 29, .045); --e-mark: rgba(31, 30, 29, .07);
    --e-ink: #1f1e1d; --e-body: #3d3c38; --e-muted: #75736c; --e-faint: #a3a097;
    --e-good: #3b8a5a; --e-good-dot: #4caf74; --e-bad: #c2523c; --e-bad-dot: #d9634b;
    --e-s1: #7d7a71; --e-s2: #b3afa5; --e-s3: #dcd8cd; --e-meter: #7d7a71;
    --e-glow: none; --e-hi: transparent; --e-shadow: none;
    --e-tip: rgba(255, 255, 255, .98); --e-tip-shadow: 0 10px 30px rgba(31, 30, 29, .14);
    --e-primary: #1f1e1d; --e-primary-ink: #faf9f5;

    /* the window's glass, veiled in its own paper */
    --veil: rgba(243, 241, 234, .86); --sheen: linear-gradient(160deg, rgba(255, 255, 255, .5), rgba(255, 255, 255, 0) 38%);
}
@media (prefers-color-scheme: dark) {
    :root {
        color-scheme: dark;
        --app: #1f1e1d; --rail: #1f1e1d; --ground: #1f1e1d;
        --bg: #262624; --panel: #262624; --well: #262624; --page-paint: #262624; --sunk: #222220;
        --raise: #30302e; --surf: #2b2b29; --surf-2: #33332f;
        --c-card: #30302e; --c-line: rgba(222, 220, 209, .12);
        --hover: rgba(240, 238, 230, .05); --sel: #393836; --sel-2: #42413e;
        --line: rgba(222, 220, 209, .12); --line-2: rgba(222, 220, 209, .2);

        --ink: #f4f3ee; --body: #dedcd3; --muted: #a8a59c; --faint: #7a7871; --ghost: #4f4e4a;
        --good: #7cc79b; --bad: #e8876f;
        --pill-good: rgba(124, 199, 155, .14); --pill-bad: rgba(232, 135, 111, .14);

        --data: #d8d5cb; --data-2: #8f8c83; --data-soft: #33332f;
        --dot: rgba(240, 238, 230, .08); --dot-1: #d8d5cb; --dot-2: #a8a59c; --dot-3: #77756e; --dot-off: rgba(240, 238, 230, .07);
        --w0: #e6e3d9; --w1: #b8b5ab; --w2: #8f8c83; --w3: #6b6964;

        --btn-line: rgba(222, 220, 209, .2); --icon-tile: #7a7871;
        --on: #f4f3ee; --on-ink: #1f1e1d; --on-hi: #ffffff;
        --accent: #f4f3ee; --accent-ink: #1f1e1d; --accent-2: rgba(240, 238, 230, .08);
        --mark: #f4f3ee; --mark-ink: #1f1e1d;
        --edge: rgba(240, 238, 230, .32);
        --kbd: #3a3936; --col: #2b2b29; --row-on: #2f2f2d;
        --chip: rgba(240, 238, 230, .05); --chip-hi: rgba(240, 238, 230, .09);
        --tile: #30302e; --tile-hi: #2b2b29;
        --fill-face: #3a3936; --fill-hi: rgba(240, 238, 230, .12);

        --side-field: #2b2b29; --side-hover: rgba(240, 238, 230, .05); --side-sel: #393836;
        --rail-hover: rgba(240, 238, 230, .06);

        --glass: rgba(31, 30, 29, .4); --glow: rgba(240, 238, 230, .04);
        --shade: rgba(10, 10, 9, .55);
        --shadow: 0 18px 50px rgba(0, 0, 0, .5);
        --lift: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 16px rgba(0, 0, 0, .3);
        --pop-shadow: 0 30px 80px rgba(0, 0, 0, .5), 0 0 0 1px rgba(0, 0, 0, .2);
        --bar-hi: rgba(255, 255, 255, .04);

        --e-bg: #262624; --e-side: #1f1e1d; --e-card: #30302e; --e-tray: #30302e;
        --e-line: rgba(222, 220, 209, .12); --e-input: rgba(222, 220, 209, .2); --e-field: rgba(240, 238, 230, .04);
        --e-sel: #393836; --e-hover: rgba(240, 238, 230, .05); --e-mark: rgba(240, 238, 230, .08);
        --e-ink: #f4f3ee; --e-body: #dedcd3; --e-muted: #a8a59c; --e-faint: #7a7871;
        --e-good: #7cc79b; --e-good-dot: #5db585; --e-bad: #e8876f; --e-bad-dot: #e06e55;
        --e-s1: #bdb9ae; --e-s2: #85827a; --e-s3: #5a5853; --e-meter: #a8a59c;
        --e-tip: rgba(48, 48, 46, .97); --e-tip-shadow: 0 12px 34px rgba(0, 0, 0, .45);
        --e-primary: #f4f3ee; --e-primary-ink: #1f1e1d;
        --g-over: rgba(31, 30, 29, .92);

        --veil: rgba(31, 30, 29, .88); --sheen: linear-gradient(160deg, rgba(255, 255, 255, .04), rgba(255, 255, 255, 0) 38%);
    }
