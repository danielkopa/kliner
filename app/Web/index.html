<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Nothing here reaches the network, and nothing can load from anywhere
     but this folder: no scripts, no pictures, no connections. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; font-src file: data:; img-src data:; connect-src 'none'; media-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="color-scheme" content="dark light">
<title>Kliner</title>
<style>
/* ── Kliner's window ─────────────────────────────────────────────────────
   One stylesheet for the whole window. Dark is the design; light follows
   the Mac when the Mac is light. Every colour is a token, and every token
   is defined in both, so nothing is ever one theme's ink on the other's
   ground.                                                              */

@font-face {
    font-family: "Geist";
    src: url("../fonts/Geist-Variable.ttf") format("truetype");
    font-weight: 100 900;
    font-style: normal;
    font-display: block;
}

:root {
    color-scheme: dark;
    --bg:      #0a0a0a;
    --rail:    #0a0a0a;
    --raise:   #0f0f0f;
    --well:    #0d0d0d;
    --hover:   #151515;
    --sel:     #1b1b1b;
    --sel-2:   #242424;
    --line:    #1f1f1f;
    --line-2:  #2c2c2c;
    --ink:     #ededed;
    --body:    #c4c4c4;
    --muted:   #8a8a8a;
    --faint:   #5c5c5c;
    --ghost:   #3a3a3a;
    --good:    #3fcf8e;
    --bad:     #f0616d;
    --on:      #f2f2f2;       /* the one filled button */
    --on-ink:  #0a0a0a;
    --w0: #e9e9e9; --w1: #bdbdbd; --w2: #949494; --w3: #707070; --w4: #4f4f4f; --w5: #383838;
    --shadow: 0 30px 80px rgba(0,0,0,.65);
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
}

@media (prefers-color-scheme: light) {
    :root {
        color-scheme: light;
        --bg:      #fafafa;
        --rail:    #f4f4f3;
        --raise:   #ffffff;
        --well:    #f6f6f5;
        --hover:   #efefee;
        --sel:     #e9e9e8;
        --sel-2:   #dededc;
        --line:    #e6e6e4;
        --line-2:  #cfcfcc;
        --ink:     #111111;
        --body:    #333333;
        --muted:   #6f6f6f;
        --faint:   #9a9a98;
        --ghost:   #c4c4c2;
        --good:    #13a15f;
        --bad:     #d93a48;
        --on:      #111111;
        --on-ink:  #fafafa;
        --w0: #1a1a1a; --w1: #454545; --w2: #6d6d6d; --w3: #939393; --w4: #b7b7b7; --w5: #d2d2d0;
        --shadow: 0 24px 70px rgba(0,0,0,.18);
    }
}

* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }

html, body { height: 100%; overflow: hidden; }
body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Geist", -apple-system, "SF Pro Text", system-ui, sans-serif;
    font-size: 13px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
    -webkit-user-select: none;
    user-select: none;
    cursor: default;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: default; }
input { font: inherit; color: inherit; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--line-2); outline-offset: 2px; border-radius: 6px; }
svg { display: block; }
.ic { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.6;
      stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }

/* ── the frame: a rail, a bar, and the page ─────────────────────────── */

.app { display: grid; grid-template-columns: 76px 1fr; height: 100vh; }
.app.wide { grid-template-columns: 216px 1fr; }

.rail {
    background: var(--rail);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
    padding: 52px 0 14px;          /* the lights live in the top 52 */
    min-height: 0;
}
.rail .places { display: flex; flex-direction: column; gap: 4px; padding: 0 20px; }
.rail .foot   { margin-top: auto; display: flex; flex-direction: column; gap: 4px; padding: 0 20px; }
.rail .sep    { height: 1px; background: var(--line); margin: 10px 8px; }
.rail .label  { display: none; }

.spot {
    position: relative;
    height: 36px; min-width: 36px;
    border-radius: 9px;
    display: flex; align-items: center; gap: 11px;
    padding: 0 10px;
    color: var(--faint);
    transition: background .14s ease, color .14s ease;
}
.spot .ic { width: 16px; height: 16px; }
.spot:hover { color: var(--body); background: var(--hover); }
.spot.on { color: var(--ink); background: var(--sel); }
.spot .count {
    position: absolute; top: 3px; right: 3px;
    min-width: 15px; height: 15px; padding: 0 4px;
    border-radius: 999px; background: var(--sel-2); color: var(--body);
    font-size: 9.5px; font-weight: 500; line-height: 15px; text-align: center;
}
.spot.on .count { background: var(--on); color: var(--on-ink); }

.app.wide .rail .places, .app.wide .rail .foot { padding: 0 12px; }
.app.wide .rail .label { display: block; font-size: 13px; color: inherit; white-space: nowrap; }
.app.wide .spot .count { position: static; margin-left: auto; }
.app.wide .rail .kids { display: flex; }
.rail .kids { display: none; flex-direction: column; gap: 2px; margin: 2px 0 6px 27px; }
.kid { height: 28px; border-radius: 7px; padding: 0 10px; display: flex; align-items: center;
       color: var(--faint); font-size: 12.5px; }
.kid:hover { color: var(--body); background: var(--hover); }
.kid.on { color: var(--ink); background: var(--sel); }

/* the name beside a picture, when the rail is only pictures */
.tip {
    position: fixed; z-index: 60; pointer-events: none;
    background: var(--raise); color: var(--ink);
    border: 1px solid var(--line-2); border-radius: 7px;
    padding: 4px 9px; font-size: 12px; white-space: nowrap;
    box-shadow: 0 8px 24px rgba(0,0,0,.35);
    opacity: 0; transform: translateX(-4px);
    transition: opacity .12s ease, transform .12s ease;
}
.tip.show { opacity: 1; transform: none; }
.tip kbd { font: inherit; color: var(--faint); margin-left: 8px; }

.main { min-width: 0; min-height: 0; display: flex; flex-direction: column; }

.bar {
    height: 52px; flex: 0 0 auto;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px;
    padding: 0 16px 0 14px;
}
.bar .nav { display: flex; gap: 2px; }
.sq {
    width: 28px; height: 28px; border-radius: 7px;
    display: grid; place-items: center; color: var(--faint);
    transition: background .14s ease, color .14s ease;
}
.sq:hover { background: var(--hover); color: var(--body); }
.sq[disabled] { opacity: .35; pointer-events: none; }
.sq .ic { width: 15px; height: 15px; }

.where { display: flex; align-items: center; gap: 9px; min-width: 0; }
.where .ic { color: var(--muted); width: 15px; height: 15px; }
.where .group { color: var(--faint); font-size: 13px; white-space: nowrap; }
.where .slash { color: var(--ghost); }
.where .name { font-size: 13.5px; font-weight: 500; white-space: nowrap; }

.tabs { display: flex; gap: 2px; margin-left: 6px; padding: 2px; border-radius: 9px;
        background: var(--well); border: 1px solid var(--line); }
.tab { height: 24px; padding: 0 10px; border-radius: 7px; font-size: 12.5px; color: var(--muted);
       display: flex; align-items: center; white-space: nowrap; }
.tab:hover { color: var(--body); }
.tab.on { background: var(--sel); color: var(--ink); }

.bar .right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.age { color: var(--faint); font-size: 12px; white-space: nowrap; }
.mode {
    height: 28px; padding: 0 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--well);
    display: flex; align-items: center; gap: 7px;
    color: var(--muted); font-size: 12.5px; white-space: nowrap;
}
.mode:hover { color: var(--body); border-color: var(--line-2); }
.mode .ic { width: 14px; height: 14px; }
.mode.on { color: var(--on-ink); background: var(--on); border-color: var(--on); }

.find {
    height: 30px; padding: 0 8px 0 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--well);
    display: flex; align-items: center; gap: 8px;
    color: var(--muted); font-size: 12.5px; min-width: 150px;
}
.find:hover { border-color: var(--line-2); color: var(--body); }
.find .ic { width: 14px; height: 14px; }
.find kbd { margin-left: auto; font: inherit; font-size: 11px; color: var(--faint);
            border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; line-height: 17px; }

.bell { position: relative; width: 30px; height: 30px; border-radius: 8px;
        border: 1px solid var(--line); background: var(--well);
        display: grid; place-items: center; color: var(--muted); }
.bell:hover { color: var(--body); border-color: var(--line-2); }
.bell .ic { width: 15px; height: 15px; }
.bell .dot { position: absolute; top: 6px; right: 7px; width: 6px; height: 6px;
             border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 2px var(--well); }

.face { width: 30px; height: 30px; border-radius: 8px; background: var(--sel);
        display: grid; place-items: center; }
.face svg { width: 20px; height: 20px; }
.face .body { fill: var(--ink); }
.face .eye  { fill: var(--sel); }

/* ── the page ───────────────────────────────────────────────────────── */

.scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }
.page { padding: 18px 20px 40px; max-width: 1360px; }
/* a page is a column of blocks with one gap between them — never margins,
   which leak into grids and double up */
.page > div { display: grid; gap: 14px; align-content: start; }

.head { display: flex; align-items: flex-start; gap: 20px; padding: 6px 4px 6px; }
.head .words { min-width: 0; flex: 1; }
.head h1 { font-size: 24px; font-weight: 600; letter-spacing: -.02em; line-height: 1.15; }
.head p  { margin-top: 6px; color: var(--muted); font-size: 13px; max-width: 64ch; text-wrap: pretty; }
.head .cmd { margin-top: 10px; display: inline-flex; align-items: center; gap: 8px;
             font-family: var(--mono); font-size: 11.5px; color: var(--faint);
             border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; background: var(--well); }
.head .acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end;
              padding-top: 2px; }

/* buttons: one filled, the rest quiet */
.btn {
    height: 32px; padding: 0 13px; border-radius: 8px;
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 500; white-space: nowrap;
    transition: background .14s ease, border-color .14s ease, color .14s ease, opacity .14s ease, transform .08s ease;
}
.btn .ic { width: 15px; height: 15px; }
.btn.fill { background: var(--on); color: var(--on-ink); }
.btn.fill:hover { opacity: .9; }
.btn.fill:active { transform: scale(.985); }
.btn.line { border: 1px solid var(--line); background: var(--well); color: var(--body); font-weight: 450; }
.btn.line:hover { border-color: var(--line-2); color: var(--ink); }
.btn.bare { color: var(--muted); padding: 0 8px; font-weight: 450; }
.btn.bare:hover { color: var(--ink); background: var(--hover); }
.btn[disabled] { opacity: .4; pointer-events: none; }
.btn.small { height: 28px; padding: 0 10px; font-size: 12.5px; }

.pill {
    display: inline-flex; align-items: center; gap: 5px;
    height: 20px; padding: 0 8px; border-radius: 999px;
    background: var(--sel); color: var(--body);
    font-size: 11.5px; font-weight: 450; white-space: nowrap;
}
.pill.hi { background: var(--on); color: var(--on-ink); }
.pill.good { color: var(--good); background: color-mix(in srgb, var(--good) 12%, transparent); }
.pill.bad  { color: var(--bad);  background: color-mix(in srgb, var(--bad) 12%, transparent); }
.pill .ic { width: 11px; height: 11px; stroke-width: 2; }

/* ── a panel is four corners and nothing else ───────────────────────── */

.grid { display: grid; gap: 14px; }
.grid.two  { grid-template-columns: 1fr 1fr; }
.grid.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }

.panel { position: relative; padding: 20px; min-width: 0; }
.panel > .c { position: absolute; width: 13px; height: 13px; pointer-events: none; border-color: var(--line-2); border-style: solid; border-width: 0; }
.panel > .c.a { left: 0; top: 0; border-left-width: 1px; border-top-width: 1px; }
.panel > .c.b { right: 0; top: 0; border-right-width: 1px; border-top-width: 1px; }
.panel > .c.d { left: 0; bottom: 0; border-left-width: 1px; border-bottom-width: 1px; }
.panel > .c.e { right: 0; bottom: 0; border-right-width: 1px; border-bottom-width: 1px; }
.panel.solid { background: var(--raise); border: 1px solid var(--line); border-radius: 12px; }
.panel.solid > .c { display: none; }

.cap { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; min-height: 18px; }
.cap .ic { width: 14px; height: 14px; }
.cap .r { margin-left: auto; color: var(--faint); font-size: 11.5px; display: flex; align-items: center; gap: 8px; }
.cap .r .btn { height: 24px; font-size: 12px; }

.big { display: flex; align-items: flex-start; gap: 14px; }
.big .n { font-size: 30px; font-weight: 600; letter-spacing: -.025em; line-height: 1.05; white-space: nowrap; }
.big .n small { font-size: 15px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-left: 5px; }
.big .sub { margin-top: 6px; color: var(--muted); font-size: 12.5px; }
.big .move { margin-left: auto; text-align: right; flex: 0 0 auto; }
.big .move .d { font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; gap: 4px; }
.big .move .d.good { color: var(--good); }
.big .move .d.bad  { color: var(--bad); }
.big .move .d .ic { width: 12px; height: 12px; stroke-width: 2; }
.big .move .w { color: var(--faint); font-size: 11.5px; margin-top: 3px; }

/* metric tiles */
.tile { padding: 16px 18px 16px; }
.tile .k { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 7px; }
.tile .k .ic { width: 13px; height: 13px; }
.tile .v { margin-top: 10px; font-size: 24px; font-weight: 600; letter-spacing: -.02em; line-height: 1.05; }
.tile .v small { font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-left: 4px; }
.tile .f { margin-top: 10px; display: flex; align-items: center; gap: 8px; min-height: 20px; }
.tile .f .t { color: var(--faint); font-size: 11.5px; }
.meter { margin-top: 12px; height: 4px; border-radius: 4px; background: var(--sel); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--w1); border-radius: 4px;
           transform-origin: left; animation: grow .7s cubic-bezier(.2,.7,.2,1) both; }
@keyframes grow { from { transform: scaleX(0); } }

/* ── the funnel ─────────────────────────────────────────────────────── */
.funnel { position: relative; margin-top: 18px; height: 250px; }
.funnel svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.funnel .tops, .funnel .pcts, .funnel .names { position: absolute; left: 0; right: 0; display: grid; }
.funnel .tops  { top: 0; }
.funnel .tops div { text-align: center; font-size: 13.5px; font-weight: 600; }
.funnel .pcts  { top: calc(50% + 6px); transform: translateY(-50%); }
.funnel .pcts span { justify-self: start; transform: translateX(-4px); }
.funnel .names { bottom: 0; color: var(--faint); font-size: 11.5px; }
.funnel .names div { text-align: center; }
.funnel .rule { position: absolute; top: 26px; bottom: 22px; width: 1px; background: var(--line); }

/* ── the ring and its key ───────────────────────────────────────────── */
.ringrow { margin-top: 18px; display: flex; gap: 30px; align-items: center; }
.ringrow svg.ring { width: 190px; height: 190px; flex: 0 0 auto; overflow: visible; }
.key { flex: 1; min-width: 0; display: grid; gap: 12px; }
.key .k { display: grid; grid-template-columns: 14px minmax(0,1fr) auto auto; gap: 12px; align-items: center; font-size: 12.5px; }
.key .k .n { color: var(--body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.key .k .p { color: var(--muted); }
.key .k .v { color: var(--ink); min-width: 58px; text-align: right; }
.sw { width: 14px; height: 14px; border-radius: 3px; overflow: hidden; }
.sw svg { width: 14px; height: 14px; }

/* dashes: a share, counted */
.dash { display: flex; gap: 3px; margin-top: 7px; }
.dash i { height: 3px; flex: 1; border-radius: 2px; background: var(--sel-2); }
.dash i.on { background: var(--w1); }

/* rows with a figure and dashes under them */
.list { margin-top: 16px; display: grid; gap: 14px; }
.list .l { display: flex; align-items: baseline; gap: 8px; font-size: 12.5px; }
.list .l b { font-weight: 400; color: var(--body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list .l .pill { transform: translateY(-1px); }
.list .l span.v { margin-left: auto; color: var(--ink); white-space: nowrap; }

/* ── nothing is deleted ─────────────────────────────────────────────── */
.promise { margin-top: 18px; text-align: center; }
.promise .marks { display: flex; justify-content: center; margin-bottom: 14px; }
.promise .marks span { width: 36px; height: 36px; border-radius: 50%; background: var(--sel);
    border: 2px solid var(--bg); display: grid; place-items: center; margin-left: -9px; color: var(--muted); }
.promise .marks span:first-child { margin-left: 0; }
.promise .marks .ic { width: 16px; height: 16px; }
.promise h4 { font-size: 14px; font-weight: 500; }
.promise p { color: var(--muted); font-size: 12.5px; margin: 6px auto 0; max-width: 26ch; text-wrap: balance; }
.promise .btn { margin-top: 14px; }

/* ── last changed ───────────────────────────────────────────────────── */
.pair { display: flex; gap: 28px; margin-top: 14px; }
.pair .n { font-size: 21px; font-weight: 600; letter-spacing: -.015em; line-height: 1.15; }
.pair .c { color: var(--faint); font-size: 11.5px; margin-top: 3px; }
.heat { margin-top: 18px; }
.heat .row { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; }
.heat .row i { height: 26px; border-radius: 4px; background: var(--sel); }
.heat .ax { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; margin-top: 7px;
            color: var(--faint); font-size: 10.5px; }
.heat .ax span { text-align: center; }
.scale { display: flex; align-items: center; gap: 5px; color: var(--faint); font-size: 10.5px; margin-top: 12px; }
.scale i { width: 11px; height: 11px; border-radius: 3px; }

/* ── a thing to do ──────────────────────────────────────────────────── */
.todo { margin-top: 12px; display: grid; gap: 2px; }
.todo .t {
    display: grid; grid-template-columns: 32px minmax(0,1fr) auto; gap: 12px; align-items: center;
    padding: 10px 10px; margin: 0 -10px; border-radius: 10px;
    transition: background .14s ease;
}
.todo .t:hover { background: var(--hover); }
.todo .t .ico { width: 32px; height: 32px; border-radius: 9px; background: var(--sel);
                display: grid; place-items: center; color: var(--muted); }
.todo .t .ico .ic { width: 15px; height: 15px; }
.todo .t .nm { font-size: 13px; color: var(--ink); display: flex; align-items: center; gap: 8px; min-width: 0; }
.todo .t .nm span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.todo .t .cm { font-family: var(--mono); font-size: 11px; color: var(--faint); margin-top: 2px; }
.todo .t .go { display: flex; align-items: center; gap: 10px; }
.todo .t .fig { color: var(--muted); font-size: 12px; white-space: nowrap; }
.todo .t.done .nm span { color: var(--faint); text-decoration: line-through; text-decoration-color: var(--ghost); }
.todo .t.done .ico { color: var(--faint); }
.todo .empty { padding: 14px 0 4px; color: var(--muted); }

/* ── a breakdown: bars, then the table they came from ───────────────── */
.bars { margin-top: 18px; height: 150px; display: flex; align-items: flex-end; gap: 6px; }
.bars .b { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: stretch; gap: 7px; height: 100%; justify-content: flex-end; }
.bars .b .col { border-radius: 5px 5px 2px 2px; min-height: 3px; transform-origin: bottom;
                animation: rise .6s cubic-bezier(.2,.7,.2,1) both; overflow: hidden; }
.bars .b .col svg { width: 100%; height: 100%; }
.bars .b .lb { font-size: 10.5px; color: var(--faint); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@keyframes rise { from { transform: scaleY(0); } }

.table { margin-top: 18px; }
.table .th, .table .tr {
    display: grid; grid-template-columns: 16px minmax(0,1.6fr) minmax(90px,1fr) 52px 88px 16px;
    gap: 12px; align-items: center; padding: 0 10px; margin: 0 -10px;
}
.table .th { color: var(--faint); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding-bottom: 9px; border-bottom: 1px solid var(--line); }
.table .th .num, .table .tr .num { text-align: right; }
.table .tr { min-height: 40px; border-radius: 9px; font-size: 13px; transition: background .14s ease; }
.table .tr + .tr { box-shadow: inset 0 1px 0 var(--line); }
.table .tr.can:hover { background: var(--hover); box-shadow: none; }
.table .tr.can:hover + .tr { box-shadow: none; }
.table .tr .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--body); }
.table .tr.can .nm { color: var(--ink); }
.table .tr .share { height: 4px; border-radius: 4px; background: var(--sel); overflow: hidden; }
.table .tr .share i { display: block; height: 100%; border-radius: 4px; background: var(--w1); transform-origin: left; animation: grow .7s cubic-bezier(.2,.7,.2,1) both; }
.table .tr .pc { color: var(--muted); font-size: 12px; }
.table .tr .sz { color: var(--ink); }
.table .tr .chev { color: var(--faint); opacity: 0; transition: opacity .14s ease; }
.table .tr.can:hover .chev { opacity: 1; }
.table .tr .chev .ic { width: 14px; height: 14px; }
.table .total { display: flex; justify-content: space-between; padding: 12px 0 0; margin-top: 4px;
                border-top: 1px solid var(--line); font-size: 13px; }
.table .total b { font-weight: 500; }
.table .total span { color: var(--muted); }

/* plain rows: a fact and its value */
.facts { margin-top: 14px; display: grid; }
.fact { display: grid; grid-template-columns: minmax(120px, 34%) minmax(0,1fr) auto; gap: 14px; align-items: center;
        min-height: 40px; padding: 0 10px; margin: 0 -10px; border-radius: 9px; font-size: 13px; }
.fact + .fact { box-shadow: inset 0 1px 0 var(--line); }
.fact .k { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fact .v { color: var(--ink); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fact .v.strong { font-weight: 600; }
.fact .n { color: var(--faint); font-size: 12px; white-space: nowrap; }
.fact.can:hover { background: var(--hover); box-shadow: none; }
.fact.can:hover + .fact { box-shadow: none; }
.fact .meter { margin: 0; width: 140px; }
.fact.total { font-weight: 500; }
.fact.total .k { color: var(--ink); }

/* what nimo said, as sentences */
.said { margin-top: 12px; display: grid; gap: 8px; }
.said .s { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: var(--body); }
.said .s .ic { width: 15px; height: 15px; margin-top: 2px; color: var(--muted); }
.said .s.good { color: var(--ink); font-weight: 500; }
.said .s.good .ic { color: var(--good); }
.said .s.warn .ic { color: var(--bad); }
.said .s.quiet { color: var(--faint); font-size: 12px; }
.said code, .notes code { font-family: var(--mono); font-size: 11.5px; color: var(--body);
    background: var(--sel); border-radius: 5px; padding: 1px 6px; }

.notes { margin-top: 16px; display: grid; gap: 5px; color: var(--faint); font-size: 12px; }

/* the banner after something has been done */
.done {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px; border-radius: 12px; margin-bottom: 14px;
    background: var(--raise); border: 1px solid var(--line);
    animation: drop .45s cubic-bezier(.2,.7,.2,1) both;
}
.done .tick { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
              background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good); flex: 0 0 auto; }
.done .tick .ic { width: 16px; height: 16px; stroke-width: 2; }
.done .w { min-width: 0; flex: 1; }
.done .w b { font-weight: 500; font-size: 13.5px; display: block; }
.done .w span { color: var(--muted); font-size: 12.5px; }
.done > .btn { flex: 0 0 auto; }
.done.plain .tick { background: var(--sel); color: var(--muted); }
@keyframes drop { from { opacity: 0; transform: translateY(-6px); } }

/* startup rows with their own switch */
.stops { margin-top: 14px; display: grid; }
.stop { display: grid; grid-template-columns: 32px minmax(0,1fr) auto; gap: 12px; align-items: center;
        min-height: 52px; padding: 0 10px; margin: 0 -10px; border-radius: 10px; }
.stop + .stop { box-shadow: inset 0 1px 0 var(--line); }
.stop:hover { background: var(--hover); box-shadow: none; }
.stop:hover + .stop { box-shadow: none; }
.stop .ico { width: 32px; height: 32px; border-radius: 9px; background: var(--sel); display: grid; place-items: center; color: var(--muted); }
.stop .nm { font-size: 13px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stop .kd { font-size: 12px; color: var(--faint); margin-top: 1px; }

/* the undo list */
.log { margin-top: 14px; display: grid; }
.log .e { display: grid; grid-template-columns: 26px minmax(0,1fr) auto auto; gap: 14px; align-items: center;
          min-height: 48px; padding: 0 2px; font-size: 13px; }
.log .e + .e { box-shadow: inset 0 1px 0 var(--line); }
.log .e .no { width: 24px; height: 24px; border-radius: 7px; background: var(--sel); color: var(--muted);
              display: grid; place-items: center; font-size: 11.5px; font-weight: 500; }
.log .e .what { color: var(--ink); }
.log .e .when { color: var(--faint); font-size: 12px; }
.log .e .many { color: var(--muted); font-size: 12px; min-width: 64px; text-align: right; }

/* wallpapers */
.walls { margin-top: 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.wall { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 6px; }
.wall .no { color: var(--faint); font-size: 11px; }
.wall .nm { font-size: 13px; }
.wall.pick { border-color: var(--line-2); background: var(--raise); }

/* ── waiting ────────────────────────────────────────────────────────── */
.wait { display: grid; place-items: center; padding: 70px 0 30px; text-align: center; }
.wait .mascot { width: 72px; height: 72px; }
.wait .mascot .body { fill: var(--ink); }
.wait .mascot .eye { fill: var(--bg); }
.wait .mascot g.eyes { transform-origin: 50px 38px; animation: look 2.8s ease-in-out infinite; }
.wait .mascot g.whole { transform-origin: 50px 90px; animation: bob 1.6s ease-in-out infinite; }
@keyframes look { 0%, 100% { transform: translateX(0) } 30% { transform: translateX(-3px) } 60% { transform: translateX(3px) } 82% { transform: translateX(0) scaleY(.1) } 86% { transform: translateX(0) scaleY(1) } }
@keyframes bob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-4px) } }
.wait h3 { margin-top: 16px; font-size: 14px; font-weight: 500; }
.wait p { margin-top: 5px; color: var(--faint); font-size: 12.5px; }
.ghost { margin-top: 26px; width: min(720px, 100%); display: grid; gap: 10px; }
.ghost i { height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--sel) 0%, var(--sel-2) 50%, var(--sel) 100%);
           background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
.ghost i:nth-child(2) { width: 82%; } .ghost i:nth-child(3) { width: 64%; }
@keyframes shimmer { from { background-position: 200% 0 } to { background-position: -200% 0 } }

/* ── settings ───────────────────────────────────────────────────────── */
.set { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 16px; align-items: center;
       min-height: 58px; padding: 10px 0; }
.set + .set { box-shadow: inset 0 1px 0 var(--line); }
.set .t { font-size: 13px; color: var(--ink); }
.set .d { font-size: 12px; color: var(--faint); margin-top: 2px; max-width: 60ch; }
.set .state { display: inline-flex; align-items: center; gap: 6px; }
.set .state i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.set .state.yes i { background: var(--good); }

.switch { width: 36px; height: 22px; border-radius: 999px; background: var(--sel-2); position: relative;
          transition: background .18s ease; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%;
                 background: var(--bg); box-shadow: 0 1px 2px rgba(0,0,0,.4); transition: transform .18s cubic-bezier(.2,.7,.2,1); }
.switch.on { background: var(--on); }
.switch.on::after { transform: translateX(14px); background: var(--on-ink); }
.switch[disabled] { opacity: .4; pointer-events: none; }

.seg { display: inline-flex; padding: 2px; border-radius: 9px; background: var(--well); border: 1px solid var(--line); }
.seg button { height: 26px; padding: 0 11px; border-radius: 7px; color: var(--muted); font-size: 12.5px; }
.seg button:hover { color: var(--body); }
.seg button.on { background: var(--sel-2); color: var(--ink); }

.field { height: 36px; border-radius: 9px; border: 1px solid var(--line); background: var(--well);
         padding: 0 12px; font-size: 14px; color: var(--ink); width: 100%;
         -webkit-user-select: text; user-select: text; cursor: text; }
.field:focus { border-color: var(--line-2); }
.field::placeholder { color: var(--faint); }

/* ── help ───────────────────────────────────────────────────────────── */
.keys { display: grid; }
.keys .kr { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 16px; align-items: center; min-height: 40px; font-size: 13px; }
.keys .kr + .kr { box-shadow: inset 0 1px 0 var(--line); }
.keys .kr span { color: var(--body); }
.keys kbd { font: inherit; font-size: 12px; color: var(--muted); border: 1px solid var(--line); background: var(--well);
            border-radius: 6px; padding: 1px 7px; }

/* ── the first minute ───────────────────────────────────────────────── */
.welcome { min-height: 100%; display: grid; grid-template-columns: 300px minmax(0,1fr); }
.welcome .side { border-right: 1px solid var(--line); padding: 64px 32px 32px; display: flex; flex-direction: column; gap: 18px; }
.welcome .side .mascot { width: 64px; height: 64px; }
.welcome .side .mascot .body { fill: var(--ink); }
.welcome .side .mascot .eye { fill: var(--bg); }
.welcome .side p { color: var(--muted); font-size: 12.5px; max-width: 30ch; }
.welcome .steps { display: grid; gap: 6px; margin-top: 8px; }
.welcome .steps div { display: flex; align-items: center; gap: 10px; color: var(--faint); font-size: 12.5px; }
.welcome .steps div i { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line-2); display: grid; place-items: center; font-style: normal; font-size: 10.5px; }
.welcome .steps div.on { color: var(--ink); }
.welcome .steps div.on i { background: var(--on); color: var(--on-ink); border-color: var(--on); }
.welcome .steps div.past i { background: var(--sel-2); color: var(--muted); border-color: var(--sel-2); }
.welcome .pane { padding: 64px 56px 28px; display: flex; flex-direction: column; max-width: 760px; }
.welcome h2 { font-size: 28px; font-weight: 600; letter-spacing: -.025em; line-height: 1.15; text-wrap: balance; }
.welcome .lead { margin-top: 10px; color: var(--muted); font-size: 14px; max-width: 54ch; text-wrap: pretty; }
.welcome .body { margin-top: 28px; display: grid; gap: 14px; }
.welcome .note { color: var(--faint); font-size: 12px; margin-top: 6px; }
.welcome .way { margin-top: auto; padding-top: 32px; display: flex; gap: 10px; align-items: center; }
.welcome .way .gap { flex: 1; }
.choice { display: grid; grid-template-columns: 22px minmax(0,1fr); gap: 12px; align-items: flex-start;
          padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--well);
          transition: border-color .14s ease, background .14s ease; }
.choice:hover { border-color: var(--line-2); }
.choice.on { border-color: var(--ink); background: var(--raise); }
.choice .dot { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line-2); margin-top: 1px; position: relative; }
.choice.on .dot { border-color: var(--ink); }
.choice.on .dot::after { content: ""; position: absolute; inset: 3.5px; border-radius: 50%; background: var(--ink); }
.choice b { font-weight: 500; font-size: 13.5px; display: block; }
.choice span { color: var(--muted); font-size: 12.5px; }
.gate { display: grid; grid-template-columns: 32px minmax(0,1fr) auto; gap: 12px; align-items: center; min-height: 52px; }
.gate + .gate { box-shadow: inset 0 1px 0 var(--line); }
.gate .ico { width: 32px; height: 32px; border-radius: 9px; background: var(--sel); display: grid; place-items: center; color: var(--muted); }
.gate .st { font-size: 12px; color: var(--faint); display: flex; align-items: center; gap: 6px; }
.gate .st.yes { color: var(--good); }
.gate .st.no { color: var(--muted); }
.gate .st.now { color: var(--ink); }

/* ── the little popover for what Kliner has done ────────────────────── */
.pop { position: fixed; z-index: 50; top: 48px; right: 14px; width: 340px;
       background: var(--raise); border: 1px solid var(--line-2); border-radius: 12px;
       box-shadow: var(--shadow); padding: 8px; animation: drop .18s ease both; }
.pop .ph { padding: 8px 10px 6px; color: var(--faint); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
.pop .pr { display: grid; grid-template-columns: 18px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; font-size: 12.5px; }
.pop .pr:hover { background: var(--hover); }
.pop .pr .ic { width: 14px; height: 14px; color: var(--muted); }
.pop .pr .ic.good { color: var(--good); }
.pop .pr span { color: var(--faint); font-size: 11.5px; white-space: nowrap; }
.pop .none { padding: 16px 10px; color: var(--faint); font-size: 12.5px; }

/* ── a toast at the bottom ──────────────────────────────────────────── */
.toast { position: fixed; z-index: 70; left: 50%; bottom: 22px; transform: translateX(-50%);
         display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 14px;
         background: var(--raise); border: 1px solid var(--line-2); border-radius: 12px;
         box-shadow: var(--shadow); font-size: 13px; white-space: nowrap;
         animation: up .3s cubic-bezier(.2,.7,.2,1) both; }
.toast .ic { width: 15px; height: 15px; color: var(--good); stroke-width: 2; }
.toast .btn { height: 26px; font-size: 12px; }
@keyframes up { from { opacity: 0; transform: translate(-50%, 8px); } }

/* pages arrive, they are not swapped */
.arrive > * { animation: in .38s cubic-bezier(.2,.7,.2,1) both; }
.arrive > *:nth-child(2) { animation-delay: .04s; }
.arrive > *:nth-child(3) { animation-delay: .08s; }
.arrive > *:nth-child(4) { animation-delay: .12s; }
.arrive > *:nth-child(n+5) { animation-delay: .16s; }
@keyframes in { from { opacity: 0; transform: translateY(6px); } }

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* narrower windows: the four cards go two by two, the two go one by one */
@media (max-width: 1180px) {
    .grid.four { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid.two { grid-template-columns: 1fr; }
}
@media (max-width: 980px) {
    .ringrow svg.ring { width: 160px; height: 160px; }
    .welcome { grid-template-columns: 1fr; }
    .welcome .side { display: none; }
}
@media (max-width: 860px) {
    .find span, .age { display: none; }
    .find { min-width: 0; }
    .table .th, .table .tr { grid-template-columns: 16px minmax(0,1.6fr) 0 52px 80px 16px; }
    .table .tr .share { display: none; }
}

/* the button that is working */
.btn.fill.working { position: relative; color: transparent !important; opacity: 1 !important; }
.btn.fill.working .ic { opacity: 0; }
.btn.fill.working::after { content: ""; position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px;
    border-radius: 50%; border: 2px solid var(--on-ink); border-right-color: transparent; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/** An element. Strings become text — never markup — so nothing nimo prints
 *  (a file name, a folder name) can ever be read as HTML. */
function h(tag, attrs, ...kids) {
    const node = document.createElement(tag);
    if (attrs) {
        for (const [key, value] of Object.entries(attrs)) {
            if (value == null || value === false) continue;
            if (key === 'class') node.className = value;
            else if (key === 'style') node.style.cssText = value;
            else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
            else node.setAttribute(key, value === true ? '' : value);
        }
    }
    for (const kid of kids.flat(Infinity)) {
        if (kid == null || kid === false) continue;
        node.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    }
    return node;
}

function s(tag, attrs, ...kids) {
    const node = document.createElementNS(SVGNS, tag);
    if (attrs) for (const [key, value] of Object.entries(attrs)) {
        if (value == null) continue;
        node.setAttribute(key, value);
    }
    for (const kid of kids.flat(Infinity)) if (kid) node.append(kid);
    return node;
}

    code:    ['m16 18 6-6-6-6', 'm8 6-6 6 6 6'],
    cube:    ['M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.7z', 'M3.3 7 12 12l8.7-5', 'M12 22V12'],
    dot:     ['M12 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2z'],
    list:    ['M8 6h13', 'M8 12h13', 'M8 18h13', 'M3 6h.01', 'M3 12h.01', 'M3 18h.01'],
    moon:    ['M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z'],
};

/* what macOS calls a picture, and what it is here */
const SYMBOLS = {
    'house': 'home', 'square.grid.2x2': 'grid', 'arrow.down.circle': 'download',
    'photo': 'photo', 'power': 'power', 'chart.bar': 'bars', 'sparkles': 'sparkles',
    'waveform.path.ecg': 'pulse', 'arrow.uturn.backward': 'undo', 'gearshape': 'gear',
    'questionmark.circle': 'help', 'display': 'desk', 'internaldrive': 'disk',
    'cpu': 'cpu', 'tray.and.arrow.down': 'tray', 'chevron.right': 'right',
    'chevron.left': 'left', 'eye': 'eye', 'arrow.clockwise': 'refresh', 'play': 'play',
    'menubar.dock.rectangle': 'desk', 'doc.text': 'file', 'bell': 'bell',
    'camera.viewfinder': 'camera', 'doc.on.doc': 'file',
};

function icon(name, cls) {
    const key = SYMBOLS[name] || name;
    const paths = PATHS[key] || PATHS.dot;
    return s('svg', { class: 'ic' + (cls ? ' ' + cls : ''), viewBox: '0 0 24 24', 'aria-hidden': 'true' },
             paths.map(d => s('path', { d })));
}

/* ── the face ─────────────────────────────────────────────────────────── */

function mascot(cls) {
    const svg = s('svg', { class: cls || '', viewBox: '0 0 100 100', 'aria-hidden': 'true' });
    const whole = s('g', { class: 'whole' });
    whole.append(s('path', { class: 'body', d: MASCOT.body }));
    const eyes = s('g', { class: 'eyes' });
    eyes.append(s('path', { class: 'eye', d: MASCOT.left }), s('path', { class: 'eye', d: MASCOT.right }));
    whole.append(eyes);
    svg.append(whole);
    return svg;
}

/* ── numbers, the way nimo writes them ────────────────────────────────── */

/** "2.1 GB" → bytes. A bare number reads as bytes, the way nimo's own does. */
function bytes(text) {
    const m = /^\s*(-?[\d.]+)\s*([KMGT]?B)?\s*$/i.exec(String(text || ''));
    if (!m) return null;
    const value = parseFloat(m[1]);
    if (!isFinite(value)) return null;
    const unit = (m[2] || 'B').toUpperCase();
    const scale = { B: 1, KB: 1e3, MB: 1e6, GB: 1e9, TB: 1e12 }[unit] || 1;
    return value * scale;
}

/** Whether a figure carries a unit. `142` is a hundred and forty-two things. */
function hasUnit(text) {
    return /^\s*[\d.,]+\s*([KMGT]?B)\s*$/i.test(String(text || ''));
}

/** And back again, the way nimo would have said it. */
function size(value) {
    const units = [[1e12, 'TB'], [1e9, 'GB'], [1e6, 'MB'], [1e3, 'KB']];
    for (const [scale, name] of units) {
        if (value >= scale) {
            const n = value / scale;
            // one decimal under a hundred, the way nimo prints them
            return (n >= 100 ? Math.round(n).toString() : n.toFixed(1)) + ' ' + name;
        }
    }
    return Math.round(value) + ' B';
}

/** Split "29.5 GB" into the figure and its unit, so the unit can be small. */
function figure(text) {
    const m = /^\s*([\d.,]+)\s*(.*)$/.exec(String(text || ''));
    return m ? [m[1], m[2]] : [String(text || ''), ''];
}

/** The first whole number in a phrase: "34 items" → 34. */
function count(text) {
    const m = /(\d[\d,]*)/.exec(String(text || ''));
    return m ? parseInt(m[1].replace(/,/g, ''), 10) : 0;
}

function whole(n) {
    return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
}

function percent(part, of) {
    if (!(of > 0)) return '0%';
    const p = part / of * 100;
    if (p > 0 && p < 0.1) return '<0.1%';
    if (p < 10) return p.toFixed(1).replace(/\.0$/, '') + '%';
    return Math.round(p) + '%';
}

function plural(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }

/* ── reading nimo back ────────────────────────────────────────────────── */

/* nimo draws a panel for a terminal: box corners, a heading, columns held
   apart by two or more spaces. This reads it back into what it meant —
   headings, rows, a total, sentences — the same way the Swift window always
   did, so the two can never disagree about what nimo said. */
const BOX = new Set('─╭╮╰╯│');
const ANSI = /\x1b\[[0-9;]*m/g;

function parse(raw) {
    const out = [];
    for (const line of String(raw || '').split('\n')) {
        const strong = line.includes('\x1b[1m');
        const bare = line.replace(ANSI, '');
        const t = bare.trim();
        if (!t) continue;
        if (t.startsWith('◍')) continue;              // the wordmark; the window has a title
        if (t.startsWith('╰')) continue;              // the bottom of a panel is a shape

        if (t.startsWith('╭')) {
            const title = t.replace(/^[─╭╮╰╯│\s]+/, '').replace(/[─╭╮╰╯│\s]+$/, '');
            if (title) out.push({ k: 'heading', text: title });
            continue;
        }
        if ([...t].every(c => BOX.has(c))) { out.push({ k: 'rule' }); continue; }
        if (t.startsWith('✓')) { out.push({ k: 'good', text: t.slice(1).trim() }); continue; }
        if (t.startsWith('✗') || t.startsWith('!')) { out.push({ k: 'warn', text: t.slice(1).trim() }); continue; }

        const indent = bare.length - bare.replace(/^ +/, '').length;
        const parts = t.split(/ {2,}/).filter(Boolean);
        const last = parts[parts.length - 1] || '';
        const isBar = parts.length > 1 && /^[█·]+$/.test(last);

        // A numbered line — the undo log, the wallpapers — is an entry, not
        // a label and a value. The Swift reader filed these as notes and
        // dropped them, which is why "Put it all back" never listed anything.
        if (!isBar && parts.length >= 2 && /^\d{1,3}$/.test(parts[0])) {
            out.push({ k: 'item', no: parseInt(parts[0], 10), parts: parts.slice(1), strong });
            continue;
        }

        if (indent >= 4 && parts.length >= 2) {
            const label = parts.shift();
            let bar = null;
            if (isBar) {
                const cells = [...parts.pop()];
                bar = cells.filter(c => c === '█').length / cells.length;
            }
            out.push({ k: 'row', label, value: parts[0] || '', note: parts.slice(1).join('  '), bar, strong });
            continue;
        }
        out.push(indent <= 3 ? { k: 'note', text: t } : { k: 'text', text: t });
    }
    return out;
}

/** The rows of a reading, by label, for pages that read figures off it. */
function facts(pieces) {
    const map = {};
    for (const p of pieces) if (p.k === 'row' && !(p.label in map)) map[p.label] = p;
    return map;
}

/** A reading, cut at its headings: one section per panel nimo drew. */
function sections(pieces) {
    const out = [];
    let cur = { title: '', pieces: [] };
    for (const p of pieces) {
        if (p.k === 'heading') {
            if (cur.title || cur.pieces.length) out.push(cur);
            cur = { title: p.text, pieces: [] };
        } else cur.pieces.push(p);
    }
    if (cur.title || cur.pieces.length) out.push(cur);
    return out;
}

/** Words with nimo's commands in them, the commands set as code. Only
 *  nimo's own verbs count, so "8 min" stays a duration. */
const COMMAND = /(\bmin (?:desktop|downloads|screenshots|clean|preview|top|doctor|undo|startup|wallpaper|next|prev|tidy|clear|empty|duplicates|apps|setup|update|dock|hide|zen|dark|light|blank|menu|help)(?: (?:--?[a-z][a-z-]*|desktop|downloads|all|<[a-z]+>))*)/;
function prose(text) {
    const frag = document.createDocumentFragment();
    const bits = String(text).split(COMMAND);
    for (const bit of bits) {
        if (/^min /.test(bit)) frag.append(h('code', null, bit));
        else if (bit) frag.append(document.createTextNode(bit));
    }
    return frag;
}

/* ── Kliner's window ─────────────────────────────────────────────────────

   This page is the window. It draws; it never decides what runs. Every
   request it makes names a page by number, and the Swift side looks the
   command up in its own list, asks you with a real macOS dialog before
   anything changes, and only then runs nimo. There is no way from here to
   hand nimo an argument, open a URL, or reach the network.              */

/* ── talking to the app ───────────────────────────────────────────────── */

const native = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.kliner;
let serial = 0;
const owed = new Map();

/** Ask the app for something and wait for its answer. */
function ask(op, args) {
    return new Promise(resolve => {
        if (!native) { resolve({ ok: false, text: '', missing: true }); return; }
        const id = ++serial;
        owed.set(id, resolve);
        native.postMessage(Object.assign({}, args || {}, { id, op }));
    });
}

/** Tell the app something that needs no answer. */
function tell(op, args) {
    if (native) native.postMessage(Object.assign({}, args || {}, { id: 0, op }));
}

/* ── what the window knows ────────────────────────────────────────────── */

const K = {
    meta: null,
    page: -1,
    behind: [],
    ahead: [],
    kept: {},           // page → what it last said
    walls: null,        // the wallpapers, read once
    busy: false,
    walked: [],         // how far into a folder you have clicked
    walkedFrom: -1,
    preview: false,
    wide: false,
    jobs: [],           // what Kliner has done since it opened
    unread: false,
    lastRead: 0,
    sighted: true,
    welcome: null,
    home: null,         // the figures Home read, for the rail and ⌘K
};

const $ = sel => document.querySelector(sel);
const pages = () => (K.meta ? K.meta.pages : []);
const SETTINGS = () => pages().length;
const HELP = () => pages().length + 1;
const isAction = i => i >= 0 && i < pages().length;
const kind = i => (isAction(i) ? pages()[i].kind : i === SETTINGS() ? 'settings' : 'help');

function titleOf(i) {
    if (isAction(i)) return pages()[i].title;
    return i === SETTINGS() ? 'Settings' : 'Help';
}
function placeOf(i) {
    return (K.meta.places || []).find(p => p.holds.includes(i)) || null;
}

/* ── the frame ────────────────────────────────────────────────────────── */

function drawFrame() {
    const app = $('#app');
    app.replaceChildren();
    app.className = 'app' + (K.wide ? ' wide' : '');

    // the rail: every place, then Settings and Help at the foot
    const places = h('div', { class: 'places' });
    for (const place of K.meta.places) {
        const first = place.holds[0];
        const spot = h('button', {
            class: 'spot', 'data-page': first, 'data-tip': place.title,
            onclick: () => show(first),
        }, icon(place.symbol), h('span', { class: 'label' }, place.title));
        places.append(spot);
        if (place.holds.length > 1) {
            const kids = h('div', { class: 'kids' });
            for (const i of place.holds) {
                kids.append(h('button', { class: 'kid', 'data-kid': i, onclick: () => show(i) }, titleOf(i)));
            }
            places.append(kids);
        }
    }
    const foot = h('div', { class: 'foot' },
        h('button', { class: 'spot', 'data-page': HELP(), 'data-tip': 'Help', onclick: () => show(HELP()) },
          icon('help'), h('span', { class: 'label' }, 'Help')),
        h('button', { class: 'spot', 'data-page': SETTINGS(), 'data-tip': 'Settings', 'data-keys': '⌘,',
                      onclick: () => show(SETTINGS()) },
          icon('gear'), h('span', { class: 'label' }, 'Settings')));
    const rail = h('nav', { class: 'rail' }, places, foot);

    // the bar along the top
    const bar = h('header', { class: 'bar' },
        h('div', { class: 'nav' },
            h('button', { class: 'sq', id: 'fold', 'data-hole': '', 'data-tip': 'Show names', 'data-keys': '⌘B', onclick: fold }, icon('sidebar')),
            h('button', { class: 'sq', id: 'back', 'data-hole': '', 'data-tip': 'Back', 'data-keys': '⌘[', onclick: back }, icon('left')),
            h('button', { class: 'sq', id: 'fwd', 'data-hole': '', 'data-tip': 'Forward', 'data-keys': '⌘]', onclick: forward }, icon('right'))),
        h('div', { class: 'where', id: 'where' }),
        h('div', { class: 'right' },
            h('span', { class: 'age', id: 'age' }),
            h('button', { class: 'mode', id: 'mode', 'data-hole': '', onclick: flipPreview,
                          'data-tip': 'Every button reads instead of changing' },
              icon('eye'), h('span', null, 'Only look')),
            h('button', { class: 'find', 'data-hole': '', onclick: () => tell('quick') },
              icon('search'), h('span', null, 'Search'), h('kbd', null, '⌘K')),
            h('button', { class: 'bell', id: 'bell', 'data-hole': '', 'data-tip': 'What Kliner has done', onclick: toggleActivity },
              icon('bell')),
            h('button', { class: 'face', 'data-hole': '', 'data-tip': 'Help', onclick: () => show(HELP()) }, mascot())));

    const scroll = h('div', { class: 'scroll', id: 'scroll' }, h('div', { class: 'page', id: 'page' }));
    app.append(rail, h('main', { class: 'main' }, bar, scroll));

    wireTips(app);
    setFrame();
    reportChrome();
}

/** Everything in the frame that depends on where you are. */
function setFrame() {
    const i = K.page;
    for (const spot of document.querySelectorAll('.spot')) {
        const n = parseInt(spot.dataset.page, 10);
        const place = placeOf(i);
        spot.classList.toggle('on', place ? place.holds[0] === n : n === i);
    }
    for (const kid of document.querySelectorAll('.kid')) {
        kid.classList.toggle('on', parseInt(kid.dataset.kid, 10) === i);
    }

    const where = $('#where');
    if (where) {
        where.replaceChildren();
        const place = placeOf(i);
        const symbol = place ? place.symbol : (i === SETTINGS() ? 'gear' : 'help');
        where.append(icon(symbol));
        if (i === 0) {
            where.append(h('span', { class: 'name' }, 'Overview'));
        } else if (place && place.holds.length > 1) {
            where.append(h('span', { class: 'group' }, place.title));
            const tabs = h('div', { class: 'tabs', 'data-hole': '' });
            for (const n of place.holds) {
                tabs.append(h('button', { class: 'tab' + (n === i ? ' on' : ''), onclick: () => show(n) }, titleOf(n)));
            }
            where.append(tabs);
        } else {
            where.append(h('span', { class: 'name' }, titleOf(i)));
        }
        const reveal = isAction(i) ? pages()[i].reveal : '';
        const trail = K.walked.length && K.walked[0] === reveal ? K.walked.slice(1) : K.walked;
        if (trail.length) {
            where.append(h('span', { class: 'slash' }, '/'),
                         h('span', { class: 'group' }, trail.join(' / ')));
        }
    }

    const backBtn = $('#back'), fwdBtn = $('#fwd');
    if (backBtn) backBtn.disabled = !K.behind.length && !K.walked.length;
    if (fwdBtn) fwdBtn.disabled = !K.ahead.length;
    const mode = $('#mode');
    if (mode) mode.classList.toggle('on', K.preview);
    const bell = $('#bell');
    if (bell) {
        const dot = bell.querySelector('.dot');
        if (K.unread && !dot) bell.append(h('span', { class: 'dot' }));
        if (!K.unread && dot) dot.remove();
    }
    tally();
    sayAge();
    reportChrome();
}

/** The count on a place: how many things are waiting there. */
function tally() {
    const f = K.home;
    for (const spot of document.querySelectorAll('.spot')) {
        spot.querySelector('.count')?.remove();
        if (!f) continue;
        const n = parseInt(spot.dataset.page, 10);
        const place = (K.meta.places || []).find(p => p.holds[0] === n);
        if (!place) continue;
        let many = 0;
        if (place.holds.includes(1)) many += f.desk || 0;
        if (place.holds.includes(2)) many += f.downloads || 0;
        if (many > 0) spot.append(h('span', { class: 'count' }, many > 999 ? '999+' : String(many)));
    }
}

function sayAge() {
    const age = $('#age');
    if (!age) return;
    if (!K.lastRead || !isAction(K.page)) { age.textContent = ''; return; }
    const gone = Math.round((Date.now() - K.lastRead) / 1000);
    age.textContent = gone < 5 ? 'read just now'
        : gone < 90 ? `read ${gone}s ago`
        : gone < 5400 ? `read ${Math.round(gone / 60)}m ago`
        : `read ${Math.round(gone / 3600)}h ago`;
}
setInterval(sayAge, 5000);

/** Where the window can be dragged by: the top 52 points, less anything
 *  in them you can press. The app does the dragging; this only says where. */
let chromeTimer = 0;
function reportChrome() {
    clearTimeout(chromeTimer);
    chromeTimer = setTimeout(() => {
        const holes = [];
        for (const el of document.querySelectorAll('[data-hole], .bar button, .welcome .way button')) {
            const r = el.getBoundingClientRect();
            if (r.width > 0 && r.height > 0 && r.top < 52) holes.push([r.left, r.top, r.width, r.height]);
        }
        tell('chrome', { height: 52, holes });
    }, 30);
}
window.addEventListener('resize', reportChrome);

/* ── tooltips, for a rail of pictures ─────────────────────────────────── */

let tipTimer = 0;
function wireTips(root) {
    for (const el of root.querySelectorAll('[data-tip]')) {
        el.addEventListener('mouseenter', () => {
            clearTimeout(tipTimer);
            tipTimer = setTimeout(() => showTip(el), el.closest('.rail') ? 250 : 600);
        });
        el.addEventListener('mouseleave', hideTip);
        el.addEventListener('mousedown', hideTip);
    }
}
function showTip(el) {
    if (el.closest('.rail') && K.wide) return;
    const tip = $('#tip');
    tip.replaceChildren(el.dataset.tip, el.dataset.keys ? h('kbd', null, el.dataset.keys) : null);
    const r = el.getBoundingClientRect();
    tip.classList.add('show');
    const w = tip.offsetWidth, th = tip.offsetHeight;
    if (el.closest('.rail')) {
        tip.style.left = (r.right + 10) + 'px';
        tip.style.top = (r.top + r.height / 2 - th / 2) + 'px';
    } else {
        tip.style.left = Math.min(window.innerWidth - w - 8, Math.max(8, r.left + r.width / 2 - w / 2)) + 'px';
        tip.style.top = (r.bottom + 8) + 'px';
    }
}
function hideTip() { clearTimeout(tipTimer); $('#tip').classList.remove('show'); }

/* ── going places ─────────────────────────────────────────────────────── */

function show(i, opts) {
    const remember = !opts || opts.remember !== false;
    if (!K.meta || K.welcome) return;
    if (i < 0 || i > HELP()) return;
    closeActivity();
    hideTip();
    if (remember && i !== K.page && K.page >= 0) { K.behind.push(K.page); K.ahead = []; }
    const same = i === K.page;
    K.page = i;
    K.walked = [];
    setFrame();
    if (!same) $('#scroll').scrollTop = 0;
    if (!isAction(i)) { drawPage(); return; }
    const kept = K.kept[i];
    if (kept) {
        drawPage();
        if (i === 0 && kept.fast) setTimeout(() => look(0, true), 60);
        return;
    }
    look(i);
}

function back() {
    if (K.walked.length) { walkUp(); return; }
    if (!K.behind.length) return;
    K.ahead.push(K.page);
    show(K.behind.pop(), { remember: false });
}
function forward() {
    if (!K.ahead.length) return;
    K.behind.push(K.page);
    show(K.ahead.pop(), { remember: false });
}
function fold() {
    K.wide = !K.wide;
    tell('setConfig', { key: 'rail', value: K.wide ? 'list' : 'icons' });
    drawFrame();
    drawPage(true);
}
function flipPreview() {
    K.preview = !K.preview;
    tell('setConfig', { key: 'preview', value: K.preview ? 'on' : 'off' });
    setFrame();
    drawPage(true);
}

/* ── reading and doing ────────────────────────────────────────────────── */

async function look(i, quietly) {
    if (K.busy && !quietly) { K.owedLook = i; drawWaiting(i); return; }
    if (K.busy) return;
    const fast = i === 0 && !K.kept[0];
    K.busy = true;
    if (!quietly) drawWaiting(i);
    let reply;
    try {
        reply = await ask('look', { page: i, fast });
    } finally {
        K.busy = false;
    }
    if (reply.missing) reply = { ok: false, text: '! The window could not reach Kliner.' };

    if (reply.ready) {
        K.kept[i] = { ready: true, at: Date.now() };
    } else {
        K.kept[i] = { pieces: parse(reply.text), ok: reply.ok, at: Date.now(), fast };
    }
    if (typeof reply.sighted === 'boolean') K.sighted = reply.sighted;
    if (i === 0 || kind(i) === 'doctor') readHome(K.kept[i].pieces || []);
    K.lastRead = Date.now();

    // a page opened while this one was running is owed its own reading
    if (K.owedLook != null && K.owedLook !== i) {
        const owedPage = K.owedLook;
        K.owedLook = null;
        if (owedPage === K.page) { look(owedPage); return; }
    }
    K.owedLook = null;
    if (i === K.page) drawPage(quietly);

    // Home in two halves: the instant readings first, then the one that
    // walks every cache on the disk
    if (fast && i === 0) setTimeout(() => look(0, true), 60);

    // the wallpapers come from their own, harmless reading
    if (kind(i) === 'next' && !K.walls) readWalls();
}

async function readWalls() {
    const reply = await ask('walls');
    if (reply && reply.text) {
        K.walls = parse(reply.text).filter(p => p.k === 'item');
        if (kind(K.page) === 'next') drawPage(true);
    }
}

/** The big button on a page. The app asks first; this only waits. */
async function act(i) {
    if (K.busy || !isAction(i)) return;
    K.busy = true;
    busyButtons(true);
    let reply;
    try {
        reply = await ask('go', { page: i, preview: K.preview });
    } finally {
        K.busy = false;
    }
    busyButtons(false);
    if (reply.cancelled || reply.missing) return;
    afterRun(i, reply, pages()[i].verb);
}

async function extra(i, n) {
    if (K.busy || !isAction(i)) return;
    const ex = pages()[i].extras[n];
    if (!ex) return;
    K.busy = true;
    busyButtons(true);
    let reply;
    try {
        reply = await ask('extra', { page: i, index: n, preview: K.preview });
    } finally {
        K.busy = false;
    }
    busyButtons(false);
    if (reply.cancelled || reply.missing) return;
    afterRun(i, reply, ex.title);
}

/** Desktop and Downloads behind one question. */
async function tidyBoth(which) {
    if (K.busy) return;
    K.busy = true;
    busyButtons(true);
    let reply;
    try {
        reply = await ask('tidy', { pages: which, preview: K.preview });
    } finally {
        K.busy = false;
    }
    busyButtons(false);
    if (reply.cancelled || reply.missing || !reply.results) return;
    for (const one of reply.results) afterRun(one.page, one, pages()[one.page].verb, true);
    const said = reply.results.map(one => (parse(one.text).find(p => p.k === 'good') || {}).text).filter(Boolean);
    delete K.kept[0];
    show(0);
    if (said.length) toast(said.join(' · '), null);
}

function afterRun(i, reply, what, quiet) {
    const pieces = parse(reply.text);
    const good = pieces.find(p => p.k === 'good');
    const warn = pieces.find(p => p.k === 'warn');
    K.kept[i] = { pieces, ok: reply.ok, at: Date.now(), result: true, changed: !!reply.changed, preview: !!reply.preview };
    K.lastRead = Date.now();
    if (reply.changed) {
        // what changed changes the readings of Home and the log of what was done
        for (const n of Object.keys(K.kept)) {
            if (+n !== i) delete K.kept[n];
        }
        if (kind(i) === 'next' && K.walls) readWalls();
    }
    const line = good ? good.text : warn ? warn.text : (reply.ok ? 'Done' : 'Kliner could not finish that');
    K.jobs.unshift({ page: i, title: titleOf(i), line, good: !!good && reply.ok, at: new Date(), preview: !!reply.preview });
    K.jobs = K.jobs.slice(0, 30);
    if (reply.changed) K.unread = true;
    setFrame();
    if (!quiet && i === K.page) drawPage();
    // somewhere else, say so; here, the banner says it
    if (!quiet && reply.changed && good && i !== K.page) toast(good.text, null);
}

async function walk(path) {
    if (K.busy) return;
    K.walked = path;
    K.walkedFrom = K.page;
    setFrame();
    K.busy = true;
    drawWaiting(K.page, path[path.length - 1]);
    let reply;
    try {
        reply = await ask('walk', { path });
    } finally {
        K.busy = false;
    }
    if (reply.missing || K.walked !== path) return;
    K.walkedPieces = parse(reply.text);
    K.lastRead = Date.now();
    setFrame();
    drawPage();
}
function walkInto(name) { walk(K.walked.concat([name])); }
function walkUp() {
    const path = K.walked.slice(0, -1);
    if (!path.length) {
        K.walked = [];
        setFrame();
        drawPage();
        return;
    }
    walk(path);
}

/** A file in a folder you have walked into: shown in the Finder, never
 *  opened — a cleaner that launches things is not one anybody trusts. */
function revealThing(name) {
    tell('show', { path: K.walked.concat([name]) });
}

async function stopOne(name) {
    if (K.busy) return;
    K.busy = true;
    busyButtons(true);
    let reply;
    try {
        reply = await ask('stop', { name });
    } finally {
        K.busy = false;
    }
    busyButtons(false);
    if (reply.cancelled || reply.missing) return;
    afterRun(K.page, reply, 'Stop ' + name);
}

function busyButtons(on) {
    for (const b of document.querySelectorAll('.page .btn, .page .todo button')) {
        if (on) { b.dataset.was = b.disabled ? '1' : ''; b.disabled = true; }
        else { b.disabled = b.dataset.was === '1'; }
    }
    for (const b of document.querySelectorAll('.page .btn.fill')) b.classList.toggle('working', on);
}

/* ── Home's figures, read once and used everywhere ────────────────────── */

function readHome(pieces) {
    const f = facts(pieces);
    if (!f.Disk && !f.Desktop) return;
    let total = 0, free = 0;
    if (f.Disk) {
        const [a, b] = f.Disk.value.split(' of ');
        free = bytes((a || '').replace(/\s*free$/, '')) || 0;
        total = bytes(b) || 0;
    }
    const junk = f.Junk ? bytes(f.Junk.value) : null;
    const home = {
        total, free, used: Math.max(0, total - free), junk,
        desk: f.Desktop ? count(f.Desktop.value) : null,
        downloads: f.Downloads ? count(f.Downloads.value) : null,
        trash: f.Trash ? count(f.Trash.value) : null,
        deskOld: f['Desktop older'] ? f['Desktop older'].value : '',
        downloadsOld: f['Downloads older'] ? f['Downloads older'].value : '',
        months: f.Months ? f.Months.value.split(',').map(x => parseFloat(x)).filter(x => !isNaN(x)) : [],
        last: f['Last change'] ? f['Last change'].value : '',
        f,
    };
    // the fast half has no junk figure; keep the last one rather than a hole
    if (home.junk == null && K.home && K.home.junk != null) home.junk = K.home.junk;
    K.home = home;

    // and hand the menu behind ⌘K the same readings
    const figures = {};
    if (f.Desktop) figures['1'] = f.Desktop.value;
    if (f.Downloads) figures['2'] = f.Downloads.value;
    const cleanPage = pages().findIndex(p => p.kind === 'clean');
    if (home.junk > 0 && cleanPage >= 0) figures[String(cleanPage)] = size(home.junk);
    tell('figures', {
        headline: home.junk == null ? '' : home.junk > 0 ? size(home.junk) + ' worth freeing' : 'nothing worth freeing',
        figures,
    });
    tally();
}

/* Home reads itself again every half minute, only while you are looking */
setInterval(() => {
    if (K.page === 0 && !K.busy && !K.welcome && document.visibilityState === 'visible'
        && K.kept[0] && Date.now() - K.kept[0].at > 29000) look(0, true);
}, 5000);

/* ── the page ─────────────────────────────────────────────────────────── */

function drawPage(still) {
    const page = $('#page');
    if (!page) return;
    const i = K.page;
    const out = h('div', { class: still ? '' : 'arrive' });

    if (i === SETTINGS()) drawSettings(out);
    else if (i === HELP()) drawHelp(out);
    else if (K.walked.length) drawWalk(out);
    else {
        const kept = K.kept[i];
        if (!kept) { drawWaiting(i); return; }
        if (i === 0) drawHome(out, kept);
        else drawAction(out, i, kept);
    }
    page.replaceChildren(out);
    reportChrome();
}

function drawWaiting(i, what) {
    const page = $('#page');
    if (!page) return;
    const name = what || (isAction(i) ? pages()[i].title.toLowerCase() : '');
    const line = i === 0 && !what ? 'Looking at your Mac…'
        : kind(i) === 'top' || what ? `Measuring ${what || 'your home folder'}…`
        : kind(i) === 'clean' ? 'Looking for what is safe to clear…'
        : `Looking at ${name}…`;
    page.replaceChildren(h('div', { class: 'wait' },
        mascot('mascot'),
        h('h3', null, line),
        h('p', null, 'Nothing is changed while Kliner looks.'),
        h('div', { class: 'ghost' }, h('i'), h('i'), h('i'))));
}

/** The four-cornered frame every panel stands in. */
function panel(cls, ...kids) {
    return h('section', { class: 'panel' + (cls ? ' ' + cls : '') },
             h('i', { class: 'c a' }), h('i', { class: 'c b' }), h('i', { class: 'c d' }), h('i', { class: 'c e' }),
             kids);
}

function cap(symbol, text, right) {
    return h('div', { class: 'cap' }, symbol ? icon(symbol) : null, h('span', null, text),
             right ? h('div', { class: 'r' }, right) : null);
}

function bigFigure(text, sub, move) {
    const [n, unit] = figure(text);
    return h('div', { class: 'big' },
        h('div', null,
            h('div', { class: 'n' }, n, unit ? h('small', null, unit) : null),
            sub ? h('div', { class: 'sub' }, sub) : null),
        move ? h('div', { class: 'move' },
            h('div', { class: 'd ' + (move.tone || '') }, move.icon ? icon(move.icon) : null, move.d),
            move.w ? h('div', { class: 'w' }, move.w) : null) : null);
}

function tile(label, symbol, value, opts) {
    opts = opts || {};
    const [n, unit] = figure(value);
    return panel('tile',
        h('div', { class: 'k' }, icon(symbol), label),
        h('div', { class: 'v' }, n, unit ? h('small', null, unit) : null),
        opts.part != null ? h('div', { class: 'meter' }, h('i', { style: `width:${Math.max(1.5, Math.min(100, opts.part * 100))}%` })) : null,
        h('div', { class: 'f' },
            opts.pill ? h('span', { class: 'pill' + (opts.pillTone ? ' ' + opts.pillTone : '') }, opts.pill) : null,
            opts.foot ? h('span', { class: 't' }, opts.foot) : null));
}

function dashes(share, many) {
    many = many || 22;
    const on = share > 0 ? Math.max(1, Math.round(share * many)) : 0;
    const out = h('div', { class: 'dash' });
    for (let n = 0; n < many; n++) out.append(h('i', { class: n < on ? 'on' : '' }));
    return out;
}

/* weaves, not hues: a breakdown is told apart by texture */
const WEAVES = 6;
function swatch(n) {
    const svg = s('svg', { viewBox: '0 0 14 14' });
    svg.append(s('rect', { width: 14, height: 14, fill: `url(#weave${n % WEAVES})` }));
    return h('span', { class: 'sw' }, svg);
}

/* ── Home ─────────────────────────────────────────────────────────────── */

function greeting() {
    const hour = new Date().getHours();
    const part = hour < 5 ? 'Good evening' : hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
    const name = (K.meta.config.name || '').trim().split(/\s+/)[0];
    return name ? `${part}, ${name}.` : 'Hello.';
}

function drawHome(out, kept) {
    const pieces = kept.pieces || [];
    const home = K.home || {};
    const f = facts(pieces);
    const total = home.total || 0, free = home.free || 0, used = home.used || 0;
    const junk = home.junk;

    out.append(h('div', { class: 'head' },
        h('div', { class: 'words' },
            h('h1', null, greeting()),
            h('p', null, pages()[0].blurb)),
        h('div', { class: 'acts' },
            h('button', { class: 'btn line small', onclick: () => { delete K.kept[0]; look(0); } },
              icon('refresh'), 'Look again'))));

    if (!f.Disk && !f.Desktop) {
        drawAction(out, 0, kept, true);
        return;
    }

    // four readings, standing on the page
    const across = h('div', { class: 'grid four' });
    if (total > 0) {
        across.append(tile('Disk', 'disk', size(used), {
            part: used / total, pill: percent(used, total) + ' used', foot: 'of ' + size(total) }));
        across.append(tile('Free', 'sparkles', size(free), {
            part: free / total,
            pill: junk > 0 ? '+' + size(junk) + ' to spare' : null, pillTone: junk > 0 ? 'good' : '',
            foot: junk === 0 ? 'nothing worth freeing' : junk == null ? 'still measuring…' : null }));
    }
    if (home.desk != null) across.append(tile('Desktop', 'desk', String(home.desk), {
        pill: home.deskOld || null, foot: home.deskOld ? null : home.desk === 1 ? 'thing on it' : 'things on it' }));
    if (home.downloads != null) across.append(tile('Downloads', 'download', String(home.downloads), {
        pill: home.downloadsOld || null, foot: home.downloadsOld ? null : home.downloads === 1 ? 'thing in it' : 'things in it' }));
    if (across.children.length) out.append(across);

    // the one number, and where the room is
    if (total > 0) {
        const two = h('div', { class: 'grid two' });
        const worth = junk == null ? null : junk;
        two.append(panel('',
            bigFigure(worth == null ? '…' : worth > 0 ? size(worth) : '0 B',
                      worth == null ? 'Measuring what your apps keep that they can rebuild…'
                          : worth > 0 ? 'Worth freeing — caches your apps rebuild, and the trash'
                          : 'Nothing worth freeing. Your Mac is carrying nothing it does not need.',
                      worth > 0 ? { d: '+' + size(worth), icon: 'up', tone: 'good', w: 'on top of ' + size(free) + ' free' }
                                : { d: size(free), w: 'free right now' }),
            funnel([
                { value: total, name: 'On the disk' },
                { value: used, name: 'In use' },
                { value: worth || 0, name: 'Worth freeing' },
            ])));

        const bands = [
            { name: 'Your files', value: Math.max(0, used - (worth || 0)) },
            { name: 'Worth freeing', value: worth || 0 },
            { name: 'Free', value: free },
        ].filter(b => b.value > 0);
        two.append(panel('',
            bigFigure(size(used), 'In use, of ' + size(total) + ' on this Mac',
                      { d: percent(used, total) + ' used', w: size(free) + ' free' }),
            ringRow(bands, total, percent(used, total), 'used')));
        out.append(two);
    }

    // four cards
    const four = h('div', { class: 'grid four' });
    four.append(deskCard(home));
    four.append(promiseCard(home));
    four.append(home.months && home.months.length === 12 && home.months.some(x => x > 0)
        ? monthsCard(home) : machineCard(f));
    four.append(todoCard(home));
    out.append(four);
}

function deskCard(home) {
    const rows = [
        { name: 'Desktop', n: home.desk, old: home.deskOld, page: 1 },
        { name: 'Downloads', n: home.downloads, old: home.downloadsOld, page: 2 },
        { name: 'Trash', n: home.trash, old: '', page: -1 },
    ].filter(r => r.n != null);
    const most = Math.max(1, ...rows.map(r => r.n || 0));
    const list = h('div', { class: 'list' });
    for (const r of rows) {
        const one = h('div', { style: r.page >= 0 ? 'cursor:pointer' : '', onclick: r.page >= 0 ? () => show(r.page) : null },
            h('div', { class: 'l' }, h('b', null, r.name),
              r.old ? h('span', { class: 'pill' }, r.old) : null,
              h('span', { class: 'v' }, plural(r.n, 'item'))),
            dashes(r.n / most));
        list.append(one);
    }
    return panel('', cap('grid', 'On your desk', 'right now'), list);
}

function promiseCard(home) {
    const last = (home.last || '').trim();
    const undoPage = pages().findIndex(p => p.kind === 'undo');
    const first = last ? last.split(', ')[0] : '';
    return panel('', cap('list', 'Nothing is deleted'),
        h('div', { class: 'promise' },
            h('div', { class: 'marks' },
                h('span', null, icon('tray')), h('span', null, icon('plus')), h('span', null, icon('undo'))),
            h('h4', null, first ? first.charAt(0).toUpperCase() + first.slice(1) : 'Everything can go back'),
            h('p', null, 'Kliner moves things and writes down every move, so any of it can go back the way it was.'),
            undoPage >= 0 ? h('button', { class: 'btn fill small', onclick: () => show(undoPage) }, 'Put it all back') : null));
}

function monthsCard(home) {
    const months = home.months;
    const most = Math.max(...months);
    const names = [];
    const now = new Date();
    for (let back = 11; back >= 0; back--) {
        const d = new Date(now.getFullYear(), now.getMonth() - back, 1);
        names.push(d.toLocaleString('en', { month: 'short' }));
    }
    const busiest = names[months.indexOf(most)];
    const all = months.reduce((a, b) => a + b, 0);
    const row = h('div', { class: 'row' });
    const shades = ['var(--sel)', 'var(--w4)', 'var(--w3)', 'var(--w2)', 'var(--w0)'];
    months.forEach((m, n) => {
        const level = m <= 0 ? 0 : Math.min(4, 1 + Math.floor((m / most) * 3.999));
        row.append(h('i', { style: `background:${shades[level]}`, title: `${names[n]}: ${m}` }));
    });
    const ax = h('div', { class: 'ax' });
    names.forEach((n, k) => ax.append(h('span', null, k % 2 === 1 ? n : '')));
    const scale = h('div', { class: 'scale' }, 'fewer',
        shades.map(c => h('i', { style: `background:${c}` })), 'more');

    let move = null;
    const nowM = months[11], before = months[10];
    if (before > 0 && nowM > 0) {
        const by = (nowM - before) / before;
        if (Math.abs(by) >= 0.05) move = h('span', { class: 'pill ' + (by > 0 ? 'bad' : 'good') },
            icon(by > 0 ? 'up' : 'arrdown'), Math.round(Math.abs(by) * 100) + '% vs last month');
    }
    return panel('', cap('clock', 'Last changed', move || '12 months'),
        h('div', { class: 'pair' },
            h('div', null, h('div', { class: 'n' }, whole(all)), h('div', { class: 'c' }, 'things, by the month they arrived')),
            h('div', null, h('div', { class: 'n' }, busiest), h('div', { class: 'c' }, 'busiest month'))),
        h('div', { class: 'heat' }, row, ax, scale));
}

function machineCard(f) {
    const keys = ['System', 'Memory', 'Battery', 'Uptime'].filter(k => f[k]);
    const list = h('div', { class: 'facts' });
    for (const k of keys) {
        list.append(h('div', { class: 'fact' }, h('span', { class: 'k' }, k),
            h('span', { class: 'v' }, f[k].value), h('span')));
    }
    const doctor = pages().findIndex((p, n) => n > 0 && p.kind === 'doctor');
    return panel('', cap('cpu', 'This Mac', doctor > 0 ? h('button', { class: 'btn bare small', onclick: () => show(doctor) }, 'More') : null), list);
}

function todoCard(home) {
    const cleanPage = pages().findIndex(p => p.kind === 'clean');
    const undoPage = pages().findIndex(p => p.kind === 'undo');
    const items = [];
    if (!K.sighted) items.push({ name: 'Let Kliner see your files', cmd: 'macOS has not been asked yet', fig: '', icon: 'lock', verb: 'Ask',
                                 go: async () => { await ask('askFolders'); delete K.kept[0]; look(0); } });
    items.push({ name: 'Clear the desktop', cmd: 'min desktop', fig: home.desk ? plural(home.desk, 'item') : 'already clear',
                 icon: 'desk', done: home.desk === 0, page: 1, verb: 'Clear' });
    items.push({ name: 'Sort the downloads', cmd: 'min downloads', fig: home.downloads ? plural(home.downloads, 'item') : 'already sorted',
                 icon: 'download', done: home.downloads === 0, page: 2, verb: 'Sort' });
    if (cleanPage >= 0) items.push({ name: 'Free up space', cmd: 'min clean',
                 fig: home.junk == null ? 'measuring…' : home.junk > 0 ? size(home.junk) : 'nothing to free',
                 icon: 'sparkles', done: home.junk === 0, page: cleanPage, verb: 'Free' });
    if (undoPage >= 0) items.push({ name: 'Put it all back', cmd: 'min undo --all', fig: '', icon: 'undo', page: undoPage, verb: 'Open' });

    const list = h('div', { class: 'todo' });
    for (const it of items) {
        const row = h('div', { class: 't' + (it.done ? ' done' : ''), style: 'cursor:pointer',
                               onclick: () => (it.page != null ? show(it.page) : it.go()) },
            h('span', { class: 'ico' }, icon(it.icon)),
            h('div', { style: 'min-width:0' }, h('div', { class: 'nm' }, h('span', null, it.name)), h('div', { class: 'cm' }, it.cmd)),
            h('div', { class: 'go' }, it.fig ? h('span', { class: 'fig' }, it.fig) : null, icon('right')));
        list.append(row);
    }
    const both = [1, 2].filter(n => (n === 1 ? home.desk : home.downloads) > 0);
    return panel('', cap('bolt', 'Everything',
        both.length > 1 ? h('button', { class: 'btn line small', onclick: () => tidyBoth(both) }, 'Tidy both') : null), list);
}

/* ── the funnel: three readings of one disk, narrowing ────────────────── */

function funnel(stops) {
    const W = 1000, H = 250, top = 30, bottom = 26, room = H - top - bottom;
    const max = stops[0].value || 1;
    const floor = 3;
    const hs = stops.map(st => Math.max(floor, (st.value / max) * room));
    const box = h('div', { class: 'funnel' });
    const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: 'none' });
    const cols = stops.length, cw = W / cols, mid = top + room / 2;
    const fills = ['var(--w0)', 'var(--w2)', 'var(--w4)'];
    for (let c = 0; c < cols; c++) {
        const x0 = c * cw, a = hs[c], b = c + 1 < cols ? hs[c + 1] : hs[c];
        const upper = [], lower = [];
        for (let k = 0; k <= 40; k++) {
            const t = k / 40, x = x0 + cw * t;
            let hh = a;
            if (c + 1 < cols && t > 0.42) {
                const u = (t - 0.42) / 0.58;
                const e = u * u * (3 - 2 * u);
