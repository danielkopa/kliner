.uideas.off .ui-c { animation: none; }
.userline .uideas.small.off { display: none; }

/* ── v11: the window Dan drew ──────────────────────────────────────────
   Light, always: white, hairlines, greys, and black where something is on.
   A rail of places down the left with Kliner at the top; beside it the
   place's own sidebar — its name, search, its pages with what is waiting
   in each, and what goes with it; then the page: where you are along the
   top, the title with its facts as chips, tabs for the ways to see it, and
   a board of cards. No gradients, no colour but green for done and red for
   what did not work. */

:root {
    color-scheme: light dark;
    /* the three surfaces every page is built from: the window's own ground,
       a card standing on it, and a card you point at or one sunk into it */
    --surf: #ffffff; --surf-2: #fafafb; --sunk: #fbfbfc;
    --mark: #151517; --mark-ink: #ffffff; --on-hi: #2a2a2e;
    --app: #ffffff; --rail: #ffffff; --bg: #ffffff; --panel: #ffffff; --well: #ffffff; --raise: #ffffff;
    --hover: #f5f5f6; --sel: #f2f2f3; --sel-2: #e8e8ea; --line: #ececee; --line-2: #e1e1e4;
    --ink: #151517; --body: #2f3034; --muted: #76787f; --faint: #a3a5ab; --ghost: #cdced3;
    --good: #1f9d55; --bad: #e5484d;
    --on: #151517; --on-ink: #ffffff; --accent: #151517; --accent-2: rgba(0, 0, 0, .05); --accent-ink: #ffffff;
    --glass: rgba(244, 244, 243, .68);
    --w0: #1c1c1e; --w1: #47484c; --w2: #76777d; --w3: #a0a1a6; --w4: #c6c7cc; --w5: #e1e1e5;
    --shadow: 0 18px 50px rgba(0, 0, 0, .12); --lift: 0 1px 2px rgba(0, 0, 0, .05), 0 6px 16px rgba(0, 0, 0, .05);
    --card: linear-gradient(transparent, transparent); --glow: rgba(0, 0, 0, .03); --edge: rgba(0, 0, 0, .3); --shade: rgba(20, 20, 22, .3);
    --tile: #f2f2f3; --tile-hi: #ffffff; --tile-shade: 0 0 0 transparent; --fill-face: #151517; --fill-hi: rgba(255, 255, 255, .12);
    --line-hi: transparent; --top-light: transparent; --bar-hi: rgba(255, 255, 255, .16); --bar-lo: transparent;
    --side-hover: #f5f5f6; --side-sel: #f2f2f3; --side-ring: transparent; --side-field: #ffffff;
    --sheet-shade: none; --row-on: #f5f5f6; --kbd: #f2f2f3; --dot: rgba(0, 0, 0, .075);
    --col: #f6f6f7;
}

body { background: var(--app); font-size: 13.5px; }

/* the frame: the rail, the sidebar, the page, side by side on white */
.app { grid-template-columns: 64px 248px minmax(0, 1fr); background: var(--app); }
.app.wide { grid-template-columns: 64px 248px minmax(0, 1fr); }
.app:not(.wide) { grid-template-columns: 64px minmax(0, 1fr); }
.app:not(.wide) .side { display: none; }
.main { margin: 0; border-radius: 0; box-shadow: none; background: var(--app); }

/* ── the rail ── */
.rail { background: var(--app); border-right: 1px solid var(--line); padding: 34px 0 14px; align-items: center; gap: 6px; }
.rail .logo, .rail .seekwrap, .rail .sign, .rail > .mark { display: none !important; }
.r-logo { width: 36px; height: 36px; border-radius: 10px; background: var(--mark); display: grid; place-items: center; cursor: pointer; }
.r-logo .eyes-mark { width: 22px; height: 16px; overflow: visible; --glance: 12px; }
.r-logo .eyes-mark .eye { fill: var(--mark-ink); }
.r-new { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--body);
    box-shadow: inset 0 0 0 1px var(--line-2); margin-top: 10px; transition: background .12s ease; }
.r-new:hover { background: var(--hover); }
.r-new .ic { width: 16px; height: 16px; }
.r-sep { display: block; width: 28px; height: 1px; background: var(--line); margin: 8px 0 6px; }
.rail .places { flex: 1 1 auto; padding: 0; gap: 4px; align-items: center; overflow: visible; }
.rail .foot { margin-top: auto; padding: 0; gap: 4px; align-items: center; box-shadow: none; }
.rail .spot, .app:not(.wide) .rail .spot, .app.wide .rail .spot { width: 40px; height: 40px; min-width: 40px; padding: 0; justify-content: center;
    border-radius: 10px; color: var(--muted); background: transparent; }
.rail .spot .ic, .app.wide .rail .spot .ic { width: 18px; height: 18px; }
.rail .spot:hover { background: var(--hover); color: var(--ink); }
.rail .spot.on, .app.wide .rail .places .spot.on { background: var(--sel); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2); }
.rail .spot .label, .rail .foot .keys { display: none !important; }
.rail .spot .count, .app.wide .rail .spot .count { position: absolute; top: 3px; right: 2px; min-width: 15px; height: 15px; padding: 0 4px;
    border-radius: 999px; background: var(--ink); color: var(--on-ink); font-size: 9.5px; font-weight: 600; line-height: 15px; text-align: center;
    box-shadow: 0 0 0 2px var(--app); }
.rail .spot .count.soft { display: none; }
.rail .you, .app.wide .rail .you { width: auto; margin: 6px 0 0; }
.rail .you .me, .app.wide .rail .you .me { width: 40px; height: 40px; padding: 0; justify-content: center; border-radius: 50%; }
.rail .you .who2, .app.wide .rail .you .who2 { display: none !important; }
.rail .you .face2.small, .app.wide .rail .you .face2.small { width: 32px; height: 32px; font-size: 12px; }

/* ── the sidebar ── */
.side { min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden;
    border-right: 1px solid var(--line); background: var(--app); padding: 0 12px 16px; scrollbar-width: none; }
.side::-webkit-scrollbar { display: none; }
.sd-head { height: 52px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 2px 0 6px; }
.sd-head b { font-size: 15px; font-weight: 600; letter-spacing: -.01em; color: var(--ink); }
.sd-head .sq { width: 30px; height: 30px; border-radius: 8px; color: var(--muted); }
.sd-head .sq:hover { background: var(--hover); color: var(--ink); }
.sd-find { flex: none; height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 7px 0 10px; border-radius: 9px;
    box-shadow: inset 0 0 0 1px var(--line-2); color: var(--faint); font-size: 13px; text-align: left; transition: box-shadow .12s ease; }
.sd-find:hover { box-shadow: inset 0 0 0 1px var(--ghost); color: var(--muted); }
.sd-find .ic { width: 15px; height: 15px; color: var(--muted); }
.sd-find span { flex: 1; }
.sd-find kbd { font-size: 11px; color: var(--faint); background: var(--sel); border-radius: 5px; padding: 1px 6px; }
.sd-list { position: relative; display: flex; flex-direction: column; gap: 2px; margin-top: 14px; flex: none; }
.side .spot.pg { position: relative; z-index: 1; height: 34px; min-width: 0; width: 100%; padding: 0 10px; border-radius: 8px; gap: 10px;
    justify-content: flex-start; color: var(--body); background: transparent; }
.side .spot.pg .ic { width: 17px; height: 17px; color: var(--muted); }
.side .spot.pg .label { display: block !important; font-size: 13.5px; color: inherit; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side .spot.pg:hover { background: var(--hover); }
.side .spot.pg.on, .side .spot.pg.on:hover { background: transparent; color: var(--ink); font-weight: 500; }
.side .spot.pg.on .ic { color: var(--ink); }
.side .spot.pg .count { position: static; margin-left: auto; min-width: 22px; height: 20px; padding: 0 6px; border-radius: 6px;
    background: var(--sel); color: var(--muted); font-size: 11.5px; font-weight: 500; line-height: 20px; text-align: center; box-shadow: none; }
.side .spot.pg.on .count { background: var(--surf); color: var(--body); }
.side .spot.pg .count.soft { background: transparent; padding: 0; color: var(--faint); }
.side .sd-list > .mark { position: absolute; left: 0; right: 0; top: 0; width: auto; height: 34px; border-radius: 8px; z-index: 0;
    background: var(--sel); transition: transform .38s var(--glide), height .38s var(--glide), opacity .2s ease; }
.side .sd-list > .mark.jump { transition: none !important; }
.sd-sec { margin-top: 22px; display: flex; flex-direction: column; gap: 2px; flex: none; }
.sd-sec-h { padding: 0 10px 6px; font-size: 12px; font-weight: 500; color: var(--faint); }
.sd-row { height: 34px; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 10px; border-radius: 8px; color: var(--body); min-width: 0; }
.sd-row.go { cursor: pointer; }
.sd-row.go:hover { background: var(--hover); }
.sd-ic { width: 24px; height: 24px; flex: none; border-radius: 7px; display: grid; place-items: center; background: var(--sel); color: var(--muted); overflow: hidden; }
.sd-ic .ic { width: 13px; height: 13px; }
.sd-ic.pic { background: transparent; }
.sd-ic.pic img { width: 22px; height: 22px; object-fit: contain; }
.sd-ic.pic img.photo { width: 24px; height: 24px; object-fit: cover; border-radius: 6px; }
.sd-t { flex: 1; min-width: 0; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sd-fig { flex: none; font-size: 12px; color: var(--faint); }
.sd-key { flex: none; font-size: 11px; font-weight: 600; color: var(--muted); background: var(--sel); border-radius: 5px; min-width: 20px; height: 20px;
    display: inline-grid; place-items: center; padding: 0 5px; }
.sd-do.btn.small { height: 24px; padding: 0 9px; font-size: 12px; border-radius: 7px; }
.sd-wait { padding: 6px 10px; font-size: 12.5px; color: var(--faint); }
.sd-disk { display: grid; gap: 8px; padding: 6px 10px 4px; border-radius: 8px; }
.sd-disk.go { cursor: pointer; }
.sd-disk.go:hover { background: var(--hover); }
.sd-disk-n { display: flex; align-items: baseline; gap: 6px; }
.sd-disk-n b { font-size: 15px; font-weight: 600; color: var(--ink); }
.sd-disk-n span, .sd-disk-k { font-size: 12px; color: var(--muted); }
.sd-disk-k { display: flex; justify-content: space-between; gap: 8px; }
.sd-disk .hm-bar { height: 5px; }

/* ── the bar along the top of the page ── */
.bar { height: 52px; padding: 0 16px 0 24px; gap: 12px; border-bottom: 1px solid var(--line); background: var(--app); }
.bar .nav, .bar .right { background: none; box-shadow: none; padding: 0; border-radius: 0; }
.bar .right { gap: 8px; }
.bar .unfold { display: none; }
.app:not(.wide) .bar .unfold { display: grid; margin-left: -8px; }
.bar .sq { width: 30px; height: 30px; border-radius: 8px; color: var(--muted); }
.bar .sq:hover { background: var(--hover); color: var(--ink); }
.where { gap: 6px; padding: 0; }
.where .crumb { font-size: 13.5px; color: var(--muted); padding: 4px 4px; margin: 0 -4px; border-radius: 6px; }
.where button.crumb:hover { color: var(--ink); background: var(--hover); }
.where .slash { color: var(--ghost); display: inline-flex; }
.where .slash .ic { width: 14px; height: 14px; }
.where .name { font-size: 13.5px; font-weight: 500; color: var(--ink); }
.where .group { font-size: 13.5px; color: var(--muted); }
.bar .sendbtn.btn.small { height: 32px; padding: 0 12px; gap: 7px; border-radius: 9px; font-size: 13px; font-weight: 500; color: var(--ink);
    border: 1px solid var(--line-2); background: var(--surf); }
.bar .sendbtn.btn.small:hover { background: var(--hover); }
.bar .sendbtn .ic { width: 15px; height: 15px; }
.bar .state:hover { background: var(--hover); }
.bar .mode.on { background: var(--sel); color: var(--ink); }
.tabs { background: var(--sel); box-shadow: none; padding: 3px; border-radius: 9px; }
.tabs .glide { background: var(--surf); box-shadow: 0 1px 2px rgba(0, 0, 0, .08), inset 0 0 0 1px var(--line); border-radius: 7px; top: 3px; bottom: 3px; }
.tab { border-radius: 7px; }

/* ── the page ── */
.page { padding: 28px 32px 48px; }
.page > div { gap: 0; }

/* the title: a tile, the name, a line under it; the actions on the right */
.ph, .head { display: block; padding: 0; margin: 0 0 4px; }
.ph-top, .head { display: flex; align-items: center; gap: 12px; }
.ph-tile { width: 34px; height: 34px; flex: none; border-radius: 9px; display: grid; place-items: center; overflow: hidden;
    background: var(--sel); box-shadow: inset 0 0 0 1px var(--line); }
.ph-tile .face2.small { width: 34px; height: 34px; border-radius: 9px; font-size: 13px; }
.ph-words, .head .words { min-width: 0; flex: 1; }
.ph-words h1, .head h1 { font-size: 24px; font-weight: 600; letter-spacing: -.022em; line-height: 1.2; color: var(--ink); }
.ph-words p, .head p { margin-top: 2px; color: var(--muted); font-size: 13px; }
.head .pg-ic { width: 34px; height: 34px; border-radius: 9px; background: var(--sel); color: var(--body); box-shadow: inset 0 0 0 1px var(--line); }
.head .pg-ic .ic { width: 17px; height: 17px; stroke-width: 1.6; }
.head .acts { gap: 8px; }
.head .acts .sq { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line-2); color: var(--muted); }
.head .acts .sq:hover { background: var(--hover); color: var(--ink); }
.btn { border-radius: 9px; }
.btn.fill { background: var(--on); color: var(--on-ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
.btn.fill:hover { filter: none; background: var(--on-hi); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
.btn.line { background: var(--surf); border: 1px solid var(--line-2); color: var(--ink); font-weight: 500; }
.btn.line:hover { background: var(--hover); border-color: var(--line-2); }

/* the facts, as chips */
.ph-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 0; }
.pchip { height: 32px; display: inline-flex; align-items: center; gap: 7px; padding: 0 12px; border-radius: 9px; font-size: 13px;
    color: var(--muted); background: var(--surf); box-shadow: inset 0 0 0 1px var(--line-2); white-space: nowrap; }
.pchip .ic { width: 15px; height: 15px; color: var(--muted); }
.pchip b { color: var(--ink); font-weight: 500; }
.pchip.go { cursor: pointer; transition: background .12s ease; }
.pchip.go:hover { background: var(--hover); }

/* the tabs under the title */
.vtabs { display: flex; gap: 22px; margin-top: 22px; border-bottom: 1px solid var(--line); }
.vtab { height: 40px; display: inline-flex; align-items: center; gap: 7px; margin-bottom: -1px; font-size: 13.5px; font-weight: 500;
    color: var(--muted); border-bottom: 2px solid transparent; transition: color .12s ease, border-color .12s ease; }
.vtab .ic { width: 15px; height: 15px; }
.vtab:hover { color: var(--ink); }
.vtab.on { color: var(--ink); border-bottom-color: var(--ink); }
.vbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 16px 0 18px; }
.vbar-l { display: flex; align-items: center; gap: 6px; color: var(--faint); font-size: 12.5px; }
.vbar-l .sq { width: 30px; height: 30px; border-radius: 8px; color: var(--muted); }
.vbar-l .sq:hover { background: var(--hover); color: var(--ink); }
.vfind { width: min(320px, 46%); height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 7px 0 11px; border-radius: 9px;
    box-shadow: inset 0 0 0 1px var(--line-2); color: var(--faint); font-size: 13px; text-align: left; }
.vfind:hover { box-shadow: inset 0 0 0 1px var(--ghost); color: var(--muted); }
.vfind .ic { width: 15px; height: 15px; color: var(--muted); }
.vfind span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vfind kbd { font-size: 11px; color: var(--faint); background: var(--sel); border-radius: 5px; padding: 1px 6px; }
.view { min-width: 0; }
.head + .ph-chips + .vtabs + .view, .vtabs + .view { margin-top: 18px; }
.vtabs + .looking, .vtabs + .shut { margin-top: 18px; }

/* ── the board ── */
.board { display: flex; align-items: flex-start; gap: 14px; overflow-x: auto; padding-bottom: 10px; min-height: 120px; }
.bcol { flex: 1 1 0; min-width: 236px; max-width: 360px; background: var(--col); border-radius: 14px; padding: 6px 8px 8px; }
.board.fboard .bcol { flex: 0 0 272px; max-width: none; }
.bcol-h { height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 6px; }
.bcol-h b { font-size: 13.5px; font-weight: 600; color: var(--ink); }
.bcol-ic { width: 16px; height: 16px; display: grid; place-items: center; color: var(--muted); }
.bcol-ic .ic { width: 15px; height: 15px; stroke-width: 1.8; }
.bcol.b-todo .bcol-ic .ic circle { fill: none; stroke: currentColor; }
.bcol.b-done .bcol-ic { color: var(--good); }
.bcol-n { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 6px; background: var(--surf); box-shadow: inset 0 0 0 1px var(--line-2);
    color: var(--muted); font-size: 11.5px; font-weight: 500; line-height: 20px; text-align: center; }
.bcol-b { display: flex; flex-direction: column; gap: 8px; }
.bcol-none { padding: 14px 10px 12px; color: var(--faint); font-size: 12.5px; }
.bcol-none.wide { flex: 1; padding: 40px 0; text-align: center; background: var(--col); border-radius: 14px; }
.bcol-more { padding: 8px 10px; color: var(--muted); font-size: 12.5px; text-align: left; border-radius: 8px; }
.bcol-more:hover { background: var(--surf); color: var(--ink); }
.bcard { position: relative; background: var(--surf); border-radius: 10px; padding: 12px 14px 11px; box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(0, 0, 0, .04);
    transition: box-shadow .15s ease, transform .2s var(--spring); outline: none; }
.bcard.go { cursor: pointer; }
.bcard.go:hover { box-shadow: 0 0 0 1px var(--line-2), 0 4px 14px rgba(0, 0, 0, .06); }
.bcard:focus-visible { box-shadow: 0 0 0 2px var(--ink); }
.bc-t { font-size: 13.5px; font-weight: 500; color: var(--ink); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.bc-top { display: flex; align-items: flex-start; gap: 10px; }
.bc-top .bc-t { flex: 1; min-width: 0; padding-top: 1px; }
.bc-pic { width: 30px; height: 30px; flex: none; display: grid; place-items: center; color: var(--muted); border-radius: 7px; overflow: hidden; }
.bc-pic .ic { width: 18px; height: 18px; }
.bc-pic img.icon { width: 30px; height: 30px; object-fit: contain; }
.bc-pic img.photo { width: 30px; height: 30px; object-fit: cover; border-radius: 6px; }
.bc-m { display: flex; align-items: center; gap: 12px; margin-top: 10px; min-height: 22px; color: var(--muted); font-size: 12px; }
.bc-k { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.bc-k .ic { width: 13px; height: 13px; flex: none; }
.bc-k.good { color: var(--good); }
.bc-gap { flex: 1; }
.bc-do.btn.small { height: 24px; padding: 0 10px; font-size: 12px; border-radius: 7px; }
.bc-key { font-size: 11px; font-weight: 600; color: var(--muted); background: var(--sel); border-radius: 5px; min-width: 22px; height: 22px;
    display: inline-grid; place-items: center; padding: 0 5px; }
.bcard.clear .bc-t { color: var(--body); }
.bcard .btn.turning { pointer-events: none; opacity: .6; }
.arrive .bcol { animation: panelIn .6s var(--arrive) backwards; }
.arrive .bcol:nth-child(2) { animation-delay: .05s; } .arrive .bcol:nth-child(3) { animation-delay: .1s; } .arrive .bcol:nth-child(n+4) { animation-delay: .15s; }
.arrive .bcard { animation: rowIn .45s var(--arrive) backwards; animation-delay: .18s; }

/* the other views of Home */
.view.hm { max-width: 860px; margin: 0; }
.view.hm .hm-cols { grid-template-columns: minmax(0, 1fr); }
.vmac .hm-mac { max-width: 1100px; }
.vmac .hm-mac-in { grid-template-columns: minmax(0, 1.5fr) minmax(280px, 1fr); align-items: start; gap: 28px; }
@media (max-width: 1100px) { .vmac .hm-mac-in { grid-template-columns: minmax(0, 1fr); } }

/* panels everywhere else: white cards with a hairline */
.panel { background: var(--surf); border: 1px solid var(--line); border-radius: 16px; }
.page > div > .panel, .page > div > .grid, .page > div > .split, .page > div > .cols, .page > div > .banner, .page > div > .shut,
.page > div > .looking, .page > div > section { margin-top: 14px; }
.page > div > .head + .panel, .page > div > .head + .split, .page > div > .head + .grid { margin-top: 22px; }
.split, .cols, .grid { gap: 14px; }
@media (prefers-reduced-motion: reduce) { .arrive .bcol, .arrive .bcard { animation: none !important; } }

/* a card's facts wrap under each other when the card is narrow; the button
   that does it stays at the end */
.bc-m { flex-wrap: wrap; row-gap: 6px; column-gap: 12px; }
.bc-k { overflow: visible; }
.bc-gap { display: none; }
.bc-do, .bc-key { margin-left: auto; }
.sd-sec .spot.pg { height: 32px; }

/* ── v12: a dashboard, after Efferd's ───────────────────────────────────
   Not a copy: the shape of one. One sidebar — Kliner beside the three
   lights, you, search, the pages under their places, your disk in a small
   card at the foot — and the page on a pale ground in white cards with a
   hairline: a strip of figures, one picture, a list of things to do, and
   tables. Black is still the one colour that means "this"; the readings
   themselves are drawn in one quiet teal; green is for done, red for what
   did not work. */

:root {
    --ground: #f6f6f7;
    --card-line: #e8e8eb;
    --data: #13a394; --data-2: #7fd8cd; --data-soft: #e3f6f3;
}

/* And the same window with the lights off, when the Mac has them off. Every
   token the light one sets is answered here — a page half in one theme and
   half in the other is the one way this goes wrong. The ground is darker
   than the cards, the way it is lighter than them in the light one, so a
   card still reads as a card; the one filled button turns white with dark
   ink; green, red and the teal of the readings are lifted, because the same
   hue on black is a hue nobody can see. */
@media (prefers-color-scheme: dark) {
    :root {
        --app: #0c0c0d; --rail: #0c0c0d; --bg: #0c0c0d; --panel: #131315; --well: #131315; --raise: #131315;
        --surf: #131315; --surf-2: #17171a; --sunk: #0f0f11;
        --ground: #09090a; --card-line: #232327;
        --hover: #1a1a1d; --sel: #202024; --sel-2: #2a2a2f; --line: #1f1f23; --line-2: #2e2e34;
        --ink: #ededee; --body: #c2c2c8; --muted: #8b8b93; --faint: #65656d; --ghost: #45454c;
        --good: #3fcf8e; --bad: #f0616d;
        --data: #2ec8b2; --data-2: #1b6d62; --data-soft: #0e2b28;
        --glass: rgba(12, 12, 13, .58);
        --on: #ededee; --on-ink: #0c0c0d; --on-hi: #ffffff; --accent: #ededee;
        --accent-2: rgba(255, 255, 255, .08); --accent-ink: #0c0c0d;
        --mark: #ededee; --mark-ink: #0c0c0d;
        --w0: #e9e9e9; --w1: #bdbdbd; --w2: #949494; --w3: #707070; --w4: #4f4f4f; --w5: #383838;
        --shadow: 0 18px 50px rgba(0, 0, 0, .6); --lift: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 16px rgba(0, 0, 0, .35);
        --glow: rgba(255, 255, 255, .05); --edge: rgba(255, 255, 255, .3); --shade: rgba(0, 0, 0, .6);
        --tile: #202024; --tile-hi: #17171a; --fill-face: #ededee; --fill-hi: rgba(0, 0, 0, .12);
        --bar-hi: rgba(255, 255, 255, .06);
        --side-hover: #1a1a1d; --side-sel: #202024; --side-field: #131315;
        --row-on: #1a1a1d; --kbd: #202024; --dot: rgba(255, 255, 255, .08);
        --col: #121214;
    }
    /* the one shadow that is a light in the dark: a card is told apart by
       its hairline, not by a shadow nobody can see */
    .panel { box-shadow: none; }
    .kpis { background: var(--line); }
}
body { background: var(--ground); }

/* ── the frame ── */
.app, .app.wide { grid-template-columns: 248px minmax(0, 1fr); background: var(--app); }
.app:not(.wide) { grid-template-columns: 64px minmax(0, 1fr); }
.main { background: var(--ground); }
.scroll { background: var(--ground); }

/* ── the sidebar ── */
/* Glass. The window is vibrant behind the web view (Web.swift puts an
   NSVisualEffectView under it), so the rail is a tint over whatever is
   behind the window — the wallpaper, mostly. Where the window is opaque
   this is simply the rail's own colour and nothing looks wrong. */
.sb { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--app);
    border-right: 1px solid var(--line); padding: 0 10px 10px; overflow: hidden; z-index: 2; }
/* Only once the app says the window behind the page is vibrant: the
   ground goes away and the rail becomes a tint over the wallpaper. */
html.glass body { background: transparent; }
html.glass .sb { background: var(--glass);
    -webkit-backdrop-filter: blur(34px) saturate(1.7); backdrop-filter: blur(34px) saturate(1.7); }
/* the top strip is the title bar's: the three lights end at x = 72 and sit
   on a line 13 points down, so what shares the strip sits on that line too */
.sb-top { flex: none; height: 38px; display: flex; align-items: flex-start; gap: 4px; padding: 0 0 0 70px; }
.sb-logo { height: 26px; display: inline-flex; align-items: center; gap: 7px; padding: 0 7px 0 5px; border-radius: 7px; color: var(--ink);
    transition: background .12s ease; }
.sb-logo:hover { background: var(--hover); }
.sb-mark { width: 19px; height: 19px; border-radius: 6px; background: var(--mark); display: grid; place-items: center; flex: none; }
.sb-mark .eyes-mark { width: 12px; height: 10px; overflow: visible; --glance: 7px; }
.sb-mark .eyes-mark .eye { fill: var(--mark-ink); }
.sb-logo .word-mark { height: 11px; width: auto; color: var(--ink); }
.sb-fold { margin-left: auto; width: 26px; height: 26px; border-radius: 7px; color: var(--muted); }
.sb-fold:hover { background: var(--hover); color: var(--ink); }

/* you, the way a workspace sits at the top of one */
.sb .you { flex: none; width: auto; margin: 0 0 8px; }
.sb .you .me { width: 100%; height: 46px; display: flex; align-items: center; gap: 10px; padding: 0 9px; border-radius: 10px; text-align: left;
    box-shadow: inset 0 0 0 1px var(--line); background: var(--surf); transition: background .12s ease, box-shadow .12s ease; }
.sb .you .me:hover { background: var(--hover); box-shadow: inset 0 0 0 1px var(--line-2); }
.sb .you .face2.small { width: 28px; height: 28px; border-radius: 8px; font-size: 11px; flex: none; }
.sb .you .who2 { display: flex !important; flex-direction: column; min-width: 0; line-height: 1.25; }
.sb .you .who2 b { font-size: 14px; font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb .you .who2 span { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.sb-find { flex: none; height: 36px; display: flex; align-items: center; gap: 9px; padding: 0 6px 0 11px; border-radius: 10px;
    box-shadow: inset 0 0 0 1px var(--line-2); color: var(--faint); font-size: 14px; background: var(--surf); transition: box-shadow .12s ease; }
.sb-find:hover { box-shadow: inset 0 0 0 1px var(--ghost); color: var(--muted); }
.sb-find .ic { width: 15px; height: 15px; color: var(--muted); }
.sb-find span.label { flex: 1; text-align: left; }
.sb-find kbd, .sb-find kbd.label { flex: none; font-size: 11px; color: var(--muted); background: var(--sel); border-radius: 5px; padding: 1px 6px; }

/* the pages, under their places; the list scrolls, the foot stays */
.sb-nav { position: relative; flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; margin: 12px -10px 0; padding: 0 10px 10px;
    scrollbar-width: none; }
.sb-nav::-webkit-scrollbar { display: none; }
.sb-grp { display: flex; flex-direction: column; gap: 1px; }
.sb-grp + .sb-grp { margin-top: 14px; }
.sb-grp-h { height: 26px; flex: none; display: flex; align-items: center; padding: 0 10px; font-size: 12.5px; font-weight: 500; color: var(--faint); }
.sb .spot.pg, .sb-foot .spot { position: relative; z-index: 1; height: 36px; min-width: 0; flex: none; padding: 0 11px; gap: 11px; border-radius: 9px;
    justify-content: flex-start; color: var(--body); background: transparent; }
.sb .spot.pg .ic, .sb-foot .spot .ic { width: 18px; height: 18px; color: var(--muted); transition: color .12s ease; }
.sb .spot .label { display: block; font-size: 14.5px; color: inherit; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb .spot.pg:hover, .sb-foot .spot:hover { background: var(--hover); color: var(--ink); }
.sb .spot.pg.on, .sb .spot.pg.on:hover { background: transparent; color: var(--ink); font-weight: 500; }
.sb .spot.pg.on .ic { color: var(--ink); }
.sb-nav > .mark { position: absolute; left: 10px; right: 10px; top: 0; width: auto; height: 36px; border-radius: 9px; z-index: 0; background: var(--sel);
    transition: transform .38s var(--glide), height .38s var(--glide), opacity .2s ease; }
.sb-nav > .mark.jump { transition: none !important; }
.sb .spot.pg .count { position: static; margin-left: auto; min-width: 20px; height: 18px; padding: 0 6px; border-radius: 5px; background: var(--sel);
    color: var(--muted); font-size: 11px; font-weight: 500; line-height: 18px; text-align: center; box-shadow: none; }
.sb .spot.pg.on .count { background: var(--surf); color: var(--body); box-shadow: inset 0 0 0 1px var(--line-2); }
.sb .spot.pg .count.soft { background: transparent; box-shadow: none; padding: 0; color: var(--faint); }

/* the foot: your disk in a small card, then Help and Settings */
.sb-foot { flex: none; display: flex; flex-direction: column; gap: 1px; margin: 0 -10px; padding: 10px 10px 0; border-top: 1px solid var(--line); }
.sb-foot .spot .keys { margin-left: auto; font-size: 11px; color: var(--faint); }
.sb-foot .spot.on { background: var(--sel); color: var(--ink); }
.sb-foot .spot.on .ic { color: var(--ink); }
.sb-disk { display: grid; gap: 8px; margin-bottom: 8px; padding: 11px 12px 12px; border-radius: 10px; background: var(--surf);
    box-shadow: inset 0 0 0 1px var(--line); }
.sbd-h { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 500; color: var(--ink); }
.sbd-h .ic { width: 14px; height: 14px; color: var(--muted); }
.sbd-h b { margin-left: auto; font-size: 12px; font-weight: 500; color: var(--muted); }
.sb-disk .hm-bar { height: 5px; }
.sb-disk .hm-bar i.u { background: var(--ink); }
.sb-disk .hm-bar i.j { background: var(--data); }
.sbd-k { font-size: 11.5px; color: var(--muted); }
.sbd-go { justify-self: start; display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 500; color: var(--ink); }
.sbd-go .ic { width: 12px; height: 12px; }
.sbd-go:hover { text-decoration: underline; text-underline-offset: 2px; }
@media (max-height: 700px) { .sb-disk { display: none !important; } }

/* folded: a rail of the same pictures */
.app:not(.wide) .sb { padding: 0 0 10px; align-items: center; }
.app:not(.wide) .sb-top { width: 100%; padding: 0; }
.app:not(.wide) .sb-logo, .app:not(.wide) .sb-fold { display: none; }
.app:not(.wide) .sb .you { margin: 0 0 6px; }
.app:not(.wide) .sb .you .me { width: 40px; height: 40px; padding: 0; justify-content: center; box-shadow: none; border-radius: 10px; }
.app:not(.wide) .sb .you .who2 { display: none !important; }
.app:not(.wide) .sb-find { width: 40px; height: 36px; padding: 0; justify-content: center; box-shadow: none; }
.app:not(.wide) .sb-find:hover { background: var(--hover); }
.app:not(.wide) .sb-find .label { display: none; }
.app:not(.wide) .sb-nav { width: 100%; margin: 6px 0 0; padding: 0 0 8px; }
.app:not(.wide) .sb-grp { align-items: center; }
.app:not(.wide) .sb-grp + .sb-grp { margin: 8px 12px 0; padding-top: 8px; border-top: 1px solid var(--line); }
.app:not(.wide) .sb-grp-h { display: none; }
.app:not(.wide) .sb .spot.pg, .app:not(.wide) .sb-foot .spot { width: 40px; height: 36px; padding: 0; justify-content: center; }
.app:not(.wide) .sb .spot .label, .app:not(.wide) .sb-foot .spot .keys { display: none; }
.app:not(.wide) .sb .spot.pg .count { position: absolute; top: 2px; right: 1px; min-width: 15px; height: 15px; padding: 0 4px; border-radius: 999px;
    background: var(--ink); color: var(--on-ink); font-size: 9.5px; font-weight: 600; line-height: 15px; box-shadow: 0 0 0 2px var(--app); }
.app:not(.wide) .sb .spot.pg.on .count { background: var(--ink); color: var(--on-ink); box-shadow: 0 0 0 2px var(--app); }
.app:not(.wide) .sb .spot.pg .count.soft { display: none; }
.app:not(.wide) .sb-nav > .mark { left: 50%; right: auto; width: 40px; margin-left: -20px; height: 36px; }
.app:not(.wide) .sb-disk { display: none; }
.app:not(.wide) .sb-foot { width: 100%; margin: 0; padding: 8px 0 0; align-items: center; }

/* ── the bar along the top ── */
.bar { background: var(--app); padding: 0 14px 0 22px; }
.app:not(.wide) .bar { padding-left: 16px; }
.bar .unfold { display: none; }
.app:not(.wide) .bar .unfold { display: grid; margin: 0; }
.bar-find { display: none; }
.app:not(.wide) .bar-find { display: inline-flex; height: 30px; min-width: 190px; align-items: center; gap: 8px; padding: 0 6px 0 10px; border-radius: 8px;
    box-shadow: inset 0 0 0 1px var(--line-2); color: var(--faint); font-size: 12.5px; }
.bar-find:hover { box-shadow: inset 0 0 0 1px var(--ghost); color: var(--muted); }
.bar-find .ic { width: 14px; height: 14px; color: var(--muted); }
.bar-find span { flex: 1; text-align: left; }
.bar-find kbd { font-size: 11px; color: var(--muted); background: var(--sel); border-radius: 5px; padding: 1px 6px; }

/* ── the page, on its ground ── */
.page { padding: 24px 28px 52px; max-width: 1480px; margin: 0 auto; container-type: inline-size; }
.panel { border-color: var(--card-line); box-shadow: 0 1px 2px rgba(16, 16, 22, .035); }
.page > div.dpage { display: flex; flex-direction: column; gap: 16px; }
.page > div.dpage > * { margin-top: 0 !important; }
.arrive > .d-row { animation: none; }
.d-row { display: grid; gap: 16px; align-items: stretch; }
.d-row > .panel { margin: 0 !important; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.d-hero { grid-template-columns: minmax(0, 2fr) minmax(300px, 1fr); }
.d-three { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1fr); }
@container (max-width: 900px) { .d-hero { grid-template-columns: minmax(0, 1fr); } }
@container (max-width: 1040px) { .d-three { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .d-three > :first-child { grid-column: 1 / -1; } }
@container (max-width: 620px) { .d-three { grid-template-columns: minmax(0, 1fr); } }

/* Home is not a wall of boxes. The only things in one are the four tiles;
   everything else is a small grey name with its rows on the page itself,
   with air between the blocks instead of borders around them. The boxes
   were what made this look like every other dashboard. */
.page > div.dpage { gap: 38px; }
.dpage .d-row { gap: 38px 44px; }
.dpage > .panel:not(.kpis),
.dpage .d-row > .panel:not(.kpis) {
    background: none; border: 0; box-shadow: none; padding: 0; border-radius: 0; gap: 10px; }
/* a block says its name in small grey, and nothing else: no mark beside
   it, no rule under it */
.dpage .panel:not(.kpis) > .dc-h { gap: 0; }
.dpage .panel:not(.kpis) > .dc-h > .ic { display: none; }
.dpage .panel:not(.kpis) .dc-t { font-size: 15px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.dpage .panel:not(.kpis) > .cap { font-size: 15px; font-weight: 500; color: var(--muted); min-height: 22px; }
.dpage .panel:not(.kpis) > .cap > .ic { display: none; }
.dpage .panel:not(.kpis) > .cap .r { font-size: 13px; }
/* rows sit on the page, parted by air and not by a line */
.dpage .dt-row { border-top: 0; border-radius: 12px; padding-left: 12px; padding-right: 12px; margin-left: -12px; margin-right: -12px; }
.dpage .dt-h { display: none; }

/* the tiles themselves, the way his are: tall, round, the number alone at
   the top and the mark and its name down at the foot */
.kpis { gap: 14px; }
.kpi { min-height: 168px; border-radius: 20px; padding: 22px 24px 20px; gap: 24px; }
.kpi-v b { font-size: 42px; }
.kpi-v b small { font-size: 18px; }
.kpi-k { font-size: 14px; }
@container (max-width: 760px) { .kpi { min-height: 132px; padding: 18px 20px 16px; } .kpi-v b { font-size: 32px; } }

/* the title of a page like this */
.dh { display: flex; align-items: flex-end; gap: 16px; padding: 0 2px 2px; }
.dh-w { flex: 1; min-width: 0; }
.dh h1 { font-size: 38px; font-weight: 600; letter-spacing: -.032em; line-height: 1.08; color: var(--ink); text-wrap: balance; }
@container (max-width: 760px) { .dh h1 { font-size: 28px; } }
.dh p { margin-top: 3px; font-size: 13px; color: var(--muted); max-width: 70ch; }
.dh-acts { display: flex; align-items: center; gap: 8px; flex: none; }
.dh-age { font-size: 12px; color: var(--faint); margin-right: 4px; white-space: nowrap; }
.dh-acts .btn { height: 32px; }
@container (max-width: 560px) { .dh { flex-direction: column; align-items: flex-start; } .dh-age { display: none; } }

/* a card's top line */
.dc-h { display: flex; align-items: center; gap: 8px; min-height: 24px; color: var(--muted); font-size: 12.5px; }
.dc-h > .ic { width: 15px; height: 15px; flex: none; }
.dc-t { color: var(--body); font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dc-r { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: none; }
.dc-link { display: inline-flex; align-items: center; gap: 3px; padding: 3px 6px; margin: -3px -6px; border-radius: 6px; font-size: 12.5px; color: var(--muted);
    transition: color .12s ease, background .12s ease; }
.dc-link:hover { color: var(--ink); background: var(--hover); }
.dc-link .ic { width: 13px; height: 13px; }
.dc-n { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--faint); white-space: nowrap; }
.dc-n.good { color: var(--good); }
.d-none { padding: 14px 0 6px; font-size: 12.5px; color: var(--faint); }
.d-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; padding: 14px 8px 10px; text-align: center; }
.de-tile { width: 40px; height: 40px; margin-bottom: 6px; border-radius: 11px; display: grid; place-items: center; background: var(--surf); color: var(--body);
    box-shadow: inset 0 0 0 1px var(--line-2), 0 1px 2px rgba(0, 0, 0, .04); }
.de-tile .ic { width: 18px; height: 18px; }
.d-empty b { font-size: 13.5px; font-weight: 600; color: var(--ink); }
.d-empty p { max-width: 34ch; font-size: 12.5px; color: var(--muted); text-wrap: balance; }
.d-empty .btn { margin-top: 8px; }

/* ── four figures in a strip ── */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; padding: 0;
    background: none; border: 0; box-shadow: none; }
.kpis.k3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.kpis.k2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.kpis.k1 { grid-template-columns: minmax(0, 1fr); }
@container (max-width: 760px) { .kpis.k4, .kpis.k3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { display: flex; flex-direction: column; justify-content: space-between; gap: 18px; min-width: 0;
    min-height: 132px; padding: 18px 20px 17px; border-radius: 16px; background: var(--surf);
    box-shadow: inset 0 0 0 1px var(--card-line); text-align: left; }
.kpi.go { cursor: pointer; transition: background .14s ease, box-shadow .14s ease; }
.kpi.go:hover { background: var(--surf-2); box-shadow: inset 0 0 0 1px var(--line-2); }
.kpi-b { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.kpi-k { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); }
.kpi-k .ic { width: 16px; height: 16px; flex: none; }
.kpi-k span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kpi-v { display: flex; align-items: flex-start; gap: 10px; min-width: 0; }
.kpi-v b { font-size: 34px; font-weight: 500; letter-spacing: -.03em; line-height: 1.05; color: var(--ink); white-space: nowrap; }
.kpi-v b small { margin-left: 4px; font-size: 16px; font-weight: 500; letter-spacing: 0; color: var(--muted); }
.kpi-v .pill { margin-left: auto; flex: none; }
.kpi-s { font-size: 12px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill .ic { width: 11px; height: 11px; }

/* ── the picture ── */
.dseg { display: inline-flex; gap: 2px; padding: 2px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--line-2); background: var(--surf); }
.dseg button { height: 24px; padding: 0 9px; border-radius: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; transition: color .12s ease, background .12s ease; }
.dseg button:hover { color: var(--ink); }
.dseg button.on { background: var(--sel); color: var(--ink); font-weight: 500; }
.dc-fig { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; }
.dc-fig > b { font-size: 26px; font-weight: 600; letter-spacing: -.025em; line-height: 1.1; color: var(--ink); }
.dc-fig > span:not(.pill) { font-size: 12.5px; color: var(--muted); }
.dc-fig > .pill { margin-left: auto; align-self: center; }
.ch { display: grid; grid-template-columns: 30px minmax(0, 1fr); grid-template-rows: 200px 18px; column-gap: 10px; row-gap: 10px; margin-top: 2px; }
.ch-y { position: relative; grid-column: 1; grid-row: 1; }
.ch-y span { position: absolute; right: 0; transform: translateY(-50%); font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
.ch-plot { position: relative; grid-column: 2; grid-row: 1; }
.ch-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.ch-grid { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 4; vector-effect: non-scaling-stroke; }
.ch-grid.base { stroke: var(--line-2); stroke-dasharray: none; }
.ch-area { stroke: none; }
.ch-s0 { stop-color: var(--data); stop-opacity: .2; }
.ch-s1 { stop-color: var(--data); stop-opacity: 0; }
.ch-line { fill: none; stroke: var(--data); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.ch-dot { position: absolute; z-index: 1; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: var(--surf);
    box-shadow: 0 0 0 2px var(--data); transition: transform .15s var(--spring); }
.ch-dot::after { content: ""; position: absolute; inset: -9px; border-radius: 50%; }
.ch-dot.last { background: var(--data); box-shadow: 0 0 0 2px var(--surf), 0 0 0 3.5px var(--data); }
.ch-dot.hot { transform: scale(1.35); }
.ch-x { position: relative; grid-column: 2; grid-row: 2; }
.ch-x span { position: absolute; top: 0; transform: translateX(-50%); font-size: 11px; color: var(--faint); white-space: nowrap; }
.ch-x span.first { transform: none; }
.ch-x span.last { transform: translateX(-100%); }
@container (max-width: 640px) { .ch-x span.odd:not(.last) { visibility: hidden; } }
.arrive .ch-svg { animation: wipe 1s var(--arrive) calc(var(--d, 60ms) + 140ms) backwards; }
.arrive .ch-dot { animation: fade .35s ease calc(var(--d, 60ms) + 320ms + var(--k, 0) * 45ms) backwards; }

/* ── things to do ── */
.tl { display: flex; flex-direction: column; margin: -4px -8px -6px; }
.tl-row { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px; border-radius: 9px; outline: none; }
.tl-row.go { cursor: pointer; transition: background .12s ease; }
.tl-row.go:hover { background: var(--hover); }
.tl-row:focus-visible { box-shadow: inset 0 0 0 2px var(--ink); }
.tl-ic { width: 32px; height: 32px; flex: none; display: grid; place-items: center; border-radius: 9px; background: var(--surf); color: var(--body);
    box-shadow: inset 0 0 0 1px var(--line-2); }
.tl-ic .ic { width: 16px; height: 16px; }
.tl-row.is-done .tl-ic { color: var(--good); }
.tl-w { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.tl-w b { font-size: 13.5px; font-weight: 500; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-w span { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-do.btn.small { height: 26px; padding: 0 10px; font-size: 12px; flex: none; }
.tl-do.turning { opacity: .6; pointer-events: none; }
.tl-key { flex: none; min-width: 22px; height: 22px; padding: 0 5px; display: inline-grid; place-items: center; border-radius: 5px; background: var(--sel);
    font-size: 11px; font-weight: 600; color: var(--muted); }
.tl-go { flex: none; display: grid; color: var(--ghost); transition: color .12s ease; }
.tl-go .ic { width: 15px; height: 15px; }
.tl-row.go:hover .tl-go { color: var(--muted); }
.arrive .tl-row { animation: rowIn .5s var(--arrive) calc(var(--d, 60ms) + 100ms) backwards; }

/* ── tables ── */
.dt-h, .dt-row { display: grid; grid-template-columns: minmax(0, 1fr) 70px 112px; align-items: center; gap: 12px; padding: 0 16px; }
.dt-h { height: 30px; font-size: 11.5px; color: var(--faint); border-bottom: 1px solid var(--line); }
.dt-row { min-height: 50px; border-top: 1px solid var(--line); outline: none; }
.dt-h + .dt-row { border-top: 0; }
.dt-row.go { cursor: pointer; transition: background .12s ease; }
.dt-row.go:hover { background: var(--surf-2); }
.dt-w { display: flex; flex-direction: column; min-width: 0; }
.dt-w b { font-size: 13px; font-weight: 500; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dt-w span { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dt-when { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.dt-st { justify-self: end; display: flex; }
.dt-undo { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); transition: color .12s ease; }
.dt-undo .ic { width: 13px; height: 13px; }
.dt-row.go:hover .dt-undo { color: var(--ink); }

/* ── this Mac ── */
.tm-bar { display: flex; gap: 2px; height: 8px; border-radius: 99px; overflow: hidden; background: var(--sel); }
.tm-bar i { display: block; height: 100%; min-width: 0; }
.tm-bar i.u { background: var(--ink); }
.tm-bar i.j { background: var(--data); }
.tm-bar i.f { background: var(--sel-2); }
.arrive .tm-bar i { animation: grow .9s var(--arrive) calc(var(--d, 60ms) + 200ms) backwards; transform-origin: left; }
.tm-key { display: grid; gap: 7px; }
.tm-key > div { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
.tm-key i { width: 8px; height: 8px; border-radius: 3px; flex: none; }
.tm-key i.u { background: var(--ink); }
.tm-key i.j { background: var(--data); }
.tm-key i.f { background: var(--sel-2); }
.tm-key b { margin-left: auto; font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }
.tm-kv { display: grid; margin: 0 -16px -6px; padding: 2px 16px 0; border-top: 1px solid var(--line); }
.tm-kv > div { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; font-size: 12.5px; }
.tm-kv > div + div { border-top: 1px solid var(--line); }
.tm-kv dt { color: var(--muted); flex: none; }
.tm-kv dd { min-width: 0; color: var(--ink); font-weight: 500; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ── sending, on Home ── */
.hsend { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.hs-job { display: flex; align-items: center; gap: 10px; margin: 0 -8px; padding: 7px 8px; border-radius: 8px; cursor: pointer; transition: background .12s ease; }
.hs-job:hover { background: var(--hover); }
.hs-jw { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.hs-jw b { font-size: 13px; font-weight: 500; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hs-jw span { font-size: 12px; color: var(--muted); }
.hs-job .tx-prog { width: 92px; }
.hs-new { align-self: flex-start; margin-top: 8px; }
.tx-ic { width: 30px; height: 30px; flex: none; display: grid; place-items: center; border-radius: 8px; background: var(--surf); color: var(--body);
    box-shadow: inset 0 0 0 1px var(--line-2); }
.tx-ic .ic { width: 15px; height: 15px; }
.spin { display: inline-block; flex: none; width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--line-2); border-top-color: var(--ink);
    animation: turn .8s linear infinite; }
.pill .spin { width: 9px; height: 9px; }
.ldot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 18%, transparent); }

/* ── the Send page ── */
.snd { gap: 16px; }
.snd-in { flex: 1 1 auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 18px; }
@container (max-width: 760px) { .snd-in { grid-template-columns: minmax(0, 1fr); } }
.snd-file { min-height: 206px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 20px;
    border-radius: 12px; text-align: center; min-width: 0; }
.snd-file.empty { border: 1.5px dashed var(--line-2); background: var(--sunk); transition: border-color .15s ease, background .15s ease; }
body.dropping .snd-file.empty { border-color: var(--data); background: var(--data-soft); }
.snd-file.got { border: 1px solid var(--line); background: var(--sunk); }
.sf-art { width: 44px; height: 44px; margin-bottom: 9px; border-radius: 12px; display: grid; place-items: center; background: var(--surf); color: var(--body);
    box-shadow: inset 0 0 0 1px var(--line-2), 0 1px 2px rgba(0, 0, 0, .04); }
.sf-art .ic { width: 20px; height: 20px; }
.sf-art.pic { width: 64px; height: 64px; background: transparent; box-shadow: none; }
.sf-art.pic img { width: 64px; height: 64px; object-fit: contain; }
.sf-art.pic .ic { width: 30px; height: 30px; }
.snd-file b { max-width: 100%; font-size: 14px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sf-s { font-size: 12.5px; color: var(--muted); }
.snd-file > .btn { margin-top: 12px; }
.sf-acts { display: flex; gap: 6px; margin-top: 12px; }
.snd-r { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.snd-lbl { font-size: 12.5px; font-weight: 500; color: var(--body); }
.snd-to { height: 42px; display: flex; align-items: center; gap: 2px; padding: 0 12px; border-radius: 10px; background: var(--surf);
    box-shadow: inset 0 0 0 1px var(--line-2); transition: box-shadow .15s ease; }
.snd-to:focus-within { box-shadow: inset 0 0 0 1px var(--ink), 0 0 0 3px rgba(0, 0, 0, .06); }
.snd-to .at { font-size: 15px; font-weight: 500; color: var(--faint); }
.snd-field { flex: 1; min-width: 0; border: 0; outline: none; background: none; font-size: 15px; color: var(--ink); -webkit-user-select: text; user-select: text; }
.snd-field::placeholder { color: var(--ghost); }
.snd-who { min-height: 20px; display: flex; align-items: center; flex-wrap: wrap; gap: 7px; font-size: 12.5px; color: var(--muted); }
.snd-who .ic { width: 14px; height: 14px; flex: none; }
.snd-who b { color: var(--ink); font-weight: 500; }
.snd-who.ok > .ic { color: var(--good); }
.snd-who.bad, .snd-who.bad > .ic { color: var(--bad); }
.snd-who .link { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
.snd-people { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
.pp { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
.pp-l { width: 66px; flex: none; display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--faint); }
.pp-l .ic { width: 13px; height: 13px; }
.pp-none { font-size: 12.5px; color: var(--faint); }
.snd .person { height: 28px; gap: 6px; padding: 0 10px 0 3px; background: var(--surf); color: var(--body); box-shadow: inset 0 0 0 1px var(--line-2); }
.snd .person:hover { background: var(--hover); }
.snd .person.on { color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
.snd .person .pf { width: 22px; height: 22px; background: var(--sel); color: var(--body); font-size: 11px; }
.snd-foot { display: flex; align-items: center; gap: 12px; margin: 0 -18px -2px; padding: 14px 18px 0; border-top: 1px solid var(--line); }
.snd-how { flex: 1; min-width: 0; display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); }
.snd-how .ic { width: 14px; height: 14px; flex: none; }
.snd .btn.fill, .snd-acts .btn { height: 36px; padding: 0 16px; }
.snd.is-live .ss { height: 168px; margin: 6px 0 0; }
.snd.is-live .ss-art, .snd.is-live .ss-to.blank .ss-face { background: var(--surf); }
.snd-line { text-align: center; font-size: 13px; color: var(--muted); min-height: 20px; text-wrap: balance; }
.snd-line b { color: var(--ink); font-weight: 500; }
.snd-line .q { color: var(--faint); }
.snd-acts { display: flex; justify-content: center; gap: 8px; padding-bottom: 4px; }

/* your name, and how a file travels */
.daddr { gap: 12px; }
.ad-name { font-size: 24px; font-weight: 600; letter-spacing: -.025em; line-height: 1.15; color: var(--ink); overflow-wrap: anywhere; }
.ad-name.none { color: var(--faint); }
.ad-where { display: flex; align-items: flex-start; gap: 8px; font-size: 12.5px; color: var(--muted); }
.ad-where .dot { width: 7px; height: 7px; margin-top: 6px; border-radius: 50%; background: var(--ghost); flex: none; }
.ad-where.ok .dot { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 16%, transparent); }
.ad-pick { align-self: flex-start; }
.ad-rows { display: flex; flex-direction: column; gap: 12px; padding-top: 14px; border-top: 1px solid var(--line); }
.ad-row { display: flex; align-items: flex-start; gap: 10px; }
.ad-ic { width: 28px; height: 28px; flex: none; display: grid; place-items: center; border-radius: 8px; color: var(--body); box-shadow: inset 0 0 0 1px var(--line-2); }
.ad-ic .ic { width: 14px; height: 14px; }
.ad-row > div > b, .ad-sw > div > b { display: block; font-size: 12.5px; font-weight: 500; color: var(--ink); }
.ad-row > div > span, .ad-sw > div > span { display: block; font-size: 12px; line-height: 1.4; color: var(--muted); }
.ad-sw { display: flex; align-items: center; gap: 12px; margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line); }
.ad-sw > div { flex: 1; min-width: 0; }
.ad-sw .switch { flex: none; }

/* every transfer */
.tx { display: flex; flex-direction: column; margin: -4px -18px -8px; }
.tx-h, .tx-row { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr) 76px 64px 150px 112px; align-items: center; gap: 12px; padding: 0 18px; }
.tx-h { height: 32px; font-size: 11.5px; color: var(--faint); border-bottom: 1px solid var(--line); }
.tx-row { min-height: 56px; border-top: 1px solid var(--line); }
.tx-h + .tx-row { border-top: 0; }
.tx-file { display: flex; align-items: center; gap: 10px; min-width: 0; }
.tx-fw { display: flex; flex-direction: column; min-width: 0; }
.tx-fw b { font-size: 13px; font-weight: 500; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx-why { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx-with { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx-with b { font-weight: 500; color: var(--ink); }
.tx-size, .tx-when { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tx-st { display: flex; min-width: 0; }
.tx-act { display: flex; justify-content: flex-end; gap: 6px; }
.tx-prog { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
.tx-track { flex: 1; height: 6px; border-radius: 99px; overflow: hidden; background: var(--sel); }
.tx-track i { display: block; height: 100%; border-radius: 99px; background: var(--data); transition: width .2s linear; }
.tx-prog b { width: 34px; font-size: 12px; font-weight: 500; color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }
@container (max-width: 780px) {
    .tx-h { display: none; }
    .tx-row { grid-template-columns: minmax(0, 1fr) 130px auto; padding: 10px 18px; }
    .tx-with, .tx-size, .tx-when { display: none; }
}

/* a file held over the window */
.drop-veil { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; pointer-events: none; opacity: 0;
    background: rgba(246, 246, 247, .74); transition: opacity .16s ease; }
.drop-veil::before { content: ""; position: absolute; inset: 10px; border: 2px dashed var(--data); border-radius: 14px; }
.drop-veil.show { opacity: 1; }
.dv-card { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 22px 30px; border-radius: 16px; background: var(--surf);
    box-shadow: 0 0 0 1px var(--line), 0 20px 60px rgba(0, 0, 0, .12); transform: scale(.96); transition: transform .22s var(--spring); }
.drop-veil.show .dv-card { transform: none; }
.dv-ic { width: 44px; height: 44px; margin-bottom: 6px; border-radius: 12px; display: grid; place-items: center; background: var(--ink); color: var(--on-ink); }
.dv-ic .ic { width: 20px; height: 20px; }
.dv-card b { font-size: 15px; font-weight: 600; color: var(--ink); }
.dv-card span { font-size: 12.5px; color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
    .arrive .ch-svg, .arrive .ch-dot, .arrive .tl-row, .arrive .tm-bar i, .spin { animation: none !important; }
    .sb-nav > .mark, .drop-veil, .dv-card { transition: none !important; }
}

/* ── v13: the window, after the dashboard Dan picked ─────────────────────
   Measured off the pixels of his pictures, not guessed. A warm near-black
   under a page that floats in the window; pure white for what you read and
   one warm grey for what names it; tiles with no border at all; and the
   system's own face. Geist on a black dashboard is the look every generated
   dashboard has, and that is what he kept calling it. */

:root { --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif; }
body, button, input, textarea, select, kbd { font-family: var(--font); }

/* light: the same shape, warm paper */
:root {
    --app: #f1f0ee; --rail: #f1f0ee; --ground: #f1f0ee;
    --bg: #ffffff; --panel: #ffffff; --well: #ffffff; --raise: #f5f4f2;
    --surf: #f5f4f2; --surf-2: #efeeeb; --sunk: #f8f7f5; --card-line: transparent;
    --hover: #f2f1ee; --sel: #ebeae7; --sel-2: #e2e1dd;
    --line: rgba(20, 18, 14, .07); --line-2: rgba(20, 18, 14, .13);
    --ink: #111110; --body: #2b2a28; --muted: #85837f; --faint: #a3a19c; --ghost: #c9c7c2;
    --good: #23a35b; --bad: #d1452f;
    --data: #f0702b; --data-2: #f7b48e; --data-soft: #fdeee4;
    --pill-good: #e7f5ec; --pill-bad: #fbe9e6;
    --glass: rgba(241, 240, 238, .55);
}
/* dark: his, to the pixel */
@media (prefers-color-scheme: dark) {
    :root {
        --app: #121110; --rail: #121110; --ground: #121110;
        --bg: #181715; --panel: #181715; --well: #181715; --raise: #252422;
        --surf: #252422; --surf-2: #2c2b28; --sunk: #141311; --card-line: transparent;
        --hover: #22211e; --sel: #2a2926; --sel-2: #33322e;
        --line: rgba(255, 250, 240, .06); --line-2: rgba(255, 250, 240, .1);
        --ink: #ffffff; --body: #ecebe8; --muted: #85837f; --faint: #646360; --ghost: #4a4946;
        --good: #43ca7c; --bad: #dd5142;
        --data: #fd803f; --data-2: #8a4a28; --data-soft: #2c1e15;
        --pill-good: #161e1a; --pill-bad: #211817;
        --glass: rgba(18, 17, 16, .4);
        --on: #ffffff; --on-ink: #111110; --accent: #ffffff; --accent-ink: #111110;
        --mark: #ffffff; --mark-ink: #111110;
    }
}

/* the page floats in the window; the rail and the window's edge are one */
body { background: var(--ground); }
.main { margin: 8px 8px 8px 0; border-radius: 16px; background: var(--bg); overflow: hidden;
    box-shadow: 0 0 0 1px var(--line); }
html.glass body { background: transparent; }

/* the rail: the app, the pages as pictures, and you at the foot */
.app:not(.wide) { grid-template-columns: 76px minmax(0, 1fr); }
.app:not(.wide) .sb { background: transparent; border-right: 0; padding: 0 0 12px; align-items: center; }
html.glass .app:not(.wide) .sb { background: var(--glass); }
.sb-app { display: none; }

.app:not(.wide) .sb-app:hover { transform: scale(1.06); }
.app:not(.wide) .sb-find { display: none; }
.app:not(.wide) .sb-nav { margin: 0; }
.app:not(.wide) .sb-nav > .mark { display: none; }
.app:not(.wide) .sb-grp + .sb-grp { margin: 10px 0 0; padding-top: 0; border-top: 0; }
.app:not(.wide) .sb .spot.pg, .app:not(.wide) .sb-foot .spot { width: 44px; height: 42px; border-radius: 10px; }
.app:not(.wide) .sb .spot.pg .ic, .app:not(.wide) .sb-foot .spot .ic { width: 21px; height: 21px; color: var(--muted); stroke-width: 1.5; }
.app:not(.wide) .sb .spot.pg:hover, .app:not(.wide) .sb-foot .spot:hover { background: rgba(255, 250, 240, .06); }
.app:not(.wide) .sb .spot.pg.on .ic, .app:not(.wide) .sb-foot .spot.on .ic { color: var(--ink); }
.app:not(.wide) .sb .spot.pg.on, .app:not(.wide) .sb-foot .spot.on { background: transparent; }
.app:not(.wide) .sb .spot.pg .count { top: 6px; right: 6px; min-width: 7px; width: 7px; height: 7px; padding: 0; font-size: 0;
    border-radius: 50%; background: var(--data); box-shadow: none; }
.app:not(.wide) .sb .spot.pg.on .count { background: var(--data); box-shadow: none; }
.app:not(.wide) .sb-foot { border-top: 0; padding-top: 4px; align-items: center; margin: 0; width: 100%; }
.app:not(.wide) .sb .you { order: 99; width: 100%; display: flex; justify-content: center;
    margin: 10px 0 0; padding-top: 12px; border-top: 1px solid var(--line); }
.app:not(.wide) .sb .you .me { width: 34px; height: 34px; border-radius: 50%; background: transparent; box-shadow: none; }
.app:not(.wide) .sb .you .face2.small { width: 30px; height: 30px; border-radius: 50%; }

/* the bar across the page: where you are, quietly */
.bar .where, .bar .where * { font-size: 15px; color: var(--muted); font-weight: 400; }
.bar .where b, .bar .where .now { color: var(--muted); font-weight: 400; }

/* the page: a column with room around it */
.page { padding: 44px 52px 64px; max-width: 1240px; }
.dh h1 { font-size: 34px; font-weight: 500; letter-spacing: -.02em; line-height: 1.1; }
.dh-w > p, .dh .when, .dh-w .sub { font-size: 15px; color: var(--muted); }

/* tiles: the number small and white at the top, the mark and its name in
   grey at the foot, nothing around them */
.kpis { gap: 9px; }
.kpi { min-height: 124px; border-radius: 18px; padding: 19px 21px 18px; gap: 20px; background: var(--surf); box-shadow: none; }
.kpi.go:hover { background: var(--surf-2); box-shadow: none; }
.kpi-v b { font-size: 22px; font-weight: 500; letter-spacing: -.01em; }
.kpi-v b small { font-size: 15px; font-weight: 400; color: var(--muted); }
.kpi-k { font-size: 15px; color: var(--muted); gap: 0; flex-direction: column; align-items: flex-start; }
.kpi-k .ic { width: 16px; height: 16px; color: #706c68; margin-bottom: 9px; }
.kpi-s { font-size: 13px; color: var(--faint); }
.kpi .pill { font-size: 13px; }

/* a block's name, and its rows on the page: 15 for both lines, white and
   grey, a round picture at the head of each */
.dpage .panel:not(.kpis) .dc-t, .dpage .panel:not(.kpis) > .cap { font-size: 15px; font-weight: 400; color: var(--muted); }
.dpage .dc-link { font-size: 14px; color: var(--muted); }
.dt-w b, .todo-t, .td-w b { font-size: 15px; font-weight: 500; color: var(--ink); }
.dt-w span, .td-w span { font-size: 14px; color: var(--muted); }
.dt-when, .dt-undo { font-size: 14px; color: var(--muted); }

/* the button on a row, the way his Details is */
.btn.line, .btn.small { height: 32px; padding: 0 14px; border-radius: 9px; font-size: 14px; font-weight: 500;
    background: transparent; color: var(--ink); border: 1px solid var(--line-2); box-shadow: none; }
.btn.line:hover, .btn.small:hover { background: var(--hover); border-color: var(--line-2); }
.btn.fill { border-radius: 9px; height: 32px; font-size: 14px; font-weight: 500; }

/* up and down, said in their own colour on their own dark */
.pill { border-radius: 5px; padding: 1px 7px; font-size: 13px; font-weight: 500; background: var(--sel); color: var(--muted); box-shadow: none; }
.pill.good { background: var(--pill-good); color: var(--good); }
.pill.bad { background: var(--pill-bad); color: var(--bad); }

/* the switch for 3, 6 and 12 months: quiet */
.dseg { box-shadow: none; background: var(--surf); border-radius: 9px; }
.dseg button { font-size: 13px; border-radius: 7px; }

/* the page's own colour reaches the edge of the panel it floats in */
.main .scroll, #app { background: transparent; }
/* the search across the top is a mark you press, not a field */
.app:not(.wide) .bar-find { width: 32px; min-width: 32px; height: 32px; padding: 0; justify-content: center; border-radius: 9px; box-shadow: none; background: transparent; }
.bar-find span, .bar-find kbd { display: none; }
.bar-find:hover { background: var(--hover); }
/* the picture at the head of a row is round, the way his are */
.dpage .ico, .dpage .td-ic { width: 34px; height: 34px; border-radius: 50%; background: var(--surf); box-shadow: none; border: 0; color: var(--muted); }
.dpage .tl-ic { width: 34px; height: 34px; border-radius: 50%; background: var(--surf); box-shadow: none; border: 0; color: var(--muted); }
.dpage .tl-w b { font-size: 15px; font-weight: 500; color: var(--ink); }
.dpage .tl-w span { font-size: 14px; color: var(--muted); }
.dpage .tl-row { min-height: 52px; }

/* ── v14: the window, closer to his ─────────────────────────────────────
   What still read as a generated dashboard after v13, fixed one by one off
   his pictures. The rail is the places, not every page. The window's edge
   and the rail are one piece of glass, so the page floats on it instead of
   sitting in a darker band; the bar is the page's own colour, not a strip
   of its own. The page in the dark is his warm near-black, warmer at the
   top left the way his is. Home and Send are one column with air around
   it: tiles, then rows on the page under a small grey name, each row a
   round picture, white words over grey ones, and a quiet outlined button.
   The readings are dots in three colours, his orange, violet and green. */

:root {
    --dot-1: #ef6f2c; --dot-2: #6c5fc8; --dot-3: #1f9a52; --dot-off: rgba(20, 18, 14, .08);
    --btn-line: rgba(20, 18, 14, .13);
    --chip: rgba(20, 18, 14, .05); --chip-hi: rgba(20, 18, 14, .09);
    --rail-hover: rgba(20, 18, 14, .06);
    --icon-tile: #9a9690;
    --page-paint: #ffffff;
}
@media (prefers-color-scheme: dark) {
    :root {
        --dot-1: #fd803f; --dot-2: #8579ce; --dot-3: #2ba35c; --dot-off: rgba(255, 250, 240, .06);
        --btn-line: rgba(255, 250, 240, .09);
        --chip: rgba(255, 250, 240, .06); --chip-hi: rgba(255, 250, 240, .1);
        --rail-hover: rgba(255, 250, 240, .07);
        --icon-tile: #706c68;
        --page-paint: radial-gradient(115% 75% at 0% 0%, #1e1913 0%, rgba(30, 25, 19, 0) 60%),
                      linear-gradient(100deg, #1a1815 0%, #181715 55%, #161615 100%);
    }
}

/* the frame: one piece of glass round the page, and the page on it */
html.glass .sb, html.glass .app:not(.wide) .sb { background: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; }
.main { background: var(--page-paint); box-shadow: 0 0 0 1px var(--line), 0 2px 10px rgba(0, 0, 0, .18); }
.main > .bar { background: transparent; border-bottom: 0; padding: 0 14px 0 18px; }

/* the rail: the app, the places, and Help, Settings and you at the foot */
.sb-places { display: none; }
.app:not(.wide) .sb-nav { display: none; }
.app:not(.wide) .sb-places { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1 1 auto; min-height: 0; width: 100%;
    overflow-y: auto; scrollbar-width: none; }
.app:not(.wide) .sb-places::-webkit-scrollbar { display: none; }
.app:not(.wide) .sb .sb-places .spot, .app:not(.wide) .sb .sb-foot .spot { width: 44px; min-width: 44px; height: 44px; padding: 0; justify-content: center;
    border-radius: 12px; background: transparent; color: var(--muted); }
.app:not(.wide) .sb .sb-places .spot .ic, .app:not(.wide) .sb .sb-foot .spot .ic { width: 20px; height: 20px; stroke-width: 1.5; color: inherit; }
.app:not(.wide) .sb .sb-places .spot .label { display: none; }
.app:not(.wide) .sb .sb-places .spot:hover, .app:not(.wide) .sb .sb-foot .spot:hover { background: var(--rail-hover); color: var(--ink); }
.app:not(.wide) .sb .sb-places .spot.on, .app:not(.wide) .sb .sb-places .spot.on:hover,
.app:not(.wide) .sb .sb-foot .spot.on { background: transparent; color: var(--ink); }
.app:not(.wide) .sb .sb-places .spot .count { position: absolute; top: 10px; right: 10px; width: 7px; min-width: 7px; height: 7px; padding: 0;
    border-radius: 50%; background: var(--data); color: transparent; font-size: 0; line-height: 0; box-shadow: none; }
.app:not(.wide) .sb .sb-places .spot .count.soft { display: none; }
.app:not(.wide) .sb-app { width: 28px; height: 28px; margin: 8px 0 20px; border-radius: 7px; }
.app:not(.wide) .sb-foot { gap: 2px; }

/* the bar: where you are, in grey; on Home how old the reading is */
.bar-age { font-size: 13px; color: var(--faint); white-space: nowrap; }
.bar-age[hidden], .bar-refresh[hidden] { display: none !important; }
.bar .bar-refresh .ic { width: 16px; height: 16px; }
.bar .where .tabs { margin-left: 8px; padding: 0; gap: 2px; background: none; box-shadow: none; border-radius: 9px; }
.bar .where .tabs .glide { top: 0; bottom: 0; border-radius: 9px; background: var(--surf); box-shadow: none; }
.bar .where .tab { height: 32px; padding: 0 12px; border-radius: 9px; font-size: 14px; color: var(--muted); }
.bar .where .tab:hover { color: var(--ink); }
.bar .where .tab.on { color: var(--ink); font-weight: 400; }
.bar .where .tab .tc { font-size: 12px; color: var(--faint); }
.bar .where .tab.on .tc { color: var(--muted); }

/* one column with air round it */
.page > div.dpage.col { width: 100%; max-width: 860px; margin-inline: auto; gap: 46px; }
.page > div.dpage.col > .dh + * { margin-top: -16px !important; }
.dpage.col .dh { padding: 0; }
.dpage.col .dh h1 { font-size: 36px; font-weight: 500; letter-spacing: -.022em; line-height: 1.12; }
.dpage.col .panel:not(.kpis) { gap: 12px; }
.dpage.col .dc-n { font-size: 14px; color: var(--faint); }
.dpage.col .dc-link { font-size: 14px; }
.dpage.col .dc-link.do { gap: 6px; color: var(--muted); }
.dpage.col .dc-link.do .ic { width: 14px; height: 14px; }
.dpage.col .dc-link.do:hover { color: var(--ink); }
.dpage.col .d-none { padding: 6px 0 0; font-size: 15px; color: var(--faint); }
.dpage.col .tl > .d-none, .dpage.col .fs > .d-none { padding: 6px 12px 0; }

/* tiles: the number at the top, the mark and its name at the foot, room
   between, no line round them */
.dpage.col .kpis { gap: 8px; }
.dpage.col .kpi { min-height: 144px; border-radius: 18px; padding: 17px 19px 16px; gap: 16px; background: var(--surf); box-shadow: none; }
.dpage.col .kpi-v b { font-size: 24px; font-weight: 500; letter-spacing: -.01em; }
.dpage.col .kpi-v b small { margin-left: 4px; font-size: 15px; font-weight: 400; color: var(--muted); }
.dpage.col .kpi-k { font-size: 15px; color: var(--muted); }
.dpage.col .kpi-k .ic { width: 19px; height: 19px; margin-bottom: 8px; stroke-width: 1.5; color: var(--icon-tile); }

/* rows on the page: a round picture, white over grey, a quiet button */
.dpage.col .tl { margin: 0 -12px; gap: 0; }
.dpage.col .tl-row { min-height: 60px; padding: 8px 12px; gap: 14px; border-radius: 12px; }
.dpage.col .tl-ic { width: 34px; height: 34px; border-radius: 50%; background: var(--surf); color: var(--muted); box-shadow: none; border: 0; }
.dpage.col .tl-ic .ic { width: 17px; height: 17px; stroke-width: 1.5; }
.dpage.col .tl-row.is-done .tl-ic { color: var(--good); }
.dpage.col .tl-w { gap: 2px; }
.dpage.col .tl-w b { font-size: 15px; font-weight: 400; color: var(--ink); }
.dpage.col .tl-w span { font-size: 15px; color: var(--muted); }
.tl-when { flex: none; min-width: 48px; text-align: right; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.btn.line, .btn.small, .dpage.col .tl-do.btn.small { height: 32px; padding: 0 15px; border-radius: 9px; font-size: 14px; font-weight: 400;
    background: transparent; color: var(--ink); border: 1px solid var(--btn-line); box-shadow: none; }
.btn.line:hover, .btn.small:hover, .dpage.col .tl-do.btn.small:hover { background: var(--hover); border-color: var(--btn-line); }
.dpage.col .tl-key { min-width: 32px; height: 32px; padding: 0 9px; border-radius: 9px; background: transparent; border: 1px solid var(--btn-line);
    font-size: 14px; font-weight: 400; color: var(--muted); }
.dpage.col .pill { height: 22px; gap: 4px; padding: 0 7px; border-radius: 5px; font-size: 14px; font-weight: 400; font-variant-numeric: tabular-nums; }
.dpage.col .pill .ic { width: 12px; height: 12px; }

/* your folders: when things landed, a dot a day */
.fs { display: flex; flex-direction: column; margin: 0 -12px; }
.fs-days, .fs-row { display: grid; grid-template-columns: 34px 112px minmax(0, 1fr) 76px 108px; column-gap: 14px; align-items: center; padding: 0 12px; }
.fs-days { height: 18px; }
.fs-lbls { grid-column: 3; position: relative; height: 18px; }
.fs-lbls span { position: absolute; top: 0; font-size: 12px; line-height: 18px; color: var(--faint); white-space: nowrap; }
.fs-row { min-height: 52px; border-radius: 12px; cursor: pointer; outline: none; transition: background .12s ease; }
.fs-row:hover { background: var(--hover); }
.fs-row:focus-visible { box-shadow: inset 0 0 0 2px var(--ink); }
.fs-row.c1 { --c: var(--dot-1); }
.fs-row.c2 { --c: var(--dot-2); }
.fs-row.c3 { --c: var(--dot-3); }
.fs-ic { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--surf); color: var(--muted); }
.fs-ic .ic { width: 17px; height: 17px; stroke-width: 1.5; }
.fs-n { font-size: 15px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fs-dots { display: grid; grid-template-columns: repeat(56, minmax(0, 1fr)); align-items: center; height: 16px; }
.fs-d { position: relative; width: 5px; height: 5px; border-radius: 1.5px; background: var(--dot-off); }
.fs-d.on { background: var(--c, var(--data)); transition: transform .14s var(--spring); }
.fs-d.on::after { content: ""; position: absolute; inset: -6px; }
.fs-d.on:hover { transform: scale(1.7); }
.fs-c { font-size: 15px; color: var(--ink); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.fs-p { display: flex; justify-content: flex-end; gap: 6px; }
.fs-shut { font-size: 14px; color: var(--faint); }
.arrive .fs-d.on { animation: fade .4s ease calc(var(--d, 60ms) + 260ms) backwards; }
@container (max-width: 620px) {
    .fs-days, .fs-row { grid-template-columns: 34px minmax(0, 1fr) auto auto; }
    .fs-dots, .fs-lbls, .fs-shut { display: none; }
}

/* ── Send, the way his composer and his pull request are ── */
.snd-wrap { display: flex; flex-direction: column; gap: 10px; }
.dpage .panel.snd { gap: 4px; padding: 14px 14px 14px 20px; border-radius: 20px; background: var(--surf); border: 0; box-shadow: none;
    transition: box-shadow .15s ease; }
body.dropping .dpage .panel.snd { box-shadow: inset 0 0 0 1.5px var(--data); }
.sc-top { display: flex; align-items: center; gap: 12px; min-height: 40px; }
.sc-to { flex: 1; min-width: 0; display: flex; align-items: center; gap: 1px; cursor: text; }
.sc-to .at { font-size: 19px; color: var(--faint); }
.snd .snd-field { flex: 1; min-width: 0; height: 40px; border: 0; outline: none; background: none; font-size: 19px; color: var(--ink); }
.snd .snd-field::placeholder { color: var(--faint); }
.sc-top .dc-n { font-size: 14px; color: var(--muted); padding-right: 6px; }
.snd .snd-who { min-height: 20px; gap: 7px; font-size: 14px; color: var(--muted); }
.snd .snd-who .ic { width: 15px; height: 15px; }
.sc-foot { display: flex; align-items: flex-end; gap: 12px; margin-top: 16px; }
.sc-chips { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.sc-file, .sc-people { display: contents; }
.sc-chip { max-width: 100%; height: 36px; display: inline-flex; align-items: center; gap: 8px; padding: 0 15px 0 12px; border-radius: 999px;
    background: var(--chip); color: var(--body); font-size: 14px; white-space: nowrap; transition: background .12s ease, color .12s ease; }
.sc-chip:hover { background: var(--chip-hi); }
.sc-chip .ic { width: 16px; height: 16px; color: var(--muted); }
.sc-chip.sp { padding: 0 14px 0 5px; }
.sc-chip.sp .pf, .lv-who .pf { position: relative; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; flex: none;
    background: var(--sel-2); color: var(--ink); font-size: 12px; font-weight: 500; }
.sc-chip.sp.near .pf::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 8px; height: 8px; border-radius: 50%;
    background: var(--good); box-shadow: 0 0 0 2px var(--surf); }
.sc-chip.sp.on { background: var(--ink); color: var(--on-ink); }
.sc-chip.sp.on .pf { background: color-mix(in srgb, var(--on-ink) 14%, transparent); color: var(--on-ink); }
.sc-chip.file { gap: 0; padding: 0; }
.chip-in { height: 100%; min-width: 0; display: inline-flex; align-items: center; gap: 8px; padding: 0 4px 0 7px; color: inherit; }
.chip-in img { width: 24px; height: 24px; object-fit: contain; flex: none; }
.chip-in b { min-width: 0; max-width: 260px; font-weight: 400; color: var(--ink); overflow: hidden; text-overflow: ellipsis; }
.chip-in span { color: var(--muted); }
.chip-x { width: 28px; height: 28px; margin-right: 4px; border-radius: 50%; display: grid; place-items: center; flex: none; color: var(--muted); }
.chip-x:hover { background: var(--chip-hi); color: var(--ink); }
.chip-x .ic { width: 13px; height: 13px; }
.sc-go { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--on-ink);
    transition: transform .16s var(--spring), background .15s ease, color .15s ease; }
.sc-go .ic { width: 18px; height: 18px; stroke-width: 2; }
.sc-go:hover:not(:disabled) { transform: scale(1.07); }
.sc-go:disabled { background: var(--sel-2); color: var(--faint); cursor: default; }
.snd-how { display: flex; align-items: center; gap: 7px; padding: 0 6px; font-size: 13px; color: var(--faint); }
.snd-how .ic { width: 14px; height: 14px; flex: none; }
.snd-how:empty { display: none; }

/* one file on its way */
.dpage .panel.snd.is-live { padding: 20px 22px 18px; gap: 0; }
.td { display: flex; flex-direction: column; min-width: 0; }
.td-st { display: flex; align-items: center; gap: 7px; font-size: 15px; color: var(--muted); }
.td-st .ic { width: 17px; height: 17px; stroke-width: 1.8; }
.td-st.good { color: var(--good); }
.td-st.bad { color: var(--bad); }
.td-name { margin-top: 8px; font-size: 21px; font-weight: 500; letter-spacing: -.012em; line-height: 1.25; color: var(--ink);
    overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.td-bar { margin-top: 14px; height: 4px; border-radius: 99px; overflow: hidden; background: var(--sel-2); }
.td-bar i { display: block; height: 100%; border-radius: 99px; background: var(--good); transition: width .2s linear; }
.td-bar.bad i { background: var(--bad); }
.td-why { margin-top: 8px; font-size: 14px; color: var(--muted); }
.lv { display: grid; margin: 14px 0 0; }
.lv > div { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 38px; }
.lv dt { flex: none; font-size: 15px; color: var(--muted); }
.lv dd { min-width: 0; display: flex; align-items: center; justify-content: flex-end; gap: 10px; font-size: 15px; color: var(--ink); text-align: right; }
.lv-who { display: inline-flex; align-items: center; gap: 8px; }
.lv-who .pf { width: 24px; height: 24px; font-size: 11px; }
.lv-sub { color: var(--muted); }
.lv .ad-where .dot { margin: 0; }
.daddr .lv { margin: 0; }
.snd-acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.sheet-card.in { gap: 14px; }
.sheet-card.in .td { margin-top: 2px; }
.sheet-card.in .sh-small { margin-top: 0; font-size: 13px; }

/* every transfer, as rows */
.dpage.col .tl.tx { margin: 0 -12px; }
.dpage.col .tl-row.tx-row { display: flex; grid-template-columns: none; border-top: 0; padding: 8px 12px; }
.dpage.col .tx-st { flex: none; width: 150px; display: flex; justify-content: flex-end; }
.dpage.col .tx-st .tx-prog { width: 150px; }
.dpage.col .tx-act { flex: none; display: flex; gap: 6px; }
